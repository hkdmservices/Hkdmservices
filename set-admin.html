<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>HKDMservices - Activate Admin</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        h1 {
            margin: 0 0 10px;
            font-size: 26px;
            color: #111827;
        }
        .description {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .email {
            background: #f3f4f6;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            font-weight: 600;
            color: #374151;
            word-break: break-word;
        }
        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 14px 18px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            display: none;
            line-height: 1.5;
        }
        .success {
            display: block !important;
            background: #dcfce7;
            color: #166534;
        }
        .error {
            display: block !important;
            background: #fee2e2;
            color: #991b1b;
        }
        .info {
            display: block !important;
            background: #dbeafe;
            color: #1e40af;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>
            Activate Administrator
        </h1>
        <p class="description">
            This page will activate administrator
            privileges for the currently signed-in
            administrator account.
        </p>
        <div
            id="email"
            class="email"
        >
            Checking account...
        </div>
        <button
            id="activateAdmin"
            disabled
        >
            Activate Admin
        </button>
        <div
            id="message"
        ></div>
    </div>

    <!-- ============================================================
         FIREBASE LOGIC (Added – Your Design is Untouched)
    ============================================================ -->
    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js",
            "firebase/database": "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js"
        }
    }
    </script>

    <script type="module">
    import { initializeApp } from "firebase/app";
    import { getAuth, onAuthStateChanged } from "firebase/auth";
    import { getDatabase, ref, get, set } from "firebase/database";

    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyADhpdfM0GaMJIkeQw7Q6eBK3u9CaWUC9k",
        authDomain: "hkdmservices-7d59f.firebaseapp.com",
        databaseURL: "https://hkdmservices-7d59f-default-rtdb.firebaseio.com",
        projectId: "hkdmservices-7d59f",
        storageBucket: "hkdmservices-7d59f.firebasestorage.app",
        messagingSenderId: "839538334772",
        appId: "1:839538334772:web:7d8785f87363b6e5d8fe61"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    const emailDisplay = document.getElementById("email");
    const activateBtn = document.getElementById("activateAdmin");
    const messageDiv = document.getElementById("message");

    let currentUser = null;

    // ============================================================
    // CHECK AUTH STATE
    // ============================================================
    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            emailDisplay.textContent = "⚠️ No user signed in. Please log in first.";
            activateBtn.disabled = true;
            showMessage("Please log in to your account before activating admin.", "info");
            // Redirect to login after a moment
            setTimeout(() => {
                window.location.href = "login.html";
            }, 3000);
            return;
        }

        currentUser = user;
        emailDisplay.textContent = `👤 ${user.email || "No email"}`;
        activateBtn.disabled = false;

        // Check if user is already an admin
        try {
            const userRef = ref(database, `users/${user.uid}`);
            const snapshot = await get(userRef);
            const userData = snapshot.val();

            if (userData && (userData.role === "admin" || userData.isAdmin === true)) {
                showMessage("✅ This account already has admin privileges.", "info");
                activateBtn.disabled = true;
                activateBtn.textContent = "Already Admin";
            } else {
                activateBtn.disabled = false;
                activateBtn.textContent = "Activate Admin";
            }
        } catch (error) {
            console.error("Error checking admin status:", error);
            // Assume not admin, allow activation
            activateBtn.disabled = false;
            activateBtn.textContent = "Activate Admin";
        }
    });

    // ============================================================
    // ACTIVATE ADMIN
    // ============================================================
    activateBtn.addEventListener("click", async () => {
        if (!currentUser) {
            showMessage("❌ No user signed in. Please log in first.", "error");
            return;
        }

        // Disable button during process
        activateBtn.disabled = true;
        activateBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Activating...`;

        try {
            const userRef = ref(database, `users/${currentUser.uid}`);

            // Check if user already has admin role
            const snapshot = await get(userRef);
            const userData = snapshot.val();

            if (userData && (userData.role === "admin" || userData.isAdmin === true)) {
                showMessage("✅ This account already has admin privileges.", "info");
                activateBtn.disabled = true;
                activateBtn.textContent = "Already Admin";
                return;
            }

            // Set admin privileges
            await set(userRef, {
                ...userData,
                role: "admin",
                isAdmin: true,
                adminActivatedAt: Date.now()
            });

            showMessage("✅ Admin privileges activated successfully! You can now access the admin dashboard.", "success");
            activateBtn.disabled = true;
            activateBtn.textContent = "✅ Admin Activated";

            // Redirect to admin dashboard after 2 seconds
            setTimeout(() => {
                window.location.href = "admin-dashboard.html";
            }, 2000);

        } catch (error) {
            console.error("Admin activation error:", error);
            showMessage("❌ Failed to activate admin: " + error.message, "error");
            activateBtn.disabled = false;
            activateBtn.innerHTML = "Activate Admin";
        }
    });

    // ============================================================
    // HELPER: SHOW MESSAGE
    // ============================================================
    function showMessage(text, type) {
        messageDiv.textContent = text;
        messageDiv.className = type; // "success", "error", or "info"
        messageDiv.style.display = "block";
    }

    console.log("✅ Set Admin page loaded with Firebase logic.");
    </script>

    <!-- Original script (kept for compatibility, but overridden by inline logic) -->
    <script
        type="module"
        src="./set-admin.js"
    ></script>
</body>
</html>
