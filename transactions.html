<!DOCTYPE html>
<html lang="en">

<head>

content="width=device-width, initial-scale=1.0">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"

<a
href="dashboard.html"

Dashboard

</a>

</nav>



<!-- MAIN -->

<section class="py-5">

<div class="container">


<div class="d-flex
justify-content-between
align-items-center
mb-4">

<div>

<p class="text-muted mb-0">

<th>
Status

</tr>

</thead>


<tbody id="transactionsBody">

<tr>

<td
colspan="5"

</p>

</td>

</tr>

</tbody>

</table>
