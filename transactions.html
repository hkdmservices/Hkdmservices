<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions | HKDMservices</title>
    <script src="theme.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <style>
        html[data-theme="dark"] body { background: #101418; color: #f1f3f5; }
        html[data-theme="dark"] .card { background: #181d22 !important; border-color: #30363d !important; color: #f1f3f5 !important; }
        html[data-theme="dark"] .table { color: #f1f3f5 !important; border-color: #30363d !important; }
        html[data-theme="dark"] .table-dark { background-color: #151a1f !important; color: #f1f3f5 !important; border-color: #30363d !important; }
        html[data-theme="dark"] .table-hover tbody tr:hover { background-color: rgba(255, 255, 255, 0.04) !important; color: #f1f3f5 !important; }
        html[data-theme="dark"] .text-muted { color: #99a1ab !important; }
        .theme-toggle { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; transition: background 0.2s ease, transform 0.2s ease; }
        .theme-toggle:hover { background: rgba(255,255,255,0.18); transform: rotate(15deg); }
        .badge-refund { background-color: #ffc107; color: #000; }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold" href="dashboard.html">
                <span class="brand-icon">⬢</span> HKDMservices
            </a>
            <div class="d-flex align-items-center gap-2">
                <button type="button" id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
                    <i id="themeIcon" class="bi bi-moon-stars-fill"></i>
                </button>
                <a href="dashboard.html" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-arrow-left"></i> Dashboard
                </a>
            </div>
        </div>
    </nav>

    <section class="py-5">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold mb-1">Transactions</h1>
                    <p class="text-muted mb-0">Your wallet and order transactions</p>
                </div>
                <button class="btn btn-sm btn-outline-success" id="refreshBtn">
                    <i class="bi bi-arrow-clockwise"></i> Refresh
                </button>
            </div>

            <div class="card shadow border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>Date</th>
                                    <th>Type</th>
                                    <th>Description</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="transactionsBody">
                                <tr>
                                    <td colspan="5" class="text-center py-5">
                                        <div class="spinner-border text-success" role="status"></div>
                                        <p class="mt-3 mb-0">Loading transactions...</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div id="message" class="alert mt-4 d-none"></div>
        </div>
    </section>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, onAuthStateChanged } from "firebase/auth";
        import { getDatabase, ref, onValue } from "firebase/database";

        const firebaseConfig = {
            apiKey: "AIzaSyADhpdfM0GaMJIkeQw7Q6eBK3u9CaWUC9k",
            authDomain: "hkdmservices-7d59f.firebaseapp.com",
            databaseURL: "https://hkdmservices-7d59f-default-rtdb.firebaseio.com",
            projectId: "hkdmservices-7d59f",
            storageBucket: "hkdmservices-7d59f.firebasestorage.app",
            messagingSenderId: "839538334772",
            appId: "1:839538334772:web:7d8785f87363b6e5d8fe61"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        const tbody = document.getElementById("transactionsBody");
        const messageDiv = document.getElementById("message");
        const refreshBtn = document.getElementById("refreshBtn");
        let currentUid = null;

        // Format amount with proper sign
        function formatAmount(amount, type) {
            const num = Number(amount) || 0;
            const formatted = Math.abs(num).toLocaleString("en-NG", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
            
            // Refunds and funding show as positive (credit)
            if (type === 'refund' || type === 'wallet_funding') {
                return `+₦${formatted}`;
            }
            // Orders show as negative (debit)
            if (type === 'order_payment' || type === 'order') {
                return `-₦${formatted}`;
            }
            // Default: show as is
            return num < 0 ? `-₦${formatted}` : `+₦${formatted}`;
        }

        // Get badge class for type
        function getTypeBadge(type) {
            switch (type) {
                case "wallet_funding":
                    return '<span class="badge bg-success"><i class="bi bi-wallet2"></i> Funding</span>';
                case "order_payment":
                case "order":
                    return '<span class="badge bg-primary"><i class="bi bi-cart-check"></i> Order</span>';
                case "refund":
                    return '<span class="badge bg-warning text-dark"><i class="bi bi-arrow-counterclockwise"></i> Refund</span>';
                case "voucher":
                    return '<span class="badge bg-info text-dark"><i class="bi bi-ticket"></i> Voucher</span>';
                default:
                    return '<span class="badge bg-secondary">' + type + '</span>';
            }
        }

        // Get amount class
        function getAmountClass(type) {
            if (type === 'refund' || type === 'wallet_funding') {
                return 'text-success';
            }
            if (type === 'order_payment' || type === 'order') {
                return 'text-danger';
            }
            return '';
        }

        // Load transactions
        function loadTransactions() {
            if (!currentUid) return;
            
            const transactionsRef = ref(database, "transactions");

            onValue(transactionsRef, (snapshot) => {
                const data = snapshot.val();
                tbody.innerHTML = "";

                if (!data) {
                    tbody.innerHTML = `
                        <tr><td colspan="5" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox fs-1"></i>
                            <p class="mt-2">No transactions found.</p>
                        </td></tr>
                    `;
                    return;
                }

                const userTransactions = Object.entries(data)
                    .filter(([key, tx]) => tx.uid === currentUid)
                    .sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));

                if (userTransactions.length === 0) {
                    tbody.innerHTML = `
                        <tr><td colspan="5" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox fs-1"></i>
                            <p class="mt-2">No transactions found.</p>
                        </td></tr>
                    `;
                    return;
                }

                userTransactions.forEach(([key, tx]) => {
                    const row = document.createElement("tr");

                    const date = tx.createdAt ? new Date(tx.createdAt) : new Date();
                    const dateStr = date.toLocaleDateString("en-GB") + " " +
                        date.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });

                    const typeBadge = getTypeBadge(tx.type);
                    const amountClass = getAmountClass(tx.type);
                    const displayAmount = formatAmount(tx.amount, tx.type);

                    let statusBadge = '';
                    if (tx.status === "success") {
                        statusBadge = '<span class="badge bg-success">Success</span>';
                    } else if (tx.status === "pending") {
                        statusBadge = '<span class="badge bg-warning text-dark">Pending</span>';
                    } else {
                        statusBadge = '<span class="badge bg-danger">Failed</span>';
                    }

                    row.innerHTML = `
                        <td><small>${dateStr}</small></td>
                        <td>${typeBadge}</td>
                        <td>${tx.description || "N/A"}</td>
                        <td class="${amountClass} fw-bold">${displayAmount}</td>
                        <td>${statusBadge}</td>
                    `;

                    tbody.appendChild(row);
                });

                console.log(`✅ Loaded ${userTransactions.length} transactions`);

            }, (error) => {
                console.error("Transactions error:", error);
                showMessage("❌ Failed to load transactions: " + error.message, "danger");
            });
        }

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = "alert alert-" + type + " mt-4";
            messageDiv.classList.remove("d-none");
            setTimeout(() => {
                messageDiv.classList.add("d-none");
            }, 6000);
        }

        // Auth check
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }
            currentUid = user.uid;
            loadTransactions();
        });

        // Refresh button
        refreshBtn.addEventListener('click', () => {
            if (currentUid) {
                loadTransactions();
                showMessage('🔄 Refreshing transactions...', 'info');
            }
        });

        console.log("✅ Transactions page loaded with Firebase!");
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
