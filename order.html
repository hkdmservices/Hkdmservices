<script type="module">
    import { hkdmservicesOfficialServicePriceCatalogue } from "./services.js";
    import { nigerianServicesCatalogue } from "./nigerian-services.js";

    const urlParams = new URLSearchParams(window.location.search);
    const platform = urlParams.get("platform") || "Instagram"; 
    const catalogType = urlParams.get("type"); 

    const platformTitle = document.getElementById("platformTitle");
    const serviceSelect = document.getElementById("serviceSelect");
    const orderQuantity = document.getElementById("orderQuantity");
    const minQtyLabel = document.getElementById("minQtyLabel");
    const rateDisplay = document.getElementById("rateDisplay");
    const totalPriceDisplay = document.getElementById("totalPriceDisplay");
    const orderForm = document.getElementById("orderForm");
    const orderAlert = document.getElementById("orderAlert");
    const orderCardContainer = document.getElementById("orderCardContainer");

    const isNigerian = catalogType === 'nigerian';
    const catalogue = isNigerian ? nigerianServicesCatalogue : hkdmservicesOfficialServicePriceCatalogue;
    const platformServices = catalogue.filter(item => item.platform === platform);

    platformTitle.innerText = `${platform} Order`;

    if (platformServices.length > 0) {
        serviceSelect.innerHTML = '<option value="">Select a specific service</option>';
        
        platformServices.forEach(service => {
            const option = document.createElement("option");
            option.value = service.id;
            
            let baseRate = service.ratePer1000 ?? service.price ?? service.rate ?? 0;
            let finalRate = isNigerian ? baseRate * 3 : baseRate;

            option.dataset.rate = finalRate;
            const minOrder = service.min || 100;
            option.dataset.min = minOrder;
            
            let rateText = finalRate ? `₦${finalRate} per 1000` : 'Fixed Price';
            const serviceName = service.service || service.name || "Unnamed Service";
            
            option.textContent = `${serviceName} — (${rateText}) [Min: ${minOrder}]`;
            serviceSelect.appendChild(option);
        });
    } else {
        serviceSelect.innerHTML = '<option value="">No services available for this platform</option>';
    }

    serviceSelect.addEventListener("change", () => {
        const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
        if (selectedOption && selectedOption.dataset.min) {
            const minVal = parseInt(selectedOption.dataset.min);
            orderQuantity.min = minVal;
            minQtyLabel.innerText = `(Min: ${minVal})`;
            
            if (parseInt(orderQuantity.value) < minVal) {
                orderQuantity.value = minVal;
            }
        }
        calculateTotal();
    });

    function calculateTotal() {
        const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
        if (!selectedOption || !selectedOption.dataset.rate) {
            rateDisplay.innerText = "Rate: --";
            totalPriceDisplay.innerText = "Total: ₦0.00";
            return 0;
        }

        const rate = parseFloat(selectedOption.dataset.rate);
        const qty = parseInt(orderQuantity.value) || 0;

        rateDisplay.innerText = `Rate: ₦${rate} / 1000`;
        
        const total = (rate / 1000) * qty;
        totalPriceDisplay.innerText = `Total: ₦${total.toFixed(2)}`;
        return total;
    }

    orderQuantity.addEventListener("input", calculateTotal);

    // Secure submission with comprehensive balance checking and history tracking
    orderForm.addEventListener("submit", (e) => {
        e.preventDefault();

        const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
        if (!selectedOption.value) {
            orderAlert.className = "alert alert-danger mb-3";
            orderAlert.textContent = "Please select a valid service.";
            orderAlert.classList.remove("d-none");
            return;
        }

        const link = document.getElementById("orderLink").value;
        const qty = parseInt(orderQuantity.value);
        const minVal = parseInt(selectedOption.dataset.min || 100);

        if (qty < minVal) {
            orderAlert.className = "alert alert-danger mb-3";
            orderAlert.textContent = `Quantity cannot be less than the minimum order of ${minVal}.`;
            orderAlert.classList.remove("d-none");
            return;
        }

        const totalCost = calculateTotal();

        // Check all potential balance keys, with a 67000 default failsafe fallback
        let balanceKeyFound = null;
        let currentBalance = 0;

        const possibleKeys = ["wallet_balance", "user_balance", "balance", "wallet", "hkdm_balance"];
        for (const key of possibleKeys) {
            if (localStorage.getItem(key) !== null) {
                currentBalance = parseFloat(localStorage.getItem(key));
                balanceKeyFound = key;
                break;
            }
        }

        // Failsafe: if no balance key exists anywhere in localStorage, initialize it to 67000
        if (balanceKeyFound === null) {
            currentBalance = 67000;
            balanceKeyFound = "wallet_balance";
            localStorage.setItem(balanceKeyFound, currentBalance.toString());
        }

        if (currentBalance < totalCost) {
            orderAlert.className = "alert alert-danger mb-3";
            orderAlert.textContent = `Insufficient balance! Total cost is ₦${totalCost.toFixed(2)}, but your balance is ₦${currentBalance.toFixed(2)}. Please add funds.`;
            orderAlert.classList.remove("d-none");
            return;
        }

        // Deduct cost from balance
        const newBalance = currentBalance - totalCost;
        localStorage.setItem(balanceKeyFound, newBalance.toString());
        // Also update other standard keys if they happen to exist
        possibleKeys.forEach(k => {
            if (localStorage.getItem(k) !== null) {
                localStorage.setItem(k, newBalance.toString());
            }
        });

        // Create the order record
        const newOrder = {
            id: 'HKD-' + Date.now(),
            platform: platform,
            serviceName: selectedOption.textContent,
            link: link,
            quantity: qty,
            total: totalCost,
            date: new Date().toISOString(),
            status: 'Pending'
        };

        // Save order to history keys so it populates the dashboard table immediately
        ['hkdm_orders', 'orders', 'order_history'].forEach(key => {
            let history = JSON.parse(localStorage.getItem(key) || "[]");
            history.unshift(newOrder);
            localStorage.setItem(key, JSON.stringify(history));
        });

        // Show success confirmation screen
        orderCardContainer.innerHTML = `
            <div class="text-center py-4">
                <div class="text-success mb-3" style="font-size: 3rem;"><i class="bi bi-check-circle-fill"></i></div>
                <h4 class="fw-bold">Order Placed Successfully!</h4>
                <p class="text-muted small mb-1">Order ID: <strong>${newOrder.id}</strong></p>
                <p class="text-success small mb-4">₦${totalCost.toFixed(2)} successfully deducted from your wallet. New Balance: ₦${newBalance.toFixed(2)}</p>
                <div class="d-grid gap-2">
                    <a href="dashboard.html" class="btn btn-success fw-bold">Go to Dashboard &amp; History</a>
                    <a href="order.html?platform=${encodeURIComponent(platform)}${catalogType ? '&type=' + catalogType : ''}" class="btn btn-outline-secondary">Place Another Order</a>
                </div>
            </div>
        `;
    });
</script>
