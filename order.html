<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKDMservices | Place Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">
            <span class="brand-icon">⬢</span> HKDMservices
        </a>
        <div class="d-flex gap-2">
            <a href="services.html" class="btn btn-outline-light">
                <i class="bi bi-arrow-left"></i> Back to Services
            </a>
        </div>
    </div>
</nav>

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <div class="card shadow-sm border-0 p-4">
                    <h3 class="fw-bold text-center mb-3" id="platformTitle">Loading...</h3>
                    <p class="text-center text-muted mb-4" id="catalogBadge"></p>

                    <!-- Order Form -->
                    <form id="orderForm">
                        <div class="mb-3">
                            <label for="serviceSelect" class="form-label fw-semibold">Select Service</label>
                            <select id="serviceSelect" class="form-select" required>
                                <option value="">Loading services...</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="orderLink" class="form-label fw-semibold">Target Link / URL</label>
                            <input type="url" id="orderLink" class="form-control" placeholder="https://" required>
                        </div>

                        <div class="mb-3">
                            <label for="orderQuantity" class="form-label fw-semibold">Quantity</label>
                            <input type="number" id="orderQuantity" class="form-control" min="1" required>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-success fw-bold py-2">Submit Order</button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
</section>

<script type="module">
    import { hkdmservicesOfficialServicePriceCatalogue } from "./services.js";
    import { nigerianServicesCatalogue } from "./nigerian-services.js";

    // 1. Read URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const platform = urlParams.get("platform");
    const catalogType = urlParams.get("type"); // Checks if type=nigerian

    const platformTitle = document.getElementById("platformTitle");
    const catalogBadge = document.getElementById("catalogBadge");
    const serviceSelect = document.getElementById("serviceSelect");

    if (!platform) {
        platformTitle.innerText = "Error";
        catalogBadge.innerText = "No platform specified.";
        serviceSelect.innerHTML = '<option value="">Please go back and select a platform.</option>';
    } else {
        // 2. Select correct catalogue based on type parameter
        const catalogue = (catalogType === 'nigerian') ? nigerianServicesCatalogue : hkdmservicesOfficialServicePriceCatalogue;
        
        // 3. Filter services for the chosen platform
        const platformServices = catalogue.filter(item => item.platform === platform);

        platformTitle.innerText = `${platform} Order`;
        
        if (catalogType === 'nigerian') {
            catalogBadge.innerHTML = '<span class="badge bg-success">🇳🇬 Geo-Targeted Nigerian Panel (3x Rate)</span>';
        } else {
            catalogBadge.innerHTML = '<span class="badge bg-secondary">General Services Panel</span>';
        }

        if (platformServices.length > 0) {
            serviceSelect.innerHTML = '<option value="">Select a specific service</option>';
            platformServices.forEach(service => {
                const option = document.createElement("option");
                option.value = service.id;
                option.textContent = `${service.service} (Rate: ${service.rate || 'Fixed'})`;
                serviceSelect.appendChild(option);
            });
        } else {
            serviceSelect.innerHTML = '<option value="">No services available for this platform</option>';
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
