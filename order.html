<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKDMservices | Place Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">
            <span class="brand-icon">⬢</span> HKDMservices
        </a>
        <div class="d-flex gap-2">
            <a href="services.html" class="btn btn-outline-light">
                <i class="bi bi-arrow-left"></i> Back to Services
            </a>
        </div>
    </div>
</nav>

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <div class="card shadow-sm border-0 p-4">
                    <h3 class="fw-bold text-center mb-4" id="platformTitle">Loading...</h3>

                    <!-- Order Form -->
                    <form id="orderForm">
                        <div class="mb-3">
                            <label for="serviceSelect" class="form-label fw-semibold">Select Service</label>
                            <select id="serviceSelect" class="form-select" required>
                                <option value="">Loading services...</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="orderLink" class="form-label fw-semibold">Target Link / URL</label>
                            <input type="url" id="orderLink" class="form-control" placeholder="https://" required>
                        </div>

                        <div class="mb-3">
                            <label for="orderQuantity" class="form-label fw-semibold">Quantity <span id="minQtyLabel" class="text-muted fw-normal small"></span></label>
                            <input type="number" id="orderQuantity" class="form-control" min="100" value="1000" required>
                        </div>

                        <!-- Background Live Calculation Display -->
                        <div class="alert alert-light border mb-3 py-2 px-3 d-flex justify-content-between align-items-center">
                            <span class="text-muted small" id="rateDisplay">Rate: --</span>
                            <span class="fw-bold text-success" id="totalPriceDisplay">Total: ₦0.00</span>
                        </div>

                        <div id="orderAlert" class="alert d-none mb-3" role="alert"></div>

                        <div class="d-grid mt-4">
                            <button type="submit" id="submitBtn" class="btn btn-success fw-bold py-2">Submit Order</button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
</section>

<script type="module">
    import { hkdmservicesOfficialServicePriceCatalogue } from "./services.js";
    import { nigerianServicesCatalogue } from "./nigerian-services.js";

    const urlParams = new URLSearchParams(window.location.search);
    const platform = urlParams.get("platform") || "Instagram"; 
    const catalogType = urlParams.get("type"); 

    const platformTitle = document.getElementById("platformTitle");
    const serviceSelect = document.getElementById("serviceSelect");
    const orderQuantity = document.getElementById("orderQuantity");
    const minQtyLabel = document.getElementById("minQtyLabel");
    const rateDisplay = document.getElementById("rateDisplay");
    const totalPriceDisplay = document.getElementById("totalPriceDisplay");
    const orderForm = document.getElementById("orderForm");
    const orderAlert = document.getElementById("orderAlert");

    const isNigerian = catalogType === 'nigerian';
    const catalogue = isNigerian ? nigerianServicesCatalogue : hkdmservicesOfficialServicePriceCatalogue;
    const platformServices = catalogue.filter(item => item.platform === platform);

    platformTitle.innerText = `${platform} Order`;

    if (platformServices.length > 0) {
        serviceSelect.innerHTML = '<option value="">Select a specific service</option>';
        
        platformServices.forEach(service => {
            const option = document.createElement("option");
            option.value = service.id;
            
            let baseRate = service.ratePer1000 ?? service.price ?? service.rate ?? 0;
            let finalRate = isNigerian ? baseRate * 3 : baseRate;

            option.dataset.rate = finalRate;
            const minOrder = service.min || 100;
            option.dataset.min = minOrder;
            
            let rateText = finalRate ? `₦${finalRate} per 1000` : 'Fixed Price';
            const serviceName = service.service || service.name || "Unnamed Service";
            
            option.textContent = `${serviceName} — (${rateText}) [Min: ${minOrder}]`;
            serviceSelect.appendChild(option);
        });
    } else {
        serviceSelect.innerHTML = '<option value="">No services available for this platform</option>';
    }

    serviceSelect.addEventListener("change", () => {
        const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
        if (selectedOption && selectedOption.dataset.min) {
            const minVal = parseInt(selectedOption.dataset.min);
            orderQuantity.min = minVal;
            minQtyLabel.innerText = `(Min: ${minVal})`;
            
            if (parseInt(orderQuantity.value) < minVal) {
                orderQuantity.value = minVal;
            }
        }
        calculateTotal();
    });

    function calculateTotal() {
        const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
        if (!selectedOption || !selectedOption.dataset.rate) {
            rateDisplay.innerText = "Rate: --";
            totalPriceDisplay.innerText = "Total: ₦0.00";
            return 0;
        }

        const rate = parseFloat(selectedOption.dataset.rate);
        const qty = parseInt(orderQuantity.value) || 0;

        rateDisplay.innerText = `Rate: ₦${rate} / 1000`;
        
        const total = (rate / 1000) * qty;
        totalPriceDisplay.innerText = `Total: ₦${total.toFixed(2)}`;
        return total;
    }

    orderQuantity.addEventListener("input", calculateTotal);

    // Prevent page refresh and handle submission logic securely
    orderForm.addEventListener("submit", (e) => {
        e.preventDefault();

        const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
        if (!selectedOption.value) {
            orderAlert.className = "alert alert-danger mb-3";
            orderAlert.textContent = "Please select a valid service.";
            orderAlert.classList.remove("d-none");
            return;
        }

        const link = document.getElementById("orderLink").value;
        const qty = parseInt(orderQuantity.value);
        const minVal = parseInt(selectedOption.dataset.min || 100);

        if (qty < minVal) {
            orderAlert.className = "alert alert-danger mb-3";
            orderAlert.textContent = `Quantity cannot be less than the minimum order of ${minVal}.`;
            orderAlert.classList.remove("d-none");
            return;
        }

        const totalCost = calculateTotal();

        // Save order structure to local storage history or backend database hook
        const newOrder = {
            id: 'HKD-' + Date.now(),
            platform: platform,
            serviceName: selectedOption.textContent,
            link: link,
            quantity: qty,
            total: totalCost,
            date: new Date().toISOString(),
            status: 'Pending'
        };

        let existingHistory = JSON.parse(localStorage.getItem("hkdm_orders") || "[]");
        existingHistory.unshift(newOrder);
        localStorage.setItem("hkdm_orders", JSON.stringify(existingHistory));

        // Show success confirmation message
        orderAlert.className = "alert alert-success mb-3";
        orderAlert.textContent = "Order submitted successfully! Redirecting...";
        orderAlert.classList.remove("d-none");

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 1500);
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
