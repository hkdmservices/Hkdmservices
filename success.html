<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchase Successful - HKDMservices</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; width: 100%; text-align: center; }
    .btn-whatsapp { background: #25D366; color: white; padding: 12px 24px; font-weight: bold; border-radius: 5px; text-decoration: none; display: inline-block; margin-top: 20px; }
    .btn-whatsapp:hover { background: #1ebe57; color: white; }
  </style>
</head>
<body>
  <div class="card">
    <i class="bi bi-check-circle-fill text-success fs-1"></i>
    <h2 class="mt-3">Purchase Successful! 🎉</h2>
    <p id="status-text" class="text-muted">Processing your wallet payment and preparing order handoff...</p>
    
    <div id="action-area" style="display: none;">
      <p>Click the button below to message us on WhatsApp and instantly receive your account login credentials:</p>
      <a id="whatsapp-btn" class="btn btn-whatsapp" href="#" target="_blank">
        <i class="bi bi-whatsapp"></i> Get Logins via WhatsApp
      </a>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const reference = urlParams.get('reference');
    const platform = urlParams.get('platform') || 'Social Media';

    if (reference) {
      document.getElementById('status-text').innerText = 'Wallet payment confirmed successfully!';
      const phone = '2348135349371';
      const text = encodeURIComponent(`Hello HKDMservices! I just purchased a ${platform} account using my wallet balance. Reference: ${reference}`);
      
      document.getElementById('whatsapp-btn').href = `https://wa.me/${phone}?text=${text}`;
      document.getElementById('action-area').style.display = 'block';
    } else {
      document.getElementById('status-text').innerText = 'Invalid order reference or direct access.';
    }
  </script>
</body>
</html>
