<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Purchases | HKDMservices</title>
    <script src="theme.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <style>
        html[data-theme="dark"] body { background: #101418; color: #f1f3f5; }
        html[data-theme="dark"] .card { background: #181d22 !important; border-color: #30363d !important; color: #f1f3f5 !important; }
        .theme-toggle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.08);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .theme-toggle:hover { background: rgba(255,255,255,0.18); transform: rotate(15deg); }
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-state i { font-size: 4rem; color: #30363d; }
        .empty-state h3 { margin-top: 20px; color: #f1f3f5; }
        .empty-state p { color: #8b949e; }
        .purchase-card { border-left: 4px solid #198754; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand fw-bold" href="dashboard.html">
            <span class="brand-icon">⬢</span> HKDMservices
        </a>
        <div class="d-flex align-items-center gap-2">
            <button type="button" id="themeToggle" class="theme-toggle">
                <i id="themeIcon" class="bi bi-moon-stars-fill"></i>
            </button>
            <a href="dashboard.html" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left"></i> Dashboard
            </a>
        </div>
    </div>
</nav>

<section class="py-4">
    <div class="container">
        <h1 class="fw-bold"><i class="bi bi-box-seam text-success"></i> My Purchases</h1>
        <p class="text-muted">View your purchase history</p>

        <div id="purchasesContainer" class="mt-4">
            <div class="text-center py-5">
                <div class="spinner-border text-success" role="status"></div>
                <p class="mt-3 text-muted">Loading your purchases...</p>
            </div>
        </div>
    </div>
</section>

<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js"
    }
}
</script>

<script type="module">
    import { initializeApp } from "firebase/app";
    import { getAuth, onAuthStateChanged } from "firebase/auth";
    import { getDatabase, ref, onValue } from "firebase/database";

    const firebaseConfig = {
        apiKey: "AIzaSyADhpdfM0GaMJIkeQw7Q6eBK3u9CaWUC9k",
        authDomain: "hkdmservices-7d59f.firebaseapp.com",
        databaseURL: "https://hkdmservices-7d59f-default-rtdb.firebaseio.com",
        projectId: "hkdmservices-7d59f",
        storageBucket: "hkdmservices-7d59f.firebasestorage.app",
        messagingSenderId: "839538334772",
        appId: "1:839538334772:web:7d8785f87363b6e5d8fe61"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    const container = document.getElementById('purchasesContainer');

    function formatDate(timestamp) {
        if (!timestamp) return 'N/A';
        return new Date(timestamp).toLocaleString('en-NG', { dateStyle: 'medium', timeStyle: 'short' });
    }

    function formatNaira(amount) {
        return '₦' + Number(amount || 0).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    onAuthStateChanged(auth, (user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }

        // Load orders with type 'shop_purchase'
        const ordersRef = ref(database, 'orders');
        onValue(ordersRef, (snapshot) => {
            const data = snapshot.val();
            container.innerHTML = '';

            if (!data) {
                showEmptyState();
                return;
            }

            const purchases = Object.entries(data)
                .filter(([key, order]) => order.uid === user.uid && order.type === 'shop_purchase')
                .sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));

            if (purchases.length === 0) {
                showEmptyState();
                return;
            }

            container.innerHTML = purchases.map(([key, order]) => `
                <div class="card bg-dark border-secondary purchase-card mb-3">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start flex-wrap">
                            <div>
                                <h5 class="text-success">${order.platform || 'N/A'}</h5>
                                <h6 class="text-muted">${order.title || 'N/A'}</h6>
                            </div>
                            <div class="text-end">
                                <span class="badge bg-success">Completed</span>
                                <div class="text-muted small">${formatDate(order.createdAt)}</div>
                            </div>
                        </div>
                        <div class="mt-3">
                            <span class="text-muted">Price:</span>
                            <strong>${formatNaira(order.price)}</strong>
                        </div>
                        ${order.description ? `
                            <div class="mt-2">
                                <span class="text-muted">Description:</span>
                                <p class="mb-0 small">${order.description}</p>
                            </div>
                        ` : ''}
                        <div class="mt-3">
                            <span class="badge bg-info text-dark">Order ID: ${order.orderId || key.slice(0, 12)}</span>
                        </div>
                        <div class="alert alert-info small mt-3 mb-0">
                            <i class="bi bi-envelope"></i> 
                            Credentials were sent to your email address.
                        </div>
                    </div>
                </div>
            `).join('');
        });
    });

    function showEmptyState() {
        container.innerHTML = `
            <div class="empty-state">
                <i class="bi bi-inbox"></i>
                <h3>No purchases yet</h3>
                <p>Visit the shop to buy social media accounts</p>
                <a href="shop.html" class="btn btn-success mt-3">
                    <i class="bi bi-shop"></i> Browse Shop
                </a>
            </div>
        `;
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
