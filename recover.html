<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Recover Payment | HKDMservices</title>

</head>

<body>

<h2>Payment Recovery</h2>

<p id="status">
Checking your account...
</p>

<button
id="recoverButton"
disabled
>
Recover ₦100 Payment
</button>


<script type="module">

import { auth } from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const status =
    document.getElementById(
        "status"
    );

const button =
    document.getElementById(
        "recoverButton"
    );


const paymentReference =
    "HKDM-1786187655787-ila7bj";


let currentUser = null;


onAuthStateChanged(
    auth,
    (user) => {

        if (!user) {

            status.textContent =
                "You are not logged in. Please log in first.";

            button.disabled =
                true;

            return;

        }


        currentUser =
            user;


        status.textContent =
            "Logged in as " +
            user.email +
            ". Ready to recover the ₦100 payment.";


        button.disabled =
            false;

    }
);


button.addEventListener(
    "click",
    async () => {

        if (!currentUser) {

            status.textContent =
                "Please log in first.";

            return;

        }


        button.disabled =
            true;

        button.textContent =
            "Recovering payment...";


        status.textContent =
            "Verifying your payment with Korapay...";


        try {

            /*
             * Get the currently logged-in
             * Firebase user's ID token.
             */

            const idToken =
    await currentUser.getIdToken(
        false
    );


            /*
             * Send the authenticated
             * request to Vercel.
             */

            const response =
                await fetch(
                    "/api/recover-payment",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                "Bearer " +
                                idToken

                        },

                        body:
                            JSON.stringify({

                                reference:
                                    paymentReference

                            })

                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(

                    result.message ||
                    "Payment recovery failed."

                );

            }


            status.textContent =
                result.message;


            button.textContent =
                "Payment Recovered";


        } catch (error) {

            console.error(error);


            status.textContent =
                error.message ||
                "Unable to recover payment.";


            button.disabled =
                false;

            button.textContent =
                "Try Recovery Again";

        }

    }
);

</script>

</body>

</html>
