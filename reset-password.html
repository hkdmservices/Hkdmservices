<!DOCTYPE html>
<html>
<head>
    <title>Reset Password | HKDMservices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #0d1117;
            color: #f1f3f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .card h2 {
            color: #198754;
            text-align: center;
            font-size: 24px;
            margin-bottom: 4px;
        }
        .card .subtitle {
            color: #8b949e;
            text-align: center;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .form-control {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #f1f3f5;
            padding: 12px 16px;
            border-radius: 8px;
            width: 100%;
            font-size: 16px;
        }
        .form-control:focus {
            border-color: #198754;
            outline: none;
            box-shadow: 0 0 0 3px rgba(25, 135, 84, 0.2);
        }
        .form-control::placeholder {
            color: #484f58;
        }
        .form-label {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 4px;
            display: block;
        }
        .btn-success {
            background: #198754;
            border: none;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-success:hover {
            background: #157347;
        }
        .btn-success:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 14px;
        }
        .alert-danger {
            background: #1a0b0b;
            border: 1px solid #5c1a1a;
            color: #f85149;
        }
        .alert-success {
            background: #0b2217;
            border: 1px solid #14432a;
            color: #75e6b3;
        }
        .alert-info {
            background: #0a2029;
            border: 1px solid #113847;
            color: #6edff6;
        }
        .d-none {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }
        .mt-2 {
            margin-top: 8px;
        }
        .mt-3 {
            margin-top: 16px;
        }
        .mb-3 {
            margin-bottom: 16px;
        }
        .gap-2 {
            gap: 8px;
        }
        .lock-icon {
            text-align: center;
            font-size: 48px;
            color: #198754;
            margin-bottom: 8px;
        }
        .input-group {
            position: relative;
        }
        .input-group .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #484f58;
            cursor: pointer;
            font-size: 18px;
            padding: 0;
        }
        .input-group .toggle-password:hover {
            color: #f1f3f5;
        }
        .password-strength {
            height: 4px;
            border-radius: 4px;
            margin-top: 6px;
            background: #30363d;
            transition: all 0.3s;
        }
        .password-strength.weak { background: #f85149; width: 33%; }
        .password-strength.medium { background: #d29922; width: 66%; }
        .password-strength.strong { background: #198754; width: 100%; }
        .password-hint {
            font-size: 12px;
            color: #484f58;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="lock-icon">
            <i class="bi bi-shield-lock"></i>
        </div>
        <h2>⬢ HKDMservices</h2>
        <p class="subtitle">Reset Your Password</p>

        <div id="status" class="alert d-none"></div>

        <form id="resetForm">
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="newPassword" placeholder="Enter new password" required minlength="6">
                    <button type="button" class="toggle-password" onclick="togglePassword('newPassword', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <div class="password-strength" id="strengthBar"></div>
                <div class="password-hint" id="strengthText">Minimum 6 characters</div>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm new password" required minlength="6">
                    <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <div id="matchStatus" class="password-hint"></div>
            </div>

            <button type="submit" class="btn-success" id="resetBtn">Reset Password</button>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js"></script>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyADhpdfM0GaMJIkeQw7Q6eBK3u9CaWUC9k",
            authDomain: "hkdmservices-7d59f.firebaseapp.com",
            databaseURL: "https://hkdmservices-7d59f-default-rtdb.firebaseio.com",
            projectId: "hkdmservices-7d59f",
            storageBucket: "hkdmservices-7d59f.firebasestorage.app",
            messagingSenderId: "839538334772",
            appId: "1:839538334772:web:7d8785f87363b6e5d8fe61"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Get parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const oobCode = urlParams.get('oobCode');
        const mode = urlParams.get('mode');

        const form = document.getElementById('resetForm');
        const status = document.getElementById('status');
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const resetBtn = document.getElementById('resetBtn');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');
        const matchStatus = document.getElementById('matchStatus');

        // ============================================
        // CHECK VALID LINK
        // ============================================
        if (mode !== 'resetPassword' || !oobCode) {
            status.className = 'alert alert-danger';
            status.textContent = '❌ Invalid reset link. Please request a new one.';
            status.classList.remove('d-none');
            form.style.display = 'none';
        }

        // ============================================
        // TOGGLE PASSWORD VISIBILITY
        // ============================================
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }

        // ============================================
        // PASSWORD STRENGTH
        // ============================================
        newPassword.addEventListener('input', function() {
            const val = this.value;
            const strength = getPasswordStrength(val);
            
            strengthBar.className = 'password-strength';
            if (val.length === 0) {
                strengthBar.className = 'password-strength';
                strengthText.textContent = 'Minimum 6 characters';
                return;
            }
            
            if (strength === 'weak') {
                strengthBar.classList.add('weak');
                strengthText.textContent = '⚠️ Weak password';
                strengthText.style.color = '#f85149';
            } else if (strength === 'medium') {
                strengthBar.classList.add('medium');
                strengthText.textContent = '⚠️ Medium password';
                strengthText.style.color = '#d29922';
            } else {
                strengthBar.classList.add('strong');
                strengthText.textContent = '✅ Strong password';
                strengthText.style.color = '#198754';
            }
            checkMatch();
        });

        function getPasswordStrength(password) {
            if (password.length < 6) return 'weak';
            let score = 0;
            if (password.length >= 8) score++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
            if (/\d/.test(password)) score++;
            if (/[^a-zA-Z0-9]/.test(password)) score++;
            if (score <= 1) return 'weak';
            if (score === 2) return 'medium';
            return 'strong';
        }

        // ============================================
        // CONFIRM PASSWORD MATCH
        // ============================================
        function checkMatch() {
            const pass = newPassword.value;
            const confirm = confirmPassword.value;
            
            if (confirm.length === 0) {
                matchStatus.textContent = '';
                return;
            }
            
            if (pass === confirm) {
                matchStatus.textContent = '✅ Passwords match';
                matchStatus.style.color = '#198754';
            } else {
                matchStatus.textContent = '❌ Passwords do not match';
                matchStatus.style.color = '#f85149';
            }
        }

        confirmPassword.addEventListener('input', checkMatch);

        // ============================================
        // SUBMIT RESET
        // ============================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = newPassword.value;
            const confirm = confirmPassword.value;

            if (password !== confirm) {
                status.className = 'alert alert-danger';
                status.textContent = '❌ Passwords do not match.';
                status.classList.remove('d-none');
                return;
            }

            if (password.length < 6) {
                status.className = 'alert alert-warning';
                status.textContent = '❌ Password must be at least 6 characters.';
                status.classList.remove('d-none');
                return;
            }

            status.className = 'alert alert-info';
            status.textContent = '⏳ Resetting password...';
            status.classList.remove('d-none');
            resetBtn.disabled = true;
            resetBtn.textContent = 'Processing...';

            try {
                await auth.confirmPasswordReset(oobCode, password);
                status.className = 'alert alert-success';
                status.textContent = '✅ Password reset successfully! Redirecting...';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } catch (error) {
                status.className = 'alert alert-danger';
                status.textContent = '❌ ' + error.message;
                resetBtn.disabled = false;
                resetBtn.textContent = 'Reset Password';
            }
        });

        console.log('✅ Password reset page loaded!');
    </script>
</body>
</html>
