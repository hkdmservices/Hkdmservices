<!DOCTYPE html>
<html>
<head>
    <title>Reset Password | HKDMservices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #0d1117; color: #f1f3f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 30px; max-width: 400px; width: 100%; }
        .form-control { background: #0d1117; border-color: #30363d; color: #f1f3f5; }
        .form-control:focus { border-color: #198754; box-shadow: none; }
        .btn-success { background: #198754; border: none; }
        .btn-success:hover { background: #157347; }
    </style>
</head>
<body>
    <div class="card">
        <h2 class="text-center text-success">⬢ HKDMservices</h2>
        <p class="text-center text-muted">Reset Your Password</p>

        <div id="status" class="alert d-none"></div>

        <form id="resetForm">
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" class="form-control" id="newPassword" placeholder="Enter new password" required minlength="6">
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm new password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-success w-100">Reset Password</button>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyADhpdfM0GaMJIkeQw7Q6eBK3u9CaWUC9k",
            authDomain: "hkdmservices-7d59f.firebaseapp.com",
            databaseURL: "https://hkdmservices-7d59f-default-rtdb.firebaseio.com",
            projectId: "hkdmservices-7d59f",
            storageBucket: "hkdmservices-7d59f.firebasestorage.app",
            messagingSenderId: "839538334772",
            appId: "1:839538334772:web:7d8785f87363b6e5d8fe61"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Get parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const oobCode = urlParams.get('oobCode');
        const mode = urlParams.get('mode');

        const form = document.getElementById('resetForm');
        const status = document.getElementById('status');

        if (mode !== 'resetPassword' || !oobCode) {
            status.className = 'alert alert-danger';
            status.textContent = '❌ Invalid reset link. Please request a new one.';
            status.classList.remove('d-none');
            form.style.display = 'none';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (password !== confirm) {
                status.className = 'alert alert-warning';
                status.textContent = '❌ Passwords do not match.';
                status.classList.remove('d-none');
                return;
            }

            if (password.length < 6) {
                status.className = 'alert alert-warning';
                status.textContent = '❌ Password must be at least 6 characters.';
                status.classList.remove('d-none');
                return;
            }

            status.className = 'alert alert-info';
            status.textContent = '⏳ Resetting password...';
            status.classList.remove('d-none');

            try {
                await auth.confirmPasswordReset(oobCode, password);
                status.className = 'alert alert-success';
                status.textContent = '✅ Password reset successfully! Redirecting...';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } catch (error) {
                status.className = 'alert alert-danger';
                status.textContent = '❌ ' + error.message;
            }
        });
    </script>
</body>
</html>
