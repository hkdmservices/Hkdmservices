<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage 1 Test — users_private</title>
<style>
  body { font-family: -apple-system, sans-serif; padding: 20px; max-width: 700px; margin: auto; background:#0f1115; color:#e6e6e6; }
  h1 { font-size: 20px; }
  button { display:block; width:100%; padding:14px; margin:10px 0; font-size:16px; border-radius:10px; border:0; background:#2d6cdf; color:white; }
  button.secondary { background:#444; }
  .box { background:#1a1d24; padding:14px; border-radius:10px; margin-top:14px; white-space:pre-wrap; word-break:break-word; font-family:monospace; font-size:13px; }
  .pass { color:#4ade80; font-weight:bold; }
  .fail { color:#f87171; font-weight:bold; }
  input { width:100%; padding:12px; font-size:16px; border-radius:8px; border:1px solid #333; background:#0f1115; color:#fff; box-sizing:border-box; margin:6px 0; }
</style>
</head>
<body>
<h1>Stage 1 Test — users_private rules</h1>
<p>Log in with a <b>normal user account</b> (not admin).</p>

<input id="email" type="email" placeholder="email" autocomplete="username">
<input id="pass" type="password" placeholder="password" autocomplete="current-password">
<button onclick="login()">Log in</button>
<button class="secondary" onclick="logout()">Log out</button>

<div id="status" class="box">Loading…</div>

<button onclick="testReadOther()">Test 3 — READ someone else's users_private (should FAIL)</button>
<button onclick="testReadOwn()">Test 4 — READ own users_private (should PASS)</button>
<button onclick="testWrite()">Test 5 — WRITE to users_private (should FAIL)</button>

<div id="out" class="box"></div>

<!-- Compat Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- Load site's firebase.js (module) to init the app with the config -->
<script type="module">
  import { auth, database } from './firebase.js';

  const out = document.getElementById('out');
  const status = document.getElementById('status');
  const log = (msg, cls='') => { out.innerHTML += `<span class="${cls}">${msg}</span>\n`; };

  window.login = async () => {
    out.innerHTML = '';
    try {
      await auth.signInWithEmailAndPassword(email.value.trim(), pass.value);
    } catch (e) { log('Login error: ' + e.message, 'fail'); }
  };

  window.logout = async () => { await auth.signOut(); out.innerHTML = ''; };

  auth.onAuthStateChanged(u => {
    status.textContent = u ? `Logged in as: ${u.email}\nUID: ${u.uid}` : 'Not logged in.';
  });

  window.testReadOther = async () => {
    out.innerHTML = '';
    if (!auth.currentUser) return log('Log in first.', 'fail');
    try {
      const snap = await database.ref('users_private/someotheruid12345').once('value');
      log('FAIL ❌  Read of another user allowed. Value: ' + JSON.stringify(snap.val()), 'fail');
    } catch (e) {
      const msg = String(e.message || '');
      if (msg.toLowerCase().includes('permission')) {
        log('PASS ✅  Read of another user denied (PERMISSION_DENIED).', 'pass');
      } else {
        log('FAIL ❌  Unexpected: ' + msg, 'fail');
      }
    }
  };

  window.testReadOwn = async () => {
    out.innerHTML = '';
    if (!auth.currentUser) return log('Log in first.', 'fail');
    try {
      const snap = await database.ref('users_private/' + auth.currentUser.uid).once('value');
      log('PASS ✅  Read own users_private allowed.\nValue: ' + JSON.stringify(snap.val()), 'pass');
    } catch (e) {
      const msg = String(e.message || '');
      log('FAIL ❌  Read own denied: ' + msg, 'fail');
    }
  };

  window.testWrite = async () => {
    out.innerHTML = '';
    if (!auth.currentUser) return log('Log in first.', 'fail');
    try {
      await database.ref('users_private/' + auth.currentUser.uid).set({ test: 1 });
      log('FAIL ❌  Write succeeded. Rules are NOT locking users_private.', 'fail');
    } catch (e) {
      const msg = String(e.message || '');
      if (msg.toLowerCase().includes('permission')) {
        log('PASS ✅  Write denied (PERMISSION_DENIED).', 'pass');
      } else {
        log('FAIL ❌  Unexpected: ' + msg, 'fail');
      }
    }
  };
</script>
</body>
</html>
