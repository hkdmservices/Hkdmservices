<!-- ============================================================
     FIREBASE AUTH (Added – Your Design is Untouched)
============================================================ -->
<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js"
    }
}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, sendPasswordResetEmail } from "firebase/auth";

// Firebase Config
const firebaseConfig = {
    apiKey: "AIzaSyADhpdfM0GaMJIkeQw7Q6eBK3u9CaWUC9k",
    authDomain: "hkdmservices-7d59f.firebaseapp.com",
    databaseURL: "https://hkdmservices-7d59f-default-rtdb.firebaseio.com",
    projectId: "hkdmservices-7d59f",
    storageBucket: "hkdmservices-7d59f.firebasestorage.app",
    messagingSenderId: "839538334772",
    appId: "1:839538334772:web:7d8785f87363b6e5d8fe61"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// DOM Elements
const resetForm = document.getElementById("resetForm");
const resetEmail = document.getElementById("resetEmail");
const messageDiv = document.getElementById("message");

// ============================================================
// HANDLE PASSWORD RESET
// ============================================================
resetForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = resetEmail.value.trim();

    if (!email) {
        showMessage("Please enter your email address.", "danger");
        return;
    }

    try {
        // Show loading state
        const submitBtn = resetForm.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Sending...`;

        await sendPasswordResetEmail(auth, email);

        showMessage("✅ Password reset link sent! Please check your email.", "success");
        resetEmail.value = ""; // Clear the field
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;

    } catch (error) {
        console.error("Password reset error:", error);
        let errorMessage = "Unable to send reset link. Please try again.";

        // Handle specific Firebase errors
        switch (error.code) {
            case "auth/user-not-found":
                errorMessage = "No account found with this email address.";
                break;
            case "auth/invalid-email":
                errorMessage = "Please enter a valid email address.";
                break;
            case "auth/too-many-requests":
                errorMessage = "Too many requests. Please try again later.";
                break;
            default:
                errorMessage = error.message;
        }

        showMessage("❌ " + errorMessage, "danger");
        // Re-enable button if it was disabled
        const submitBtn = resetForm.querySelector('button[type="submit"]');
        submitBtn.disabled = false;
        submitBtn.innerHTML = "Send Reset Link";
    }
});

// ============================================================
// HELPER: SHOW MESSAGE
// ============================================================
function showMessage(text, type) {
    messageDiv.textContent = text;
    messageDiv.className = `alert alert-${type} mt-3`;
    messageDiv.classList.remove("d-none");

    // Auto-hide success messages after 5 seconds
    if (type === "success") {
        setTimeout(() => {
            messageDiv.classList.add("d-none");
        }, 5000);
    }
}

console.log("✅ Forgot Password page loaded with Firebase auth.");
</script>

<!-- Keep original script for potential fallback, but it's now overridden -->
<script type="module" src="forgot-password.js"></script>

</body>
</html>
