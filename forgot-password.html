<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | HKDMServices</title>

<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
html[data-theme="dark"] body.auth-body { background: #101418 !important; }
html[data-theme="dark"] .auth-card { background: #181d22 !important; border-color: #30363d !important; color: #f1f3f5 !important; }
html[data-theme="dark"] .auth-card .text-light { color: #99a1ab !important; }
html[data-theme="dark"] .form-control { background-color: #151a1f !important; border-color: #30363d !important; color: #f1f3f5 !important; }
html[data-theme="dark"] .form-control:focus { background-color: #151a1f !important; color: #f1f3f5 !important; border-color: #198754 !important; }

.auth-theme-toggle-wrap { position: absolute; top: 20px; right: 20px; z-index: 10; }
.theme-toggle { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; transition: background 0.2s ease, transform 0.2s ease; }
.theme-toggle:hover { background: rgba(255,255,255,0.18); transform: rotate(15deg); }
</style>
</head>

<body class="auth-body">

<div class="auth-theme-toggle-wrap">
    <button type="button" id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <i id="themeIcon" class="bi bi-moon-stars-fill"></i>
    </button>
</div>

<div class="container">
<div class="row justify-content-center align-items-center min-vh-100">
<div class="col-lg-5 col-md-7">
<div class="auth-card">

<div class="text-center mb-4">
<h2 class="fw-bold text-success">HKDMServices</h2>
<p class="text-light">Reset your password</p>
</div>

<form id="resetForm">
<div class="mb-4">
<label class="form-label text-light">Email Address</label>
<input type="email" class="form-control" id="resetEmail" placeholder="Enter your registered email" required>
</div>

<div class="d-grid">
<button type="submit" class="btn btn-success btn-lg">Send Reset Link</button>
</div>
</form>

<div class="text-center mt-4">
<p class="text-light mb-0">
Remember your password? 
<a href="login.html" class="text-success text-decoration-none fw-bold">Login Here</a>
</p>
</div>

<div id="message" class="alert mt-3 d-none"></div>

</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="forgot-password.js"></script>
</body>
</html>
