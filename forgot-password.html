<style>

<body class="auth-body">

<!-- NO THEME TOGGLE — controlled from dashboard -->

<div class="container">
<div class="row justify-content-center align-items-center min-vh-100">
<div class="col-lg-5 col-md-7">
<div class="auth-card">

<div class="text-center mb-4">
<h2 class="fw-bold text-success">HKDMServices</h2>
<p class="text-light">Reset your password</p>
</div>

<form id="resetForm">
<div class="mb-4">
<label class="form-label text-light">Email Address</label>
<input type="email" class="form-control" id="resetEmail" placeholder="Enter your registered email" required>

<div class="d-grid">

</div>

<div class="text-center mt-4">

Remember your password?

</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- ============================================================
     FIREBASE AUTH — Custom Reset via Resend
============================================================ -->
<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js"
    }
}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth } from "firebase/auth";

const firebaseConfig = {
    apiKey: "AIzaSyADhpdfM0GaMJIkeQw7Q6eBK3u9CaWUC9k",
    authDomain: "hkdmservices-7d59f.firebaseapp.com",
    databaseURL: "https://hkdmservices-7d59f-default-rtdb.firebaseio.com",
    projectId: "hkdmservices-7d59f",
    storageBucket: "hkdmservices-7d59f.firebasestorage.app",
    messagingSenderId: "839538334772",
    appId: "1:839538334772:web:7d8785f87363b6e5d8fe61"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const resetForm = document.getElementById("resetForm");
const resetEmail = document.getElementById("resetEmail");
const messageDiv = document.getElementById("message");

resetForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = resetEmail.value.trim();

    if (!email) {
        showMessage("Please enter your email address.", "danger");
        return;
    }

    try {
        const submitBtn = resetForm.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Sending...`;

        const response = await fetch('https://hkdmservices.xyz/api-php/send-password-reset.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
        });

        const result = await response.json();

        if (result.success) {
            showMessage("✅ Password reset link sent! Please check your email.", "success");
            resetEmail.value = "";
        } else {
            showMessage("❌ " + result.message, "danger");
        }

        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;

    } catch (error) {
        console.error("Password reset error:", error);
        showMessage("❌ Unable to send reset link. Please try again.", "danger");
        const submitBtn = resetForm.querySelector('button[type="submit"]');
        submitBtn.disabled = false;
        submitBtn.innerHTML = "Send Reset Link";
    }
});

function showMessage(text, type) {
    messageDiv.textContent = text;
    messageDiv.className = `alert alert-${type} mt-3`;
    messageDiv.classList.remove("d-none");

    if (type === "success") {
        setTimeout(() => {
            messageDiv.classList.add("d-none");
        }, 5000);
    }
}

console.log("✅ Forgot Password page loaded.");
</script>

</body>
