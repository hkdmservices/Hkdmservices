<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Activity Panel | HKDMservices</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">

    <style>
        :root {
            --bg-body: #f8f9fa;
            --bg-card: #ffffff;
            --border-card: #dee2e6;
            --text-body: #1a1d21;
            --text-muted: #5a6268;
            --bg-input: #ffffff;
            --border-input: #ced4da;
            --accent: #198754;
            --accent-hover: #146c43;
            --shadow: rgba(0, 0, 0, 0.05);
        }

        html[data-theme="dark"] {
            --bg-body: #0d1117;
            --bg-card: #161b22;
            --border-card: #30363d;
            --text-body: #e6edf3;
            --text-muted: #8b949e;
            --bg-input: #0d1117;
            --border-input: #30363d;
            --accent: #2ea043;
            --accent-hover: #3fb950;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: var(--bg-body);
            color: var(--text-body);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* ---------- NAVBAR ---------- */
        .navbar-custom {
            background: #080a0c;
            border-bottom: 1px solid #30363d;
            padding: 10px 0;
        }

        .navbar-custom .container {
            max-width: 100%;
        }

        .brand {
            font-weight: 700;
            color: #2ea043;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            margin: 0;
        }

        .brand:hover {
            color: #3fb950;
        }

        .navbar-custom .text-muted,
        .navbar-custom .small {
            color: #adb5bd !important;
        }

        /* ---------- CARDS ---------- */
        .card-custom {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 20px;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        /* ---------- TABLE ---------- */
        .table {
            color: var(--text-body) !important;
            --bs-table-bg: transparent !important;
            --bs-table-hover-bg: rgba(25, 135, 84, 0.08) !important;
            --bs-table-color: var(--text-body) !important;
            margin-bottom: 0;
        }

        .table thead th {
            border-bottom-color: var(--border-card);
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            background: transparent;
        }

        .table td,
        .table th {
            border-color: var(--border-card);
            color: var(--text-body) !important;
            vertical-align: middle;
            background: transparent;
        }

        html[data-theme="dark"] .table-hover > tbody > tr:hover > * {
            --bs-table-accent-bg: rgba(25, 135, 84, 0.1);
            color: var(--text-body) !important;
        }

        /* ---------- BUTTONS ---------- */
        .btn-refresh {
            background: transparent;
            border: 1px solid var(--border-input);
            color: #e6edf3;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .btn-refresh:hover,
        .btn-refresh:focus {
            background: rgba(25, 135, 84, 0.15);
            color: #2ea043;
            border-color: #2ea043;
        }

        .btn-refresh.dropdown-toggle::after {
            margin-left: 6px;
        }

        /* ---------- DROPDOWN MENU ---------- */
        .dropdown-menu {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            box-shadow: 0 4px 12px var(--shadow);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .dropdown-item {
            color: var(--text-body);
            transition: background 0.15s ease;
        }

        .dropdown-item:hover,
        .dropdown-item:focus {
            background: rgba(25, 135, 84, 0.12);
            color: var(--accent);
        }

        /* ---------- FORMS ---------- */
        .form-control,
        .form-select {
            background: var(--bg-input);
            border-color: var(--border-input);
            color: var(--text-body);
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        .form-control::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .form-control:focus,
        .form-select:focus {
            background: var(--bg-input);
            color: var(--text-body);
            border-color: var(--accent);
            box-shadow: 0 0 0 0.2rem rgba(25, 135, 84, 0.2);
        }

        /* ---------- FLAG BADGES ---------- */
        .flag-badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
            margin-right: 4px;
            display: inline-block;
            margin-bottom: 3px;
        }

        .flag-critical { background: #dc3545; color: #fff; }
        .flag-high { background: #fd7e14; color: #fff; }
        .flag-medium { background: #ffc107; color: #000; }

        /* ---------- STAT CARDS ---------- */
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .stat-card .num {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-card .lbl {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ---------- USER ROW ---------- */
        .user-row {
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .uid-code {
            font-size: 0.7rem;
            background: var(--bg-body);
            padding: 2px 6px;
            border-radius: 4px;
            word-break: break-all;
            display: inline-block;
            max-width: 160px;
            color: var(--text-body);
            border: 1px solid var(--border-card);
        }

        /* ---------- MODAL ---------- */
        .modal-content {
            background: var(--bg-card);
            color: var(--text-body);
            border-color: var(--border-card);
            transition: background 0.3s ease, color 0.3s ease;
        }

        .modal-header,
        .modal-footer {
            border-color: var(--border-card);
        }

        html[data-theme="dark"] .btn-close {
            filter: invert(1) grayscale(100%) brightness(200%);
        }

        /* ---------- WALLET TIMELINE ---------- */
        .timeline-entry {
            display: flex;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-card);
            font-size: 0.85rem;
        }

        .timeline-entry:last-child {
            border-bottom: none;
        }

        .timeline-entry.credit {
            background: rgba(25, 135, 84, 0.08);
        }

        .timeline-entry.debit {
            background: rgba(220, 53, 69, 0.08);
        }

        .timeline-entry.suspicious {
            background: rgba(220, 53, 69, 0.18);
            border-left: 3px solid #dc3545;
        }

        .timeline-type {
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .timeline-amount {
            font-weight: 700;
            font-size: 0.9rem;
        }

        .timeline-meta {
            color: var(--text-muted);
            font-size: 0.7rem;
        }

        /* ---------- MISC ---------- */
        .loading-center {
            text-align: center;
            padding: 40px;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--accent);
            display: inline-block;
        }

        /* Smooth theme transitions */
        .card-custom,
        .stat-card,
        .table,
        .table td,
        .table th,
        .modal-content,
        .form-control,
        .form-select,
        .btn-refresh,
        .dropdown-menu,
        .uid-code {
            transition: background 0.3s ease,
                        color 0.3s ease,
                        border-color 0.3s ease;
        }

        /* Scrollbar theming for dark mode */
        html[data-theme="dark"] ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        html[data-theme="dark"] ::-webkit-scrollbar-track {
            background: var(--bg-body);
        }

        html[data-theme="dark"] ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 5px;
        }

        html[data-theme="dark"] ::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        /* ---------- NAVBAR TOGGLER (mobile) ---------- */
        .navbar-toggler {
            border-color: #30363d;
            padding: 4px 8px;
        }

        .navbar-toggler:focus {
            box-shadow: 0 0 0 0.2rem rgba(46, 160, 67, 0.25);
        }

        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='%232ea043' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }

        /* ---------- MOBILE TWEAKS ---------- */
        @media (max-width: 575.98px) {
            .brand {
                font-size: 0.95rem;
                gap: 6px;
            }

            .btn-refresh {
                padding: 5px 10px;
                font-size: 0.78rem;
            }

            .card-custom {
                padding: 14px;
            }

            .stat-card {
                padding: 12px;
            }

            .stat-card .num {
                font-size: 1.4rem;
            }

            .stat-card .lbl {
                font-size: 0.68rem;
            }

            .section-title {
                font-size: 0.9rem;
            }

            .container {
                padding-left: 12px;
                padding-right: 12px;
            }
        }

        /* Email always on its own line in collapsed navbar */
        #currentUserEmail {
            font-size: 0.72rem;
            word-break: break-all;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <!-- ============ NAVBAR ============ -->
    <nav class="navbar navbar-expand-md navbar-custom" data-bs-theme="dark">
        <div class="container">

            <!-- Brand -->
            <a class="navbar-brand brand" href="#">
                <i class="bi bi-shield-check"></i>
                <span>HKDM Panel</span>
            </a>

            <!-- Mobile toggler -->
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navContent"
                    aria-controls="navContent"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Collapsible content -->
            <div class="collapse navbar-collapse" id="navContent">
                <div class="d-flex flex-column flex-md-row align-items-stretch
                            align-items-md-center gap-2 ms-md-auto mt-3 mt-md-0 w-100">

                    <!-- Theme dropdown + Refresh -->
                    <div class="d-flex align-items-center gap-2">
                        <div class="dropdown">
                            <button class="btn-refresh dropdown-toggle" type="button"
                                    data-bs-toggle="dropdown" aria-expanded="false"
                                    title="Change theme">
                                <i class="bi bi-sun-fill" id="themeIcon"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <a class="dropdown-item" href="#"
                                       onclick="setTheme('light'); return false;">
                                        <i class="bi bi-sun-fill me-2"></i>Light
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item" href="#"
                                       onclick="setTheme('dark'); return false;">
                                        <i class="bi bi-moon-fill me-2"></i>Dark
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item" href="#"
                                       onclick="setTheme('auto'); return false;">
                                        <i class="bi bi-circle-half me-2"></i>Auto
                                    </a>
                                </li>
                            </ul>
                        </div>

                        <button class="btn-refresh" onclick="location.reload()">
                            <i class="bi bi-arrow-clockwise"></i> Refresh
                        </button>
                    </div>

                    <!-- Email (own line on mobile, right-aligned on desktop) -->
                    <span class="text-muted small text-truncate ms-md-auto"
                          id="currentUserEmail">…</span>

                </div>
            </div>

        </div>
    </nav>

    <div class="container py-4" id="panelContent" style="display:none;">

        <!-- STATS -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="num" id="statTotalUsers">0</div>
                    <div class="lbl">Total Users</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="num" id="statFlaggedUsers">0</div>
                    <div class="lbl">Flagged Users</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="num" id="statSuspendedUsers">0</div>
                    <div class="lbl">Suspended</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div class="num" id="statWalletSum">₦0</div>
                    <div class="lbl">Total Wallet</div>
                </div>
            </div>
        </div>

        <!-- FILTERS -->
        <div class="card-custom mb-4">
            <div class="d-flex gap-2 flex-wrap">
                <input
                    type="text"
                    id="userSearch"
                    class="form-control flex-grow-1"
                    style="min-width: 200px;"
                    placeholder="Search by name, email, or UID...">

                <select id="userStatusFilter" class="form-select flex-grow-1"
                        style="min-width: 140px; max-width: 200px;">
                    <option value="all">All Status</option>
                    <option value="active">Active</option>
                    <option value="suspended">Suspended</option>
                </select>

                <select id="flagFilter" class="form-select flex-grow-1"
                        style="min-width: 140px; max-width: 200px;">
                    <option value="all">All Users</option>
                    <option value="flagged">Flagged Only</option>
                </select>
            </div>
        </div>

        <!-- USERS TABLE -->
        <div class="card-custom">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="section-title">All Users</span>
                <span class="text-muted small" id="userCount">0 users</span>
            </div>

            <div style="max-height: 600px; overflow-y: auto; overflow-x: auto;">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>UID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Wallet</th>
                            <th>Tier</th>
                            <th>Status</th>
                            <th>Flags</th>
                            <th style="width:40px;"></th>
                        </tr>
                    </thead>
                    <tbody id="usersTable">
                        <tr>
                            <td colspan="8" class="text-center text-muted py-4">
                                <div class="spinner-border spinner-border-sm text-success"></div> Loading users...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- USER DETAIL MODAL -->
    <div class="modal fade" id="userDetailModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-person-circle text-success"></i>
                        <span id="modalUserName">User</span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBody">
                    <div class="text-center py-4">
                        <div class="spinner-border text-success"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-warning" id="btnBlockUser">
                        <i class="bi bi-slash-circle"></i> <span id="blockBtnText">Block User</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- TOASTS -->
    <div id="toastContainer" style="position:fixed; bottom:20px; right:20px; z-index:9999;"></div>

    <!-- BOOTSTRAP + FIREBASE -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // ---------- THEME: apply BEFORE page renders ----------
        (function () {
            const saved = localStorage.getItem('adminTheme') || 'auto';
            let theme = saved;

            if (saved === 'auto') {
                theme = (window.matchMedia &&
                         window.matchMedia('(prefers-color-scheme: dark)').matches)
                    ? 'dark'
                    : 'light';
            }

            document.documentElement.setAttribute('data-theme', theme);
        })();

        // ---------- THEME: switching ----------
        function applyTheme(theme) {
            let actual = theme;
            if (theme === 'auto') {
                actual = (window.matchMedia &&
                          window.matchMedia('(prefers-color-scheme: dark)').matches)
                    ? 'dark'
                    : 'light';
            }
            document.documentElement.setAttribute('data-theme', actual);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeIcon');
            if (!icon) return;
            if (theme === 'light') icon.className = 'bi bi-sun-fill';
            else if (theme === 'dark') icon.className = 'bi bi-moon-fill';
            else icon.className = 'bi bi-circle-half';
        }

        function setTheme(theme) {
            localStorage.setItem('adminTheme', theme);
            applyTheme(theme);
            updateThemeIcon(theme);
        }

        // ---------- THEME: init icon ----------
        document.addEventListener('DOMContentLoaded', function () {
            const saved = localStorage.getItem('adminTheme') || 'auto';
            updateThemeIcon(saved);
        });

        // ---------- THEME: react to system changes in auto mode ----------
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)')
                .addEventListener('change', function () {
                    const saved = localStorage.getItem('adminTheme') || 'auto';
                    if (saved === 'auto') applyTheme('auto');
                });
        }
    </script>

    <script type="module" src="users-activity.js?v=3"></script>

</body>
</html>
