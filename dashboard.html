<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>HKDMservices Dashboard</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
rel="stylesheet">

<link
href="style.css"
rel="stylesheet">

</head>


<body>


<!-- =====================================================
     DASHBOARD TOGGLE BUTTON
===================================================== -->

<button
    id="dashboardToggle"
    class="dashboard-toggle"
    type="button"
    aria-label="Open dashboard menu"
    aria-controls="dashboardPanel"
    aria-expanded="false"
>

    <i class="bi bi-list"></i>

</button>



<!-- =====================================================
     DASHBOARD SIDE PANEL
===================================================== -->

<div
    id="dashboardPanel"
    class="dashboard-panel"
    aria-hidden="true"
>


    <!-- PANEL HEADER -->

    <div class="dashboard-panel-header">

        <h3 class="mb-0">
            Dashboard Menu
        </h3>


        <button
            id="closeDashboardPanel"
            class="dashboard-panel-close"
            type="button"
            aria-label="Close dashboard menu"
        >

            <i class="bi bi-x-lg"></i>

        </button>

    </div>



    <!-- PANEL CONTENT -->

    <div class="dashboard-panel-content">


        <!-- =================================================
             QUICK ACTIONS
        ================================================= -->

        <div class="card p-4 shadow mb-4">


            <h3>
                Quick Actions
            </h3>



            <!-- ADD FUNDS -->

            <a
                href="wallet.html"
                class="btn btn-success mt-3"
            >

                <i class="bi bi-wallet2"></i>

                Add Funds

            </a>



            <!-- SERVICES & CATALOGUE -->

            <a
                href="services.html"
                class="btn btn-outline-success mt-3"
            >

                <i class="bi bi-grid-3x3-gap"></i>

                Services &amp; Catalogue

            </a>



            <!-- PLACE ORDER -->

            <a
                href="services.html"
                class="btn btn-outline-success mt-3"
            >

                <i class="bi bi-cart-plus"></i>

                Place Order

            </a>



            <!-- TRANSACTIONS -->

            <a
                href="transactions.html"
                class="btn btn-outline-dark mt-3"
            >

                <i class="bi bi-receipt"></i>

                View Transactions

            </a>


        </div>



        <!-- =================================================
             RECENT ORDERS
        ================================================= -->

        <div class="card shadow border-0">


            <div class="card-body p-4">


                <div class="mb-4">


                    <h3 class="mb-1">

                        Recent Orders

                    </h3>


                    <p class="text-muted mb-0">

                        Your latest orders

                    </p>


                </div>



                <div
                    id="recentOrders"
                    class="table-responsive"
                >

                    <div
                        class="text-center text-muted py-4"
                    >

                        <i
                            class="bi bi-hourglass-split"
                        ></i>

                        Loading orders...

                    </div>

                </div>


            </div>


        </div>


    </div>

</div>



<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar navbar-dark bg-dark">

<div class="container">


<a
class="navbar-brand fw-bold"
href="index.html"
>

<span class="brand-icon">⬢</span>

HKDMservices

</a>



<button
id="logout"
class="btn btn-danger"
>

<i class="bi bi-box-arrow-right"></i>

Logout

</button>


</div>

</nav>



<!-- =====================================================
     DASHBOARD
===================================================== -->

<section class="py-5">

<div class="container">


<h1 class="mb-4">

Welcome,
<span id="userName">User</span>

</h1>



<!-- =====================================================
     SUMMARY CARDS
===================================================== -->

<div class="row g-4">



<!-- WALLET -->

<div class="col-12 col-md-4">

<div class="card p-4 shadow h-100">

<i
class="bi bi-wallet2 fs-1 text-success"
></i>


<h4 class="mt-3">

Wallet Balance

</h4>


<h2 id="walletBalance">

₦0.00

</h2>


<p class="mb-0">

Available balance

</p>

</div>

</div>



<!-- ORDERS -->

<div class="col-12 col-md-4">

<div class="card p-4 shadow h-100">

<i
class="bi bi-cart-check fs-1 text-success"
></i>


<h4 class="mt-3">

Orders

</h4>


<h2 id="ordersCount">

0

</h2>


<p class="mb-0">

Total orders placed

</p>

</div>

</div>



<!-- SERVICES -->

<div class="col-12 col-md-4">

<div class="card p-4 shadow h-100">

<i
class="bi bi-grid-3x3-gap fs-1 text-success"
></i>


<h4 class="mt-3">

Services

</h4>


<h2>

36+

</h2>


<p class="mb-0">

Available services

</p>

</div>

</div>


</div>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script
type="module"
src="dashboard.js"
></script>


</body>

</html>
