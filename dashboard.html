<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

<title>HKDMservices Dashboard</title>


<!-- =====================================================

===================================================== -->

href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<!-- =====================================================

===================================================== -->

<body>


<!-- =====================================================
     DASHBOARD TOGGLE BUTTON
===================================================== -->

<button
    id="dashboardToggle"
    class="dashboard-toggle"
    type="button"
    aria-label="Open dashboard menu"
    aria-controls="dashboardPanel"
    aria-expanded="false"
>

    <i class="bi bi-list"></i>

</button>



<!-- =====================================================
     DASHBOARD SIDE PANEL
===================================================== -->

<div
    id="dashboardPanel"
    class="dashboard-panel"
    aria-hidden="true"
>


    <!-- =================================================
         PANEL HEADER
    ================================================= -->

    <div class="dashboard-panel-header">

        <h3 class="mb-0">

            Dashboard Menu

        </h3>


        <button
            id="closeDashboardPanel"
            class="dashboard-panel-close"
            type="button"
            aria-label="Close dashboard menu"
        >

            <i class="bi bi-x-lg"></i>

        </button>

    </div>



    <!-- =================================================
         PANEL CONTENT
    ================================================= -->

    <div class="dashboard-panel-content">


        <!-- =================================================
             QUICK ACTIONS
        ================================================= -->

        <div class="card p-4 shadow mb-4">

            <h3>

                Quick Actions

            </h3>



            <!-- =================================================
                 ADD FUNDS
            ================================================= -->

            <a
                href="wallet.html"
                class="btn btn-success mt-3"
            >

                <i class="bi bi-wallet2"></i>

                Add Funds

            </a>



            <!-- =================================================
                 SERVICES & CATALOGUE
            ================================================= -->

            <a
                href="services.html"
                class="btn btn-outline-success mt-3"
            >

                <i class="bi bi-grid-3x3-gap"></i>

                Services &amp; Catalogue

            </a>



            <!-- =================================================
                 TRANSACTIONS
            ================================================= -->

            <a
                href="transactions.html"
                class="btn btn-outline-dark mt-3"
            >

                <i class="bi bi-receipt"></i>

                View Transactions

            </a>



            <!-- =================================================
                 RECENT ORDERS
            ================================================= -->

            <a
                href="recent-orders.html"
                class="btn btn-outline-success mt-3"
            >

                <i class="bi bi-clock-history"></i>

                Recent Orders

            </a>



            <!-- =================================================
                 USER PROFILE
            ================================================= -->

            <a
                href="profile.html"
                class="btn btn-outline-primary mt-3"
            >

                <i class="bi bi-person-circle"></i>

                User Profile

            </a>



            <!-- =================================================
                 WHATSAPP SUPPORT (QUICK ACTION)
            ================================================= -->

            <button
                type="button"
                id="whatsappQuickBtn"
                class="btn btn-outline-success mt-3 text-start w-100"
            >
                <i class="bi bi-whatsapp"></i> Chat on WhatsApp
            </button>



            <!-- =================================================
                 ABOUT US
            ================================================= -->

            <a
                href="about.html"
                class="btn btn-outline-info mt-3"
            >

                <i class="bi bi-info-circle"></i>

                About Us

            </a>



            <!-- =================================================
                 TERMS & POLICY
            ================================================= -->

            <a
                href="terms-policy.html"
                class="btn btn-outline-secondary mt-3"
            >

                <i class="bi bi-file-earmark-text"></i>

                Terms &amp; Policy

            </a>


        </div>


    </div>

</div>



<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar navbar-dark bg-dark">

<div class="container">


    <!-- BRAND -->

    <a
        class="navbar-brand fw-bold"

<!-- =====================================================

<section class="py-5">

<div class="container">

        <!-- =================================================

        ================================================= -->

        ================================================= -->

                <h2>

                    36+

                    Available services

    <!-- =================================================

        <div class="col-12 col-md-6">
            <div class="card p-4 shadow">

                    <i class="bi bi-ticket-perforated text-success"></i> Redeem Voucher
                </h4>
                <form id="redeemVoucherForm">
                    <div class="mb-3">
                        <label for="redeemCodeInput" class="form-label">Enter Voucher Code</label>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="redeemCodeInput" 
                            placeholder="e.g. VOUCHER123" 
                            required
                        >
                    </div>
                    <button type="submit" class="btn btn-success">
                        Redeem to Wallet
                    </button>
                </form>
                <div id="redeemMsg" class="mt-3"></div>
            </div>
        </div>

    </div>


</div>

</section>



<!-- =====================================================
     DASHBOARD JAVASCRIPT
===================================================== -->

<script
    type="module"
    src="dashboard.js"
></script>



<!-- =====================================================
     TOGGLE & WHATSAPP JAVASCRIPT
===================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* ================================================
           ELEMENTS
        ================================================ */

        const toggleButton =
            document.getElementById(
                "dashboardToggle"
            );


        const dashboardPanel =
            document.getElementById(
                "dashboardPanel"
            );


        const closeButton =
            document.getElementById(
                "closeDashboardPanel"
            );



        /* ================================================
           OPEN PANEL
        ================================================ */

        if (
            toggleButton &&
            dashboardPanel
        ) {

            toggleButton.addEventListener(
                "click",
                function (event) {

                    event.stopPropagation();


                    dashboardPanel.classList.add(
                        "open"
                    );


                    toggleButton.setAttribute(
                        "aria-expanded",
                        "true"
                    );


                    dashboardPanel.setAttribute(
                        "aria-hidden",
                        "false"
                    );

                }
            );

        }



        /* ================================================
           CLOSE PANEL
        ================================================ */

        if (
            closeButton &&
            dashboardPanel
        ) {

            closeButton.addEventListener(
                "click",
                function () {


                    dashboardPanel.classList.remove(
                        "open"
                    );


                    toggleButton.setAttribute(
                        "aria-expanded",
                        "false"
                    );


                    dashboardPanel.setAttribute(
                        "aria-hidden",
                        "true"
                    );

                }
            );

        }



        /* ================================================
           CLOSE WHEN CLICKING OUTSIDE
        ================================================ */

        document.addEventListener(
            "click",
            function (event) {


                if (
                    !dashboardPanel ||
                    !toggleButton
                ) {

                    return;

                }


                if (
                    dashboardPanel.classList.contains(
                        "open"
                    ) &&

                    !dashboardPanel.contains(
                        event.target
                    ) &&

                    !toggleButton.contains(
                        event.target
                    )
                ) {


                    dashboardPanel.classList.remove(
                        "open"
                    );


                    toggleButton.setAttribute(
                        "aria-expanded",
                        "false"
                    );


                    dashboardPanel.setAttribute(
                        "aria-hidden",
                        "true"
                    );

                }

            }
        );


        /* ================================================
           WHATSAPP QUICK ACTION HANDLER
        ================================================ */

        const whatsappQuickBtn = document.getElementById("whatsappQuickBtn");
        if (whatsappQuickBtn) {
            whatsappQuickBtn.addEventListener("click", () => {
                let userEmail = "Guest User";
                try {
                    if (typeof auth !== 'undefined' && auth.currentUser) {
                        userEmail = auth.currentUser.email || "User";
                    }
                } catch (err) {
                    console.error(err);
                }

                const phoneNumber = "18253635037";
                const text = `*New Support Message*%0A` +
                             `*From:* ${userEmail}%0A` +
                             `*Subject:* Dashboard Inquiry%0A` +
                             `*Message:* Hello support, I need assistance with my account.`;

                const whatsappUrl = `https://wa.me/${phoneNumber}?text=${text}`;
                window.open(whatsappUrl, '_blank');
            });
        }


    }
);

</script>


</body>

</html>
