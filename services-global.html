<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Services | HKDMservices</title>
    <script src="theme.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <style>
        html[data-theme="dark"] body { background: #101418; color: #f1f3f5; }
        html[data-theme="dark"] .card { background: #181d22 !important; border-color: #30363d !important; color: #f1f3f5 !important; }
        html[data-theme="dark"] .table { color: #f1f3f5 !important; }
        html[data-theme="dark"] .table thead th { border-bottom-color: #30363d !important; }
        html[data-theme="dark"] .table td, .table th { border-color: #30363d !important; }
        .theme-toggle { width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: background 0.2s ease, transform 0.2s ease; }
        .theme-toggle:hover { background: rgba(255,255,255,0.18); transform: rotate(15deg); }
        .platform-filter { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
        .platform-filter .btn { font-size: 0.75rem; padding: 4px 14px; border-radius: 20px; }
        .platform-filter .btn.active-filter { background: #198754; color: #fff; border-color: #198754; }
        .service-search { max-width: 250px; }
        .service-search:focus { border-color: #198754; box-shadow: 0 0 0 2px rgba(25, 135, 84, 0.2); }
        .table-responsive { max-height: 600px; overflow-y: auto; }
        .table thead th { position: sticky; top: 0; background: #161b22; z-index: 10; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 12px; margin-bottom: 16px; }
        .stat-item { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px; text-align: center; }
        .stat-item .number { font-size: 1.3rem; font-weight: bold; color: #198754; }
        .stat-item .label { font-size: 0.65rem; color: #8b949e; text-transform: uppercase; }
        .back-btn {
            color: #8b949e;
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-btn:hover {
            color: #f1f3f5;
        }
        /* Service and Shop Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-item {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .stat-item .number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #198754;
        }
        .stat-item .number.text-warning {
            color: #d29922;
        }
        .stat-item .number.text-danger {
            color: #f85149;
        }
        .stat-item .number.text-info {
            color: #58a6ff;
        }
        .stat-item .label {
            font-size: 0.7rem;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand fw-bold" href="dashboard.html">
            <span class="brand-icon">⬢</span> HKDMservices
        </a>
        <div class="d-flex align-items-center gap-2">
            <button type="button" id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
                <i id="themeIcon" class="bi bi-moon-stars-fill"></i>
            </button>
        </div>
    </div>
</nav>

<section class="py-4">
    <div class="container">

        <!-- Back Button & Header -->
        <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
            <div>
                <a href="services.html" class="back-btn">
                    <i class="bi bi-arrow-left"></i> Back to Services
                </a>
                <h1 class="fw-bold mt-2"><i class="bi bi-globe text-success"></i> Global Services</h1>
                <p class="text-muted">International social media services for all platforms</p>
            </div>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-item"><div class="number" id="statTotal">0</div><div class="label">Total</div></div>
            <div class="stat-item"><div class="number" id="statPlatforms">0</div><div class="label">Platforms</div></div>
            <div class="stat-item"><div class="number" id="statCheapest">₦0</div><div class="label">Cheapest</div></div>
            <div class="stat-item"><div class="number" id="statExpensive">₦0</div><div class="label">Highest</div></div>
        </div>

        <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
            <div class="platform-filter" id="platformFilters">
                <button class="btn btn-outline-secondary active-filter" data-platform="all">All</button>
            </div>
            <input type="text" id="serviceSearch" class="form-control service-search" placeholder="Search services...">
        </div>

        <div class="card bg-dark border-secondary">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Service</th>
                                <th>Platform</th>
                                <th>Rate</th>
                                <th>Min Qty</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="servicesTableBody">
                            <tr><td colspan="5" class="text-center py-4 text-muted"><div class="spinner-border text-success" role="status"></div><p class="mt-2">Loading services...</p></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</section>

<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js"
    }
}
</script>

<script type="module">
    import { initializeApp } from "firebase/app";
    import { getAuth, onAuthStateChanged } from "firebase/auth";
    import { hkdmservicesOfficialServicePriceCatalogue } from "./services.js";

    const firebaseConfig = {
        apiKey: "AIzaSyADhpdfM0GaMJIkeQw7Q6eBK3u9CaWUC9k",
        authDomain: "hkdmservices-7d59f.firebaseapp.com",
        databaseURL: "https://hkdmservices-7d59f-default-rtdb.firebaseio.com",
        projectId: "hkdmservices-7d59f",
        storageBucket: "hkdmservices-7d59f.firebasestorage.app",
        messagingSenderId: "839538334772",
        appId: "1:839538334772:web:7d8785f87363b6e5d8fe61"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const tbody = document.getElementById('servicesTableBody');
    const searchInput = document.getElementById('serviceSearch');
    const platformFilters = document.getElementById('platformFilters');

    let allServices = [];
    let currentPlatform = 'all';

    function formatNaira(amount) {
        return '₦' + Number(amount || 0).toLocaleString('en-NG', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    function loadServices() {
        allServices = hkdmservicesOfficialServicePriceCatalogue || [];
        updatePlatformFilters();
        renderServices();
        updateStats();
    }

    function updatePlatformFilters() {
        const platforms = [...new Set(allServices.map(s => s.platform).filter(Boolean))];
        platformFilters.innerHTML = `
            <button class="btn btn-outline-secondary active-filter" data-platform="all">All</button>
            ${platforms.map(p => `<button class="btn btn-outline-secondary" data-platform="${p}">${p}</button>`).join('')}
        `;
        platformFilters.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', () => {
                platformFilters.querySelectorAll('.btn').forEach(b => b.classList.remove('active-filter'));
                btn.classList.add('active-filter');
                currentPlatform = btn.dataset.platform;
                renderServices();
            });
        });
    }

    function renderServices() {
        const searchTerm = searchInput.value.toLowerCase().trim();
        let filtered = allServices;

        if (currentPlatform !== 'all') {
            filtered = filtered.filter(s => s.platform === currentPlatform);
        }
        if (searchTerm) {
            filtered = filtered.filter(s =>
                (s.service || '').toLowerCase().includes(searchTerm) ||
                (s.platform || '').toLowerCase().includes(searchTerm)
            );
        }

        filtered.sort((a, b) => {
            if (a.platform !== b.platform) return a.platform.localeCompare(b.platform);
            return (a.service || '').localeCompare(b.service || '');
        });

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">No services found</td></tr>`;
            return;
        }

        tbody.innerHTML = filtered.map(service => {
            const isOneTime = service.oneTimePayment === true || (service.fixedPrice !== null && service.fixedPrice !== undefined);

            let rateDisplay = '';
            if (isOneTime) {
                rateDisplay = `💰 ${formatNaira(service.fixedPrice || service.ratePer1000)} (Fixed)`;
            } else if (service.ratePer1000 !== null && service.ratePer1000 !== undefined) {
                rateDisplay = formatNaira(service.ratePer1000);
            } else {
                rateDisplay = 'N/A';
            }

            const badges = [];
            if (isOneTime) badges.push('<span class="badge bg-warning text-dark ms-1">One-Time</span>');
            if (service.service && service.service.toLowerCase().includes('comment')) {
                badges.push('<span class="badge bg-primary ms-1">Comment</span>');
            }

            return `
                <tr>
                    <td>
                        <strong>${service.service || 'N/A'}</strong>
                        ${badges.join('')}
                    </td>
                    <td><span class="badge bg-info">${service.platform || 'N/A'}</span></td>
                    <td class="text-success fw-bold">${rateDisplay}</td>
                    <td>${service.minimumQuantity || 100}</td>
                    <td>
                        <a href="order.html?service=${service.id}&platform=${service.platform}" 
                           class="btn btn-sm btn-success">
                            <i class="bi bi-cart-plus"></i> Order
                        </a>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function updateStats() {
        const total = allServices.length;
        const platforms = [...new Set(allServices.map(s => s.platform).filter(Boolean))];

        const rates = allServices.map(s => {
            if (s.oneTimePayment === true || s.fixedPrice !== null) {
                return Number(s.fixedPrice || s.ratePer1000 || 0);
            }
            return Number(s.ratePer1000 || 0);
        }).filter(r => r > 0);

        document.getElementById('statTotal').textContent = total;
        document.getElementById('statPlatforms').textContent = platforms.length;
        document.getElementById('statCheapest').textContent = rates.length > 0 ? formatNaira(Math.min(...rates)) : '₦0';
        document.getElementById('statExpensive').textContent = rates.length > 0 ? formatNaira(Math.max(...rates)) : '₦0';
    }

    searchInput.addEventListener('input', renderServices);

    onAuthStateChanged(auth, (user) => {
        if (!user) { window.location.href = 'login.html'; return; }
        loadServices();
    });

    console.log('✅ Global Services loaded with back button!');
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
