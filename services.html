<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HKDMservices | Services</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <link
        href="style.css"
        rel="stylesheet"
    >

    <style>
        /* Theme Transition & Root Overrides */
        body {
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        [data-bs-theme="light"] {
            background-color: #f8f9fa;
            color: #212529;
        }

        [data-bs-theme="dark"] {
            background-color: #121212;
            color: #f8f9fa;
        }

        [data-bs-theme="light"] .card {
            background-color: #ffffff;
            color: #212529;
        }

        [data-bs-theme="dark"] .card {
            background-color: #1e1e1e;
            color: #f8f9fa;
        }
    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
====================================================== -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="dashboard.html"
        >

            <span class="brand-icon">⬢</span>

            HKDMservices

        </a>


        <div class="d-flex align-items-center gap-2">

            <!-- Theme Toggle Button -->
            <button
                type="button"
                id="themeToggle"
                class="btn btn-outline-light btn-sm"
                title="Toggle dark/light mode"
            >
                <i class="bi bi-sun-fill" id="themeIcon"></i>
            </button>

            <a
                href="dashboard.html"
                class="btn btn-outline-light btn-sm"
            >

                <i class="bi bi-speedometer2"></i>

                Dashboard

            </a>

        </div>

    </div>

</nav>



<!-- =====================================================
     HEADER
====================================================== -->

<section class="py-5 bg-light">

    <div class="container text-center">

        <h1 class="fw-bold">
            HKDMservices Services
        </h1>

        <p class="text-muted mb-0">
            Choose from our General and Nigeria service catalogues.
        </p>

    </div>

</section>



<!-- =====================================================
     CATALOGUE SELECTOR
====================================================== -->

<section class="py-4">

    <div class="container">

        <div class="d-flex flex-wrap justify-content-center gap-2">

            <button
                type="button"
                class="btn btn-success catalogue-btn active"
                data-catalogue="all"
            >
                All Services
            </button>


            <button
                type="button"
                class="btn btn-outline-success catalogue-btn"
                data-catalogue="general"
            >
                General Services
            </button>


            <button
                type="button"
                class="btn btn-outline-success catalogue-btn"
                data-catalogue="nigeria"
            >
                🇳🇬 Nigeria Services
            </button>

        </div>

    </div>

</section>



<!-- =====================================================
     SEARCH
====================================================== -->

<section class="pb-4">

    <div class="container">

        <div class="row">

            <div class="col-12 col-md-8 col-lg-6 mx-auto">

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-search"></i>
                    </span>

                    <input
                        type="text"
                        id="serviceSearch"
                        class="form-control"
                        placeholder="Search Instagram, TikTok, YouTube..."
                    >

                </div>

            </div>

        </div>

    </div>

</section>



<!-- =====================================================
     PLATFORM FILTER
====================================================== -->

<section class="pb-4">

    <div class="container">

        <div
            id="platformFilters"
            class="d-flex flex-wrap justify-content-center gap-2"
        >

            <button
                type="button"
                class="btn btn-success platform-btn active"
                data-platform="all"
            >
                All Platforms
            </button>

        </div>

    </div>

</section>



<!-- =====================================================
     TIER INFORMATION
====================================================== -->

<section class="pb-4">

    <div class="container">

        <div
            id="tierInfo"
            class="alert alert-success text-center mb-0"
        >

            <i class="bi bi-shield-check"></i>

            <strong id="tierName">
                REGULAR
            </strong>

            pricing is currently displayed.

        </div>

    </div>

</section>



<!-- =====================================================
     SERVICE COUNT
====================================================== -->

<section class="pb-3">

    <div class="container">

        <div class="d-flex justify-content-between align-items-center">

            <h4 class="fw-bold mb-0">
                Available Services
            </h4>

            <span
                id="serviceCount"
                class="badge bg-secondary"
            >
                0 Services
            </span>

        </div>

    </div>

</section>



<!-- =====================================================
     SERVICES
====================================================== -->

<section class="pb-5">

    <div class="container">

        <div
            id="servicesContainer"
            class="row g-4"
        >

            <div class="col-12 text-center py-5">

                <div
                    class="spinner-border text-success"
                    role="status"
                ></div>

                <p class="text-muted mt-3">
                    Loading services...
                </p>

            </div>

        </div>


        <div
            id="noServices"
            class="text-center py-5 d-none"
        >

            <i class="bi bi-search fs-1 text-muted"></i>

            <h4 class="mt-3">
                No services found
            </h4>

            <p class="text-muted">
                Try another search or filter.
            </p>

        </div>

    </div>

</section>



<!-- =====================================================
     FOOTER
====================================================== -->

<footer class="bg-dark text-white py-4">

    <div class="container text-center">

        <p class="mb-1">
            © 2026 HKDMservices
        </p>

        <small class="text-secondary">
            General & Nigeria Services
        </small>

    </div>

</footer>



<!-- =====================================================
     SERVICES LOGIC
====================================================== -->

<script type="module">

import {
    auth,
    database
} from "./firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
    ref,
    get
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


import {
    hkdmservicesOfficialServicePriceCatalogue
} from "./services.js";


import {
    hkdmservicesNigeriaServicePriceCatalogue
} from "./nigeria-services-catalogue.js";



/* =====================================================
   ELEMENTS
===================================================== */

const servicesContainer =
    document.getElementById(
        "servicesContainer"
    );


const noServices =
    document.getElementById(
        "noServices"
    );


const serviceSearch =
    document.getElementById(
        "serviceSearch"
    );


const serviceCount =
    document.getElementById(
        "serviceCount"
    );


const tierName =
    document.getElementById(
        "tierName"
    );


const platformFilters =
    document.getElementById(
        "platformFilters"
    );


const catalogueButtons =
    document.querySelectorAll(
        ".catalogue-btn"
    );



/* =====================================================
   DARK / LIGHT MODE TOGGLE
===================================================== */

const themeToggleBtn = document.getElementById("themeToggle");
const themeIcon = document.getElementById("themeIcon");

function setTheme(theme) {
    document.documentElement.setAttribute("data-bs-theme", theme);
    localStorage.setItem("hkdm_theme", theme);
    
    if (theme === "dark") {
        themeIcon.className = "bi bi-sun-fill";
    } else {
        themeIcon.className = "bi bi-moon-fill";
    }
}

// Initialize theme from localStorage or default to dark
const savedTheme = localStorage.getItem("hkdm_theme") || "dark";
setTheme(savedTheme);

themeToggleBtn.addEventListener("click", () => {
    const currentTheme = document.documentElement.getAttribute("data-bs-theme");
    const newTheme = currentTheme === "dark" ? "light" : "dark";
    setTheme(newTheme);
});



/* =====================================================
   VARIABLES
===================================================== */

let currentTier = "regular";

let currentCatalogue = "all";

let currentPlatform = "all";

let currentSearch = "";


let allServices = [];



/* =====================================================
   BUILD COMBINED CATALOGUE
===================================================== */

function buildCatalogue() {

    const generalServices =
        Array.isArray(
            hkdmservicesOfficialServicePriceCatalogue
        )
            ? hkdmservicesOfficialServicePriceCatalogue
            : [];


    const nigeriaServices =
        Array.isArray(
            hkdmservicesNigeriaServicePriceCatalogue
        )
            ? hkdmservicesNigeriaServicePriceCatalogue
            : [];


    allServices = [

        ...generalServices.map(
            service => ({
                ...service,
                catalogue: "general"
            })
        ),

        ...nigeriaServices.map(
            service => ({
                ...service,
                catalogue: "nigeria"
            })
        )

    ];

}



/* =====================================================
   FORMAT NAIRA
===================================================== */

function formatNaira(amount) {

    return new Intl.NumberFormat(
        "en-NG",
        {
            style: "currency",
            currency: "NGN",
            minimumFractionDigits: 2
        }
    ).format(
        Number(amount || 0)
    );

}



/* =====================================================
   GET ACTIVE PRICE
===================================================== */

function getServicePrice(service) {

    const tier =
        String(
            currentTier || "regular"
        ).toLowerCase();


    if (
        tier === "reseller" &&
        service.resellerRatePer1000 !== undefined
    ) {

        return service.resellerRatePer1000;

    }


    if (
        tier === "vip" &&
        service.vipRatePer1000 !== undefined
    ) {

        return service.vipRatePer1000;

    }


    return service.ratePer1000 || 0;

}



/* =====================================================
   UPDATE TIER
===================================================== */

async function loadUserTier(user) {

    try {

        const userRef =
            ref(
                database,
                `users/${user.uid}`
            );


        const snapshot =
            await get(userRef);


        if (
            snapshot.exists()
        ) {

            const userData =
                snapshot.val();


            currentTier =
                String(
                    userData.tier ||
                    "regular"
                ).toLowerCase();

        }

    } catch (error) {

        console.error(
            "Unable to load user tier:",
            error
        );

        currentTier =
            "regular";

    }


    tierName.textContent =
        currentTier.toUpperCase();

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}



/* =====================================================
   GET PLATFORMS
===================================================== */

function updatePlatformFilters() {

    const platforms = [

        ...new Set(

            allServices

                .filter(service => {

                    if (
                        currentCatalogue === "all"
                    ) {
                        return true;
                    }

                    return (
                        service.catalogue ===
                        currentCatalogue
                    );

                })

                .map(
                    service =>
                        service.platform
                )

                .filter(Boolean)

        )

    ];


    platformFilters.innerHTML = "";


    const allButton =
        document.createElement(
            "button"
        );


    allButton.type =
        "button";


    allButton.className =
        "btn btn-success platform-btn active";


    allButton.dataset.platform =
        "all";


    allButton.textContent =
        "All Platforms";


    platformFilters.appendChild(
        allButton
    );


    platforms.forEach(
        platform => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "btn btn-outline-success platform-btn";


            button.dataset.platform =
                platform;


            button.textContent =
                platform;


            platformFilters.appendChild(
                button
            );

        }
    );


    currentPlatform =
        "all";


    attachPlatformEvents();

}



/* =====================================================
   PLATFORM EVENTS
===================================================== */

function attachPlatformEvents() {

    document
        .querySelectorAll(
            ".platform-btn"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        document
                            .querySelectorAll(
                                ".platform-btn"
                            )
                            .forEach(
                                btn => {

                                    btn.classList.remove(
                                        "active"
                                    );

                                    btn.classList.remove(
                                        "btn-success"
                                    );

                                    btn.classList.add(
                                        "btn-outline-success"
                                    );

                                }
                            );


                        button.classList.add(
                            "active"
                        );

                        button.classList.remove(
                            "btn-outline-success"
                        );

                        button.classList.add(
                            "btn-success"
                        );


                        currentPlatform =
                            button.dataset.platform;


                        renderServices();

                    }
                );

            }
        );

}



/* =====================================================
   FILTER SERVICES
===================================================== */

function getFilteredServices() {

    const search =
        currentSearch.toLowerCase();


    return allServices.filter(
        service => {

            const catalogueMatch =
                currentCatalogue === "all" ||
                service.catalogue ===
                    currentCatalogue;


            const platformMatch =
                currentPlatform === "all" ||
                String(
                    service.platform || ""
                ).toLowerCase() ===
                    currentPlatform.toLowerCase();


            const searchableText =

                String(
                    service.platform || ""
                ).toLowerCase()

                + " " +

                String(
                    service.service || ""
                ).toLowerCase()

                + " " +

                String(
                    service.id || ""
                ).toLowerCase();


            const searchMatch =
                !search ||
                searchableText.includes(
                    search
                );


            return (
                catalogueMatch &&
                platformMatch &&
                searchMatch
            );

        }
    );

}



/* =====================================================
   RENDER SERVICES
===================================================== */

function renderServices() {

    const services =
        getFilteredServices();


    serviceCount.textContent =
        `${services.length} Services`;


    servicesContainer.innerHTML =
        "";


    if (
        services.length === 0
    ) {

        noServices.classList.remove(
            "d-none"
        );

        return;

    }


    noServices.classList.add(
        "d-none"
    );


    services.forEach(
        service => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "col-12 col-md-6 col-lg-4";


            const price =
                getServicePrice(
                    service
                );


            const regularRate =
                Number(
                    service.ratePer1000 || 0
                );


            const resellerRate =
                service.resellerRatePer1000;


            const vipRate =
                service.vipRatePer1000;


            const catalogueBadge =
                service.catalogue === "nigeria"

                    ? `
                        <span class="badge bg-success">
                            🇳🇬 Nigeria
                        </span>
                      `

                    : `
                        <span class="badge bg-primary">
                            General
                        </span>
                      `;


            card.innerHTML = `

                <div class="card h-100 shadow-sm border-0">

                    <div class="card-body">

                        <div
                            class="d-flex justify-content-between align-items-start mb-3"
                        >

                            <div class="d-flex flex-wrap gap-1">

                                <span class="badge bg-dark">

                                    ${escapeHtml(
                                        service.platform ||
                                        "Social Media"
                                    )}

                                </span>

                                ${catalogueBadge}

                            </div>


                            <small class="text-muted">

                                #${escapeHtml(
                                    service.id || ""
                                )}

                            </small>

                        </div>


                        <h5 class="fw-bold">

                            ${escapeHtml(
                                service.service ||
                                "Service"
                            )}

                        </h5>


                        <p class="text-muted small">

                            ${escapeHtml(
                                service.description ||
                                `${service.service || "Service"} service for ${service.platform || "social media"}.`
                            )}

                        </p>


                        <hr>


                        <div class="mb-3">

                            <small class="text-muted d-block">
                                Price per 1,000
                            </small>

                            <div class="fs-4 fw-bold text-success">

                                ${formatNaira(price)}

                            </div>

                        </div>


                        ${
                            currentTier !== "regular" &&
                            price !== regularRate
                                ? `

                                    <small class="text-muted d-block">

                                        Regular:
                                        ${formatNaira(
                                            regularRate
                                        )}

                                    </small>

                                  `
                                : ""
                        }


                        ${
                            currentTier === "regular" &&
                            (
                                resellerRate !== undefined ||
                                vipRate !== undefined
                            )
                                ? `

                                    <div class="small text-muted">

                                        ${
                                            resellerRate !== undefined
                                                ? `
                                                    Reseller:
                                                    ${formatNaira(
                                                        resellerRate
                                                    )}
                                                  `
                                                : ""
                                        }

                                        ${
                                            vipRate !== undefined
                                                ? `
                                                    <br>
                                                    VIP:
                                                    ${formatNaira(
                                                        vipRate
                                                    )}
                                                  `
                                                : ""
                                        }

                                    </div>

                                  `
                                : ""
                        }


                        <button
                            type="button"
                            class="btn btn-success w-100 mt-4 order-service-btn"
                            data-service-id="${escapeHtml(
                                service.id || ""
                            )}"
                            data-catalogue="${escapeHtml(
                                service.catalogue
                            )}"
                            data-platform="${escapeHtml(
                                service.platform || ""
                            )}"
                        >

                            <i class="bi bi-cart-plus"></i>

                            Order Service

                        </button>

                    </div>

                </div>

            `;


            servicesContainer.appendChild(
                card
            );

        }
    );


    attachOrderButtons();

}



/* =====================================================
   ORDER BUTTONS
===================================================== */

function attachOrderButtons() {

    document
        .querySelectorAll(
            ".order-service-btn"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        const serviceId =
                            button.dataset.serviceId;


                        const catalogue =
                            button.dataset.catalogue;


                        const platform =
                            button.dataset.platform;


                        window.location.href =

                            `order.html?service=${encodeURIComponent(
                                serviceId
                            )}&platform=${encodeURIComponent(
                                platform
                            )}&catalogue=${encodeURIComponent(
                                catalogue
                            )}`;

                    }
                );

            }
        );

}



/* =====================================================
   CATALOGUE BUTTONS
===================================================== */

catalogueButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                catalogueButtons.forEach(
                    btn => {

                        btn.classList.remove(
                            "active"
                        );

                        btn.classList.remove(
                            "btn-success"
                        );

                        btn.classList.add(
                            "btn-outline-success"
                        );

                    }
                );


                button.classList.add(
                    "active"
                );

                button.classList.remove(
                    "btn-outline-success"
                );

                button.classList.add(
                    "btn-success"
                );


                currentCatalogue =
                    button.dataset.catalogue;


                updatePlatformFilters();

                renderServices();

            }
        );

    }
);



/* =====================================================
   SEARCH
===================================================== */

serviceSearch.addEventListener(
    "input",
    () => {

        currentSearch =
            serviceSearch.value.trim();


        renderServices();

    }
);



/* =====================================================
   AUTHENTICATION
===================================================== */

onAuthStateChanged(
    auth,
    async user => {

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }


        buildCatalogue();


        await loadUserTier(
            user
        );


        updatePlatformFilters();


        renderServices();

    }
);

</script>


</body>

</html>
