<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HKDMservices | Official Service & Price Catalogue</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link
        href="style.css"
        rel="stylesheet"
    >

</head>


<body>


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="dashboard.html"
        >

            <span class="brand-icon">⬢</span>

            HKDMservices

        </a>


        <div class="d-flex gap-2">

            <a
                href="dashboard.html"
                class="btn btn-outline-light"
            >

                <i class="bi bi-speedometer2"></i>

                Dashboard

            </a>


            <a
                href="wallet.html"
                class="btn btn-success"
            >

                <i class="bi bi-wallet2"></i>

                Add Funds

            </a>

        </div>

    </div>

</nav>



<section class="py-5">

    <div class="container">


        <div class="text-center mb-5">

            <h1 class="fw-bold">

                HKDMservices

            </h1>


            <h2 class="fw-bold">

                Official Service &amp; Price Catalogue

            </h2>


            <p class="text-muted">

                Select a platform to view available services and prices.

            </p>

        </div>



        <div class="row justify-content-center mb-5">

            <div class="col-12 col-md-8">

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-search"></i>

                    </span>


                    <input
                        type="search"
                        id="platformSearch"
                        class="form-control"
                        placeholder="Search platform..."
                        autocomplete="off"
                    >

                </div>

            </div>

        </div>



        <div
            id="platformContainer"
            class="row g-4"
        >

        </div>



        <div
            id="emptyMessage"
            class="text-center py-5 d-none"
        >

            <i
                class="bi bi-search fs-1 text-muted"
            ></i>


            <h4 class="mt-3">

                No platform found

            </h4>


            <p class="text-muted">

                Try another search.

            </p>

        </div>



        <div class="card shadow-sm border-0 mt-5">

            <div class="card-body p-4 text-center">

                <i
                    class="bi bi-info-circle text-success"
                    style="font-size: 2rem;"
                ></i>


                <h4 class="mt-3">

                    How it works

                </h4>


                <p class="text-muted mb-0">

                    Choose a platform, select the service you want,
                    then continue to place your order.

                </p>

            </div>

        </div>



        <div class="text-center mt-4">

            <a
                href="dashboard.html"
                class="btn btn-outline-dark"
            >

                <i class="bi bi-arrow-left"></i>

                Back to Dashboard

            </a>

        </div>


    </div>

</section>



<script type="module">

import {
    hkdmservicesOfficialServicePriceCatalogue
} from "./services.js";


const platformContainer =
    document.getElementById("platformContainer");


const platformSearch =
    document.getElementById("platformSearch");


const emptyMessage =
    document.getElementById("emptyMessage");



const platforms = [
    ...new Set(
        hkdmservicesOfficialServicePriceCatalogue.map(
            item => item.platform
        )
    )
];



const platformIcons = {

    "Instagram": "bi-instagram",

    "TikTok": "bi-tiktok",

    "YouTube": "bi-youtube",

    "Facebook": "bi-facebook",

    "X (Twitter)": "bi-twitter-x",

    "Telegram": "bi-telegram",

    "Spotify": "bi-spotify",

    "WhatsApp": "bi-whatsapp",

    "Apple Music": "bi-apple-music"

};



function renderPlatforms(searchTerm = "") {

    platformContainer.innerHTML = "";


    const search =
        searchTerm
            .trim()
            .toLowerCase();


    const filteredPlatforms =
        platforms.filter(platform =>
            platform
                .toLowerCase()
                .includes(search)
        );


    if (filteredPlatforms.length === 0) {

        emptyMessage.classList.remove("d-none");

        return;

    }


    emptyMessage.classList.add("d-none");


    filteredPlatforms.forEach(platform => {


        const services =
            hkdmservicesOfficialServicePriceCatalogue.filter(
                item => item.platform === platform
            );


        const card =
            document.createElement("div");


        card.className =
            "col-12 col-md-6 col-lg-4";


        const icon =
            platformIcons[platform] || "bi-grid";


        card.innerHTML = `

            <div class="card h-100 shadow-sm border-0">

                <div class="card-body p-4">

                    <div class="text-center mb-3">

                        <i
                            class="bi ${icon} fs-1 text-success"
                        ></i>

                    </div>


                    <h4 class="text-center fw-bold">

                        ${platform}

                    </h4>


                    <p class="text-center text-muted">

                        ${services.length}
                        service${services.length === 1 ? "" : "s"}
                        available

                    </p>


                    <div class="d-grid mt-3">

                        <a
                            href="order.html?platform=${encodeURIComponent(platform)}"
                            class="btn btn-success"
                        >

                            View Services

                        </a>

                    </div>

                </div>

            </div>

        `;


        platformContainer.appendChild(card);

    });

}



platformSearch.addEventListener(
    "input",
    () => {

        renderPlatforms(
            platformSearch.value
        );

    }
);



renderPlatforms();

</script>



<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
></script>


</body>

</html>
