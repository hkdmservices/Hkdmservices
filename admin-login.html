<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | HKDMservices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #0d1117;
            color: #f1f3f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
        }
        .login-card h2 {
            color: #f1f3f5;
        }
        .login-card .form-control {
            background: #0d1117;
            border-color: #30363d;
            color: #f1f3f5;
        }
        .login-card .form-control:focus {
            border-color: #198754;
            box-shadow: none;
        }
        .login-card .btn-success {
            background: #198754;
            border: none;
        }
        .login-card .btn-success:hover {
            background: #157347;
        }
        .login-card .btn-outline-light {
            border-color: #30363d;
            color: #f1f3f5;
        }
        .login-card .btn-outline-light:hover {
            background: #21262d;
        }
        .error-msg {
            color: #f85149;
            font-size: 0.9rem;
        }
        .admin-badge {
            display: inline-block;
            background: #198754;
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <span class="admin-badge"><i class="bi bi-shield-lock-fill"></i> Admin</span>
            <h2>Admin Login</h2>
            <p class="text-muted">Enter your admin credentials</p>
        </div>

        <form id="adminLoginForm">
            <div class="mb-3">
                <label for="adminEmail" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="adminEmail" placeholder="admin@hkdmservices.xyz" required>
            </div>
            <div class="mb-3">
                <label for="adminPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="adminPassword" placeholder="Enter password" required>
            </div>
            <div id="loginError" class="error-msg mb-3" style="display:none;"></div>
            <button type="submit" class="btn btn-success w-100 py-2" id="loginBtn">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </button>
        </form>
        <div class="text-center mt-3">
            <a href="login.html" class="text-muted text-decoration-none"><i class="bi bi-arrow-left"></i> Regular User Login</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyADhpdfM0GaMJIkeQw7Q6eBK3u9CaWUC9k",
            authDomain: "hkdmservices-7d59f.firebaseapp.com",
            databaseURL: "https://hkdmservices-7d59f-default-rtdb.firebaseio.com",
            projectId: "hkdmservices-7d59f",
            storageBucket: "hkdmservices-7d59f.firebasestorage.app",
            messagingSenderId: "839538334772",
            appId: "1:839538334772:web:7d8785f87363b6e5d8fe61"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        const form = document.getElementById('adminLoginForm');
        const errorDiv = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value.trim();

            errorDiv.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Checking...';

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                const userRef = database.ref('users/' + user.uid);
                const snapshot = await userRef.once('value');
                const userData = snapshot.val();

                if (userData && (userData.role === 'admin' || userData.isAdmin === true)) {
                    window.location.href = 'admin-panel-new.html';
                } else {
                    await auth.signOut();
                    showError('Access denied. You do not have admin privileges.');
                }

            } catch (error) {
                let msg = 'Login failed. Please check your credentials.';
                if (error.code === 'auth/user-not-found') msg = 'No account found with this email.';
                else if (error.code === 'auth/wrong-password') msg = 'Incorrect password. Please try again.';
                else if (error.code === 'auth/too-many-requests') msg = 'Too many failed attempts. Please try again later.';
                showError(msg);
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Login';
            }
        });

        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
