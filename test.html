<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Test</title>
</head>
<body>
    <h2>🔧 Firebase Connection Test</h2>
    <p>Testing Firebase initialization...</p>

    <div id="result" style="margin-top: 20px; padding: 15px; border: 1px solid #ccc; background: #f9f9f9;"></div>

    <script type="module">
        // This will show us if Firebase can load
        const resultDiv = document.getElementById('result');

        try {
            // Try to import Firebase
            const { initializeApp } = await import("https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js");
            const { getAuth } = await import("https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js");

            // Try to use environment variables (FIXED: using import.meta.env)
            const config = {
                apiKey: import.meta.env.VITE_FIREBASE_API_KEY,
                authDomain: import.meta.env.VITE_FIREBASE_AUTH_DOMAIN,
                databaseURL: import.meta.env.VITE_FIREBASE_DATABASE_URL,
                projectId: import.meta.env.VITE_FIREBASE_PROJECT_ID,
                storageBucket: import.meta.env.VITE_FIREBASE_STORAGE_BUCKET,
                messagingSenderId: import.meta.env.VITE_FIREBASE_MESSAGING_SENDER_ID,
                appId: import.meta.env.VITE_FIREBASE_APP_ID
            };

            // Check if we got the keys
            const hasApiKey = config.apiKey && config.apiKey !== 'undefined';

            resultDiv.innerHTML = `
                <strong>✅ Firebase imports successful</strong><br><br>
                <strong>Environment Variables Status:</strong><br>
                VITE_FIREBASE_API_KEY: ${hasApiKey ? '✅ Present' : '❌ MISSING'}<br>
                VITE_FIREBASE_AUTH_DOMAIN: ${config.authDomain ? '✅ Present' : '❌ MISSING'}<br>
                VITE_FIREBASE_DATABASE_URL: ${config.databaseURL ? '✅ Present' : '❌ MISSING'}<br>
                VITE_FIREBASE_PROJECT_ID: ${config.projectId ? '✅ Present' : '❌ MISSING'}<br>
                <br>
                ${hasApiKey ? '✅ All keys present! Firebase should work.' : '❌ Keys are missing! Vercel is not injecting environment variables.'}
            `;

            if (hasApiKey) {
                // Try to initialize Firebase
                const app = initializeApp(config);
                const auth = getAuth(app);
                resultDiv.innerHTML += `<br>✅ Firebase initialized successfully! Auth object created.`;
            }

        } catch (error) {
            resultDiv.innerHTML = `
                <strong>❌ Error:</strong><br>
                ${error.message}<br><br>
                <strong>This means:</strong> Firebase failed to load. Check your internet connection or Firebase import URL.
            `;
            console.error('Test error:', error);
        }
    </script>
</body>
</html>
