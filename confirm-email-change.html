<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Email Change | HKDMservices</title>
    <script src="theme.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <style>
        html[data-theme="dark"] body { background: #101418; color: #f1f3f5; }
        html[data-theme="dark"] .card { background: #181d22 !important; border-color: #30363d !important; color: #f1f3f5 !important; }
        html[data-theme="dark"] .text-muted { color: #adb5bd !important; }
    </style>
</head>
<body>

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-12 col-md-6 col-lg-5">
                <div class="card shadow border-0">
                    <div class="card-body p-5 text-center">

                        <div id="loadingView">
                            <div class="spinner-border text-success mb-3" role="status" style="width:3rem; height:3rem;"></div>
                            <h4 class="mb-2">Verifying...</h4>
                            <p class="text-muted">Please wait a moment.</p>
                        </div>

                        <div id="successView" class="d-none">
                            <div style="font-size:4rem;">✅</div>
                            <h3 class="fw-bold mb-3 text-success">Email Changed!</h3>
                            <p class="text-muted mb-4" id="successMessage"></p>
                            <a href="profile.html" class="btn btn-success btn-lg w-100">Go to Profile</a>
                        </div>

                        <div id="errorView" class="d-none">
                            <div style="font-size:4rem;">❌</div>
                            <h3 class="fw-bold mb-3 text-danger">Verification Failed</h3>
                            <p class="text-muted mb-4" id="errorMessage"></p>
                            <a href="profile.html" class="btn btn-outline-secondary btn-lg w-100">Back to Profile</a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
async function verifyEmailChange() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
        document.getElementById('loadingView').classList.add('d-none');
        document.getElementById('errorView').classList.remove('d-none');
        document.getElementById('errorMessage').textContent = 'Missing verification token.';
        return;
    }

    try {
        const response = await fetch('https://hkdmservices.xyz/api-php/confirm-email-change.php?token=' + encodeURIComponent(token));
        const result = await response.json();

        document.getElementById('loadingView').classList.add('d-none');

        if (result.success) {
            document.getElementById('successView').classList.remove('d-none');
            document.getElementById('successMessage').innerHTML =
                `Your email has been successfully changed to <strong>${result.newEmail}</strong>.<br><br>
                <small class="text-muted">Note: You may need to log out and log back in for the change to take full effect.</small>`;
        } else {
            document.getElementById('errorView').classList.remove('d-none');
            document.getElementById('errorMessage').textContent = result.message || 'Verification failed.';
        }
    } catch (error) {
        console.error('Verification error:', error);
        document.getElementById('loadingView').classList.add('d-none');
        document.getElementById('errorView').classList.remove('d-none');
        document.getElementById('errorMessage').textContent = 'Unable to verify. Please try again.';
    }
}

verifyEmailChange();
</script>

</body>
</html>
