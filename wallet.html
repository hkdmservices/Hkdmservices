<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fund Wallet - HKDMServices</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="style.css" rel="stylesheet">

</head>

<body>

<div class="container py-5">

<h2 class="mb-4">Fund Wallet</h2>

<!-- Fund Wallet Card -->
<div class="card p-4 shadow mb-4">

<div class="mb-3">

<label class="form-label">
Amount (₦)
</label>

<input
type="number"
id="amount"
class="form-control"
placeholder="Enter amount">

</div>

<button
id="payButton"
class="btn btn-success">

Fund Wallet

</button>

<div
id="message"
class="mt-3 text-danger">

</div>

</div>


<!-- Voucher Redemption Card -->
<div class="card p-4 shadow">

<h5 class="mb-3">
<i class="bi bi-ticket-perforated"></i> Redeem Voucher
</h5>

<div class="mb-3">

<label for="voucherCodeInput" class="form-label">
Voucher Code
</label>

<input
type="text"
id="voucherCodeInput"
class="form-control"
placeholder="Enter voucher code (e.g. SKLVL22)">

</div>

<button
id="redeemVoucherBtn"
class="btn btn-primary w-100">

Redeem Voucher

</button>

</div>

</div>

<script src="https://korablobstorage.blob.core.windows.net/modal-bucket/korapay-collections.min.js"></script>
<script type="module" src="wallet.js"></script>

</body>

</html>
