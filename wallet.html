<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fund Wallet - HKDMServices</title>

<!-- =====================================================
     GLOBAL THEME SCRIPT
===================================================== -->
<script src="theme.js"></script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

<link href="style.css" rel="stylesheet">

<style>
/* =====================================================
   DARK MODE OVERRIDES
===================================================== */
html[data-theme="dark"] body {
    background: #101418;
    color: #f1f3f5;
}

html[data-theme="dark"] .card {
    background: #181d22 !important;
    border-color: #30363d !important;
    color: #f1f3f5 !important;
}

html[data-theme="dark"] .form-control {
    background: #151a1f !important;
    border-color: #30363d !important;
    color: #f1f3f5 !important;
}

html[data-theme="dark"] .form-control:focus {
    background: #151a1f !important;
    color: #f1f3f5 !important;
    border-color: #198754 !important;
}

/* Theme Toggle Button Style */
.theme-toggle {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
}

.theme-toggle:hover {
    background: rgba(255,255,255,0.18);
    transform: rotate(15deg);
}
</style>

</head>

<body>

<div class="container py-5">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Fund Wallet</h2>
    <!-- THEME TOGGLE -->
    <button
        type="button"
        id="themeToggle"
        class="theme-toggle"
        aria-label="Toggle dark mode"
        title="Toggle dark mode"
    >
        <i
            id="themeIcon"
            class="bi bi-moon-stars-fill"
        ></i>
    </button>
</div>

<!-- Fund Wallet Card -->
<div class="card p-4 shadow mb-4">

<div class="mb-3">

<label class="form-label">
Amount (₦)
</label>

<input
type="number"
id="amount"
class="form-control"
placeholder="Enter amount">

</div>

<button
id="payButton"
class="btn btn-success">

Fund Wallet

</button>

<div
id="message"
class="mt-3 text-danger">

</div>

</div>


<!-- Voucher Redemption Card -->
<div class="card p-4 shadow">

<h5 class="mb-3">
<i class="bi bi-ticket-perforated"></i> Redeem Voucher
</h5>

<div class="mb-3">

<label for="voucherCodeInput" class="form-label">
Voucher Code
</label>

<input
type="text"
id="voucherCodeInput"
class="form-control"
placeholder="Enter voucher code (e.g. SKLVL22)">

</div>

<button
id="redeemVoucherBtn"
class="btn btn-primary w-100">

Redeem Voucher

</button>

</div>

</div>

<script src="https://korablobstorage.blob.core.windows.net/modal-bucket/korapay-collections.min.js"></script>

<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js"
    }
}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, onAuthStateChanged } from "firebase/auth";
import { getDatabase, ref, get, update, push, set } from "firebase/database";

const firebaseConfig = {
    apiKey: "AIzaSyADhpdfM0GaMJIkeQw7Q6eBK3u9CaWUC9k",
    authDomain: "hkdmservices-7d59f.firebaseapp.com",
    databaseURL: "https://hkdmservices-7d59f-default-rtdb.firebaseio.com",
    projectId: "hkdmservices-7d59f",
    storageBucket: "hkdmservices-7d59f.firebasestorage.app",
    messagingSenderId: "839538334772",
    appId: "1:839538334772:web:7d8785f87363b6e5d8fe61"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);

const amountInput = document.getElementById("amount");
const payButton = document.getElementById("payButton");
const redeemBtn = document.getElementById("redeemVoucherBtn");
const voucherInput = document.getElementById("voucherCodeInput");
const messageDiv = document.getElementById("message");

let currentUser = null;
let currentUid = null;

onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }
    currentUser = user;
    currentUid = user.uid;
    console.log("✅ Wallet page loaded. User:", currentUid);
});

// ============================================================
// FUND WALLET - Token in body with number
// ============================================================
payButton.addEventListener("click", async () => {
    const amount = Number(amountInput.value);

    if (!amount || amount < 100) {
        messageDiv.textContent = "❌ Please enter a valid amount (minimum ₦100).";
        messageDiv.style.color = "red";
        return;
    }

    if (!currentUid || !currentUser) {
        messageDiv.textContent = "❌ Please log in again.";
        messageDiv.style.color = "red";
        return;
    }

    try {
        messageDiv.textContent = "⏳ Initializing payment...";
        messageDiv.style.color = "blue";

        const token = await currentUser.getIdToken(true);

        const data = {
            amount: amount,
            uid: currentUid,
            name: currentUser.displayName || "HKDM Customer",
            email: currentUser.email,
            token: token
        };

        const response = await fetch("https://hkdmservices.xyz/api-php/create-payment.php", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        // Handle both Korapay response formats
        if (result.checkout_url) {
            messageDiv.textContent = "✅ Redirecting to payment...";
            messageDiv.style.color = "green";
            window.location.href = result.checkout_url;
        } else {
            throw new Error(result.message || "Payment initialization failed.");
        }

    } catch (error) {
        console.error("Payment error:", error);
        messageDiv.textContent = "❌ " + error.message;
        messageDiv.style.color = "red";
    }
});

// ============================================================
// REDEEM VOUCHER
// ============================================================
redeemBtn.addEventListener("click", async () => {
    const code = voucherInput.value.trim().toUpperCase();

    if (!code) {
        messageDiv.textContent = "❌ Please enter a voucher code.";
        messageDiv.style.color = "red";
        return;
    }

    if (!currentUid) {
        messageDiv.textContent = "❌ Please log in again.";
        messageDiv.style.color = "red";
        return;
    }

    try {
        messageDiv.textContent = "⏳ Verifying voucher...";
        messageDiv.style.color = "blue";

        const vouchersRef = ref(database, "vouchers");
        const snapshot = await get(vouchersRef);
        const vouchers = snapshot.val();

        let found = false;
        let voucherKey = null;
        let voucherData = null;

        if (vouchers) {
            for (const [key, v] of Object.entries(vouchers)) {
                if (v.code === code && v.status === "active") {
                    found = true;
                    voucherKey = key;
                    voucherData = v;
                    break;
                }
            }
        }

        if (!found) {
            throw new Error("Voucher not found or already used.");
        }

        await update(ref(database, "vouchers/" + voucherKey), {
            status: "used",
            usedBy: currentUid,
            usedAt: Date.now()
        });

        const userRef = ref(database, "users/" + currentUid);
        const userSnapshot = await get(userRef);
        const userData = userSnapshot.val() || {};
        const currentBalance = userData.wallet || 0;
        const newBalance = currentBalance + voucherData.amount;

        await update(userRef, {
            wallet: newBalance
        });

        const transactionRef = push(ref(database, "transactions"));
        await set(transactionRef, {
            uid: currentUid,
            type: "voucher",
            amount: voucherData.amount,
            description: "Voucher redemption: " + code,
            status: "success",
            createdAt: Date.now()
        });

        messageDiv.textContent = "✅ Voucher redeemed! ₦" + voucherData.amount + " added to your wallet.";
        messageDiv.style.color = "green";
        voucherInput.value = "";

    } catch (error) {
        console.error("Voucher redemption error:", error);
        messageDiv.textContent = "❌ " + error.message;
        messageDiv.style.color = "red";
    }
});

console.log("✅ Wallet page loaded with Firebase!");
</script>

</body>
</html>
