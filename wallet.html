<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fund Wallet - HKDMServices</title>

<!-- =====================================================
     GLOBAL THEME SCRIPT
===================================================== -->
<script src="theme.js"></script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

<link href="style.css" rel="stylesheet">

<style>
/* =====================================================
   DARK MODE OVERRIDES
===================================================== */
html[data-theme="dark"] body {
    background: #101418;
    color: #f1f3f5;
}

html[data-theme="dark"] .card {
    background: #181d22 !important;
    border-color: #30363d !important;
    color: #f1f3f5 !important;
}

html[data-theme="dark"] .form-control {
    background: #151a1f !important;
    border-color: #30363d !important;
    color: #f1f3f5 !important;
}

html[data-theme="dark"] .form-control:focus {
    background: #151a1f !important;
    color: #f1f3f5 !important;
    border-color: #198754 !important;
}

html[data-theme="dark"] .text-muted {
    color: #adb5bd !important;
}

/* =====================================================
   BACK BUTTON - WORKS IN BOTH MODES
===================================================== */
.back-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid #dee2e6;
    background: #ffffff;
    color: #212529;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
}
.back-btn:hover {
    background: #e9ecef;
    transform: rotate(-15deg);
    color: #212529;
}
html[data-theme="dark"] .back-btn {
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: #fff;
}
html[data-theme="dark"] .back-btn:hover {
    background: rgba(255,255,255,0.18);
    color: #fff;
}
</style>

</head>

<body>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center gap-3">
            <!-- BACK TO DASHBOARD BUTTON -->
            <a href="dashboard.html" class="back-btn" title="Back to Dashboard">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h2 class="mb-0">Fund Wallet</h2>
        </div>
        <!-- NO THEME TOGGLE — controlled from dashboard -->
    </div>

    <!-- Fund Wallet Card -->
    <div class="card p-4 shadow mb-4">

        <div class="mb-3">
            <label class="form-label" for="amount">
                Amount (₦)
            </label>

            <input
            type="text"
            inputmode="numeric"
            id="amount"
            class="form-control"
            placeholder="Enter amount (min 100)"
            value="100">
        </div>

        <button
            type="button"
            id="payButton"
            class="btn btn-success w-100">
            Fund Wallet
        </button>

        <div
            id="message"
            class="mt-3 text-danger">
        </div>

    </div>


    <!-- Voucher Redemption Card -->
    <div class="card p-4 shadow">

        <h5 class="mb-3">
            <i class="bi bi-ticket-perforated"></i> Redeem Voucher
        </h5>

        <div class="mb-3">

            <label for="voucherCodeInput" class="form-label">
                Voucher Code
            </label>

            <input
            type="text"
            id="voucherCodeInput"
            class="form-control"
            placeholder="Enter voucher code (e.g. SKLVL22)">

        </div>

        <button
            type="button"
            id="redeemVoucherBtn"
            class="btn btn-primary w-100">

            Redeem Voucher

        </button>

    </div>

</div>
