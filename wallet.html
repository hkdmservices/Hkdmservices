<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fund Wallet - HKDMServices</title>

<!-- =====================================================
     GLOBAL THEME SCRIPT
===================================================== -->
<script src="theme.js"></script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

<link href="style.css" rel="stylesheet">

<style>
/* =====================================================
   DARK MODE OVERRIDES
===================================================== -->
html[data-theme="dark"] body {
    background: #101418;
    color: #f1f3f5;
}

html[data-theme="dark"] .card {
    background: #181d22 !important;
    border-color: #30363d !important;
    color: #f1f3f5 !important;
}

html[data-theme="dark"] .form-control {
    background: #151a1f !important;
    border-color: #30363d !important;
    color: #f1f3f5 !important;
}

html[data-theme="dark"] .form-control:focus {
    background: #151a1f !important;
    color: #f1f3f5 !important;
    border-color: #198754 !important;
}

/* Theme Toggle Button Style */
.theme-toggle {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
}

.theme-toggle:hover {
    background: rgba(255,255,255,0.18);
    transform: rotate(15deg);
}
</style>

</head>

<body>

<div class="container py-5">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Fund Wallet</h2>
    <!-- THEME TOGGLE -->
    <button
        type="button"
        id="themeToggle"
        class="theme-toggle"
        aria-label="Toggle dark mode"
        title="Toggle dark mode"
    >
        <i
            id="themeIcon"
            class="bi bi-moon-stars-fill"
        ></i>
    </button>
</div>

<!-- Fund Wallet Card -->
<div class="card p-4 shadow mb-4">

<div class="mb-3">

<label class="form-label">
Amount (₦)
</label>

<input
type="number"
id="amount"
class="form-control"
placeholder="Enter amount">

</div>

<button
id="payButton"
class="btn btn-success">

Fund Wallet

</button>

<div
id="message"
class="mt-3 text-danger">

</div>

</div>


<!-- Voucher Redemption Card -->
<div class="card p-4 shadow">

<h5 class="mb-3">
<i class="bi bi-ticket-perforated"></i> Redeem Voucher
</h5>

<div class="mb-3">

<label for="voucherCodeInput" class="form-label">
Voucher Code
</label>

<input
type="text"
id="voucherCodeInput"
class="form-control"
placeholder="Enter voucher code (e.g. SKLVL22)">

</div>

<button
id="redeemVoucherBtn"
class="btn btn-primary w-100">

Redeem Voucher

</button>

</div>

</div>

<script src="https://korablobstorage.blob.core.windows.net/modal-bucket/korapay-collections.min.js"></script>
<script type="module" src="wallet.js"></script>

</body>

</html>
