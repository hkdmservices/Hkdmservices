<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | HKDMServices</title>

<!-- =====================================================
     GLOBAL THEME SCRIPT
===================================================== -->
<script src="theme.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>
/* =====================================================
   DARK MODE OVERRIDES
===================================================== -->
html[data-theme="dark"] body.auth-body {
    background: #101418 !important;
}

html[data-theme="dark"] .auth-card {
    background: #181d22 !important;
    border-color: #30363d !important;
    color: #f1f3f5 !important;
}

html[data-theme="dark"] .auth-card .text-light {
    color: #99a1ab !important;
}

html[data-theme="dark"] .form-control {
    background-color: #151a1f !important;
    border-color: #30363d !important;
    color: #f1f3f5 !important;
}

html[data-theme="dark"] .form-control:focus {
    background-color: #151a1f !important;
    color: #f1f3f5 !important;
    border-color: #198754 !important;
}

/* Theme Toggle Button Style for Auth Pages */
.auth-theme-toggle-wrap {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 10;
}

.theme-toggle {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
}

.theme-toggle:hover {
    background: rgba(255,255,255,0.18);
    transform: rotate(15deg);
}
</style>

</head>

<body class="auth-body">

<!-- THEME TOGGLE BUTTON -->
<div class="auth-theme-toggle-wrap">
    <button
        type="button"
        id="themeToggle"
        class="theme-toggle"
        aria-label="Toggle dark mode"
        title="Toggle dark mode"
    >
        <i
            id="themeIcon"
            class="bi bi-moon-stars-fill"
        ></i>
    </button>
</div>

<div class="container">

<div class="row justify-content-center align-items-center min-vh-100">

<div class="col-lg-5 col-md-7">

<div class="auth-card">

<div class="text-center mb-4">

<h2 class="fw-bold text-success">

HKDMServices

</h2>

<p class="text-light">

Create your account

</p>

</div>

<form id="registerForm">

<div class="mb-3">

<label class="form-label text-light">

Full Name

</label>

<input
type="text"
class="form-control"
id="fullName"
placeholder="Enter your full name"
required>

</div>

<div class="mb-3">

<label class="form-label text-light">

Email Address

</label>

<input
type="email"
class="form-control"
id="email"
placeholder="Enter your email"
required>

</div>
<div class="mb-3">

<label class="form-label text-light">

Password

</label>

<input
type="password"
class="form-control"
id="password"
placeholder="Create a password"
required>

</div>


<div class="mb-4">

<label class="form-label text-light">

Confirm Password

</label>

<input
type="password"
class="form-control"
id="confirmPassword"
placeholder="Confirm your password"
required>

</div>


<div class="d-grid">

<button
type="submit"
class="btn btn-success btn-lg">

Create Free Account

</button>

</div>

</form>


<div class="text-center mt-4">

<p class="text-light mb-0">

Already have an account?

<a
href="login.html"
class="text-success text-decoration-none fw-bold">

Login Here

</a>

</p>

</div>
<div
id="message"
class="alert alert-danger mt-3 d-none">
</div>

</div>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="register.js"></script>

</body>

</html>
