<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | HKDMServices</title>

    <script src="theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        /* =====================================================
           DARK MODE OVERRIDES
        ===================================================== */
        html[data-theme="dark"] body.auth-body { background: #101418 !important; }
        html[data-theme="dark"] .auth-card { background: #181d22 !important; border-color: #30363d !important; color: #f1f3f5 !important; }
        html[data-theme="dark"] .auth-card .text-light { color: #adb5bd !important; }
        html[data-theme="dark"] .auth-card .text-muted { color: #adb5bd !important; }
        html[data-theme="dark"] .form-control { background-color: #151a1f !important; border-color: #30363d !important; color: #f1f3f5 !important; }
        html[data-theme="dark"] .form-control:focus { background-color: #151a1f !important; color: #f1f3f5 !important; border-color: #198754 !important; }
        html[data-theme="dark"] .form-control::placeholder { color: #8b949e !important; }
        html[data-theme="dark"] .btn-google-outline { background-color: #151a1f !important; color: #f1f3f5 !important; border-color: #30363d !important; }
        html[data-theme="dark"] .btn-google-outline:hover { background-color: #21262d !important; border-color: #8b949e !important; }
        html[data-theme="dark"] .bg-body { background-color: #181d22 !important; color: #adb5bd !important; }
        html[data-theme="dark"] hr { border-color: #30363d !important; }

        /* Alert visibility in dark mode */
        html[data-theme="dark"] .alert-danger {
            background: #2d0f14;
            color: #f8a5a5;
            border-color: #dc3545;
        }
        html[data-theme="dark"] .alert-success {
            background: #0d2818;
            color: #7ee8a2;
            border-color: #198754;
        }
        html[data-theme="dark"] .alert-info {
            background: #0d1a2d;
            color: #8ab8f5;
            border-color: #0d6efd;
        }

        .btn-google-outline { border: 1px solid #ced4da; color: #212529; font-weight: 500; }
        .btn-google-outline:hover { background: #f8f9fa; }
    </style>
</head>

<body class="auth-body">

    <!-- NO THEME TOGGLE — controlled from dashboard -->

    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-lg-5 col-md-7">
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-success">HKDMServices</h2>
                        <p class="text-light">Create your account</p>
                    </div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label text-light">Full Name</label>
                            <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-light">Email Address</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-light">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Create a password" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-light">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">Create Free Account</button>
                        </div>
                    </form>

                    <div class="position-relative my-4">
                        <hr class="text-muted">
                        <div class="position-absolute top-50 start-50 translate-middle px-2 bg-body text-muted small">OR</div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="button" id="googleRegisterBtn" class="btn btn-google-outline btn-lg d-flex align-items-center justify-content-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
                                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                            </svg>
                            Sign up with Google
                        </button>
                    </div>

                    <div class="text-center mt-4">
                        <p class="text-light mb-0">Already have an account? <a href="login.html" class="text-success text-decoration-none fw-bold">Login Here</a></p>
                    </div>
                    <div id="message" class="alert mt-3 d-none"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ============================================================
    FIREBASE AUTH
    ============================================================ -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, createUserWithEmailAndPassword, updateProfile, signInWithPopup, GoogleAuthProvider } from "firebase/auth";
        import { getDatabase, ref, set, get } from "firebase/database";

        const firebaseConfig = {
            apiKey: "AIzaSyADhpdfM0GaMJIkeQw7Q6eBK3u9CaWUC9k",
            authDomain: "hkdmservices-7d59f.firebaseapp.com",
            databaseURL: "https://hkdmservices-7d59f-default-rtdb.firebaseio.com",
            projectId: "hkdmservices-7d59f",
            storageBucket: "hkdmservices-7d59f.firebasestorage.app",
            messagingSenderId: "839538334772",
            appId: "1:839538334772:web:7d8785f87363b6e5d8fe61"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const googleBtn = document.getElementById("googleRegisterBtn");

        console.log("✅ Register page loaded!");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const fullName = document.getElementById("fullName").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirm = document.getElementById("confirmPassword").value;

            message.classList.add("d-none");

            if (password !== confirm) {
                message.textContent = "Passwords do not match.";
                message.classList.remove("d-none");
                return;
            }

            if (!fullName || !email || !password) {
                message.textContent = "Please fill out all fields.";
                message.classList.remove("d-none");
                return;
            }

            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCred.user;

                await updateProfile(user, { displayName: fullName });

                await set(ref(database, "users/" + user.uid), {
                    fullName: fullName,
                    email: email,
                    wallet: 0,
                    role: "customer",
                    status: "active",
                    createdAt: Date.now()
                });

                try {
                    const response = await fetch('https://hkdmservices.xyz/api-php/send-verification.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: email,
                            uid: user.uid
                        })
                    });
                    const result = await response.json();
                    console.log('Verification email:', result);
                } catch (emailError) {
                    console.error('Email error:', emailError);
                }

                message.className = "alert alert-success mt-3";
                message.textContent = "✅ Account created! A verification email has been sent to your email address.";
                message.classList.remove("d-none");

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 3000);

            } catch (error) {
                message.textContent = "❌ " + error.message;
                message.classList.remove("d-none");
                console.error(error);
            }
        });

        if (googleBtn) {
            googleBtn.addEventListener("click", async () => {
                try {
                    const provider = new GoogleAuthProvider();
                    const result = await signInWithPopup(auth, provider);
                    const user = result.user;

                    const userRef = ref(database, "users/" + user.uid);
                    const snap = await get(userRef);

                    if (!snap.exists()) {
                        await set(userRef, {
                            fullName: user.displayName || "Google User",
                            email: user.email,
                            wallet: 0,
                            role: "customer",
                            status: "active",
                            createdAt: Date.now()
                        });
                    }

                    message.className = "alert alert-success mt-3";
                    message.textContent = "✅ Google sign-up successful!";
                    message.classList.remove("d-none");

                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 2000);

                } catch (error) {
                    message.textContent = "❌ " + error.message;
                    message.classList.remove("d-none");
                    console.error(error);
                }
            });
        }
    </script>
</body>
</html>
