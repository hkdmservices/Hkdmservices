<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | HKDMServices</title>

    <!-- =====================================================
         GLOBAL THEME SCRIPT
    ===================================================== -->
    <script src="theme.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        /* =====================================================
           DARK MODE OVERRIDES
        ===================================================== */
        html[data-theme="dark"] body.auth-body {
            background: #101418 !important;
        }

        html[data-theme="dark"] .auth-card {
            background: #181d22 !important;
            border-color: #30363d !important;
            color: #f1f3f5 !important;
        }

        html[data-theme="dark"] .auth-card .text-light {
            color: #99a1ab !important;
        }

        html[data-theme="dark"] .form-control {
            background-color: #151a1f !important;
            border-color: #30363d !important;
            color: #f1f3f5 !important;
        }

        html[data-theme="dark"] .form-control:focus {
            background-color: #151a1f !important;
            color: #f1f3f5 !important;
            border-color: #198754 !important;
        }

        html[data-theme="dark"] .btn-google-outline {
            background-color: #151a1f !important;
            color: #f1f3f5 !important;
            border-color: #30363d !important;
        }

        html[data-theme="dark"] .btn-google-outline:hover {
            background-color: #21262d !important;
            border-color: #8b949e !important;
        }

        .auth-theme-toggle-wrap {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }

        .theme-toggle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: rotate(15deg);
        }

        .btn-google-outline {
            border: 1px solid #ced4da;
            color: #212529;
            font-weight: 500;
        }
    </style>
</head>

<body class="auth-body">

    <!-- =====================================================
         INLINE TEST SCRIPT – Confirm HTML loads
    ===================================================== -->
    <script>
        alert("✅ HTML is loading!");
        console.log("✅ HTML is loading!");
    </script>

    <!-- THEME TOGGLE BUTTON -->
    <div class="auth-theme-toggle-wrap">
        <button type="button" id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
            <i id="themeIcon" class="bi bi-moon-stars-fill"></i>
        </button>
    </div>

    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-lg-5 col-md-7">

                <div class="auth-card">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-success">HKDMServices</h2>
                        <p class="text-light">Create your account</p>
                    </div>

                    <!-- =============================================
                         REGISTRATION FORM
                    ============================================= -->
                    <form id="registerForm">

                        <div class="mb-3">
                            <label class="form-label text-light">Full Name</label>
                            <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light">Email Address</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Create a password" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-light">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">Create Free Account</button>
                        </div>

                    </form>

                    <!-- =============================================
                         DIVIDER
                    ============================================= -->
                    <div class="position-relative my-4">
                        <hr class="text-muted">
                        <div class="position-absolute top-50 start-50 translate-middle px-2 bg-body text-muted small">
                            OR
                        </div>
                    </div>

                    <!-- =============================================
                         GOOGLE SIGN-UP
                    ============================================= -->
                    <div class="d-grid mb-3">
                        <button type="button" id="googleRegisterBtn" class="btn btn-google-outline btn-lg d-flex align-items-center justify-content-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
                                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                            </svg>
                            Sign up with Google
                        </button>
                    </div>

                    <!-- =============================================
                         LOGIN LINK
                    ============================================= -->
                    <div class="text-center mt-4">
                        <p class="text-light mb-0">
                            Already have an account?
                            <a href="login.html" class="text-success text-decoration-none fw-bold">Login Here</a>
                        </p>
                    </div>

                    <!-- =============================================
                         MESSAGE DISPLAY
                    ============================================= -->
                    <div id="message" class="alert alert-danger mt-3 d-none"></div>

                </div>
            </div>
        </div>
    </div>

    <!-- =====================================================
         BOOTSTRAP
    ===================================================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- =====================================================
         REGISTER.JS AS ES MODULE
    ===================================================== -->
    <script type="module" src="register.js"></script>

</body>

</html>
