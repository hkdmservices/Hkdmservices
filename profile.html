<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>User Profile | HKDMservices</title>


<!-- =====================================================
     GLOBAL THEME SCRIPT
===================================================== -->
<script src="theme.js"></script>


<!-- =====================================================
     BOOTSTRAP
===================================================== -->

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">


<!-- =====================================================
     BOOTSTRAP ICONS
===================================================== -->

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
rel="stylesheet">


<!-- =====================================================
     HKDMservices CSS
===================================================== -->

<link
href="style.css"
rel="stylesheet">

<style>
/* =====================================================
   DARK MODE OVERRIDES
===================================================== -->
html[data-theme="dark"] body {
    background: #101418;
    color: #f1f3f5;
}

html[data-theme="dark"] .card {
    background: #181d22 !important;
    border-color: #30363d !important;
    color: #f1f3f5 !important;
}

html[data-theme="dark"] .form-control {
    background-color: #151a1f !important;
    border-color: #30363d !important;
    color: #f1f3f5 !important;
}

html[data-theme="dark"] .text-muted {
    color: #99a1ab !important;
}

/* Theme Toggle Button Style */
.theme-toggle {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
}

.theme-toggle:hover {
    background: rgba(255,255,255,0.18);
    transform: rotate(15deg);
}
</style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar navbar-dark bg-dark">

<div class="container d-flex justify-content-between align-items-center">


    <a
        class="navbar-brand fw-bold"
        href="dashboard.html"
    >

        <span class="brand-icon">⬢</span>

        HKDMservices

    </a>


    <div class="d-flex align-items-center gap-2">
        <!-- THEME TOGGLE -->
        <button
            type="button"
            id="themeToggle"
            class="theme-toggle"
            aria-label="Toggle dark mode"
            title="Toggle dark mode"
        >
            <i
                id="themeIcon"
                class="bi bi-moon-stars-fill"
            ></i>
        </button>

        <a
            href="dashboard.html"
            class="btn btn-outline-light btn-sm"
        >

            <i class="bi bi-arrow-left"></i>

            Dashboard

        </a>
    </div>


</div>

</nav>



<!-- =====================================================
     PROFILE PAGE
===================================================== -->

<section class="py-5">

<div class="container">


    <!-- =================================================
         PAGE TITLE
    ================================================= -->

    <div class="text-center mb-5">

        <i
            class="bi bi-person-circle text-success"
            style="font-size: 70px;"
        ></i>

        <h1 class="mt-3">

            User Profile

        </h1>

        <p class="text-muted">

            Manage and view your HKDMservices account

        </p>

    </div>



    <!-- =================================================
         PROFILE CARD
    ================================================= -->

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow border-0">

                <div class="card-body p-4 p-md-5">


                    <!-- =================================================
                         PROFILE UPDATE FORM
                    ================================================= -->

                    <form id="profileForm">

                        <!-- FULL NAME -->
                        <div class="mb-4">

                            <label
                                class="form-label text-muted"
                                for="profileNameInput"
                            >

                                Full Name

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="profileNameInput"
                                placeholder="Loading..."
                                required
                            >

                        </div>



                        <!-- EMAIL -->
                        <div class="mb-4">

                            <label
                                class="form-label text-muted"
                            >

                                Email Address

                            </label>


                            <div
                                class="form-control bg-light"
                                id="profileEmail"
                            >

                                Loading...

                            </div>

                        </div>



                        <!-- EMAIL VERIFICATION -->
                        <div class="mb-4">

                            <label
                                class="form-label text-muted"
                            >

                                Email Verification

                            </label>


                            <div
                                id="emailVerification"
                                class="mb-2"
                            >

                                Loading...

                            </div>

                            <button
                                id="verifyEmailBtn"
                                type="button"
                                class="btn btn-sm btn-outline-success d-none"
                            >
                                <i class="bi bi-envelope-check"></i> Send Verification Link
                            </button>

                        </div>



                        <!-- WALLET BALANCE -->
                        <div class="mb-4">

                            <label
                                class="form-label text-muted"
                            >

                                Wallet Balance

                            </label>


                            <div
                                class="form-control bg-light fw-bold text-success"
                                id="profileWallet"
                            >

                                ₦0.00

                            </div>

                        </div>



                        <!-- TOTAL ORDERS -->
                        <div class="mb-4">

                            <label
                                class="form-label text-muted"
                            >

                                Total Orders

                            </label>


                            <div
                                class="form-control bg-light fw-bold"
                                id="profileOrders"
                            >

                                0

                            </div>

                        </div>



                        <!-- ACCOUNT STATUS -->
                        <div class="mb-4">

                            <label
                                class="form-label text-muted"
                            >

                                Account Status

                            </label>


                            <div
                                id="accountStatus"
                            >

                                <span
                                    class="badge bg-success"
                                >

                                    Active

                                </span>

                            </div>

                        </div>



                        <!-- USER ID -->
                        <div class="mb-4">

                            <label
                                class="form-label text-muted"
                            >

                                Account ID

                            </label>


                            <div
                                class="form-control bg-light small text-break"
                                id="profileUid"
                            >

                                Loading...

                            </div>

                        </div>



                        <!-- UPDATE SUBMIT BUTTON -->
                        <div class="d-grid mb-3">
                            <button
                                type="submit"
                                id="saveProfileBtn"
                                class="btn btn-success"
                            >
                                <i class="bi bi-check-circle"></i> Update Profile
                            </button>
                        </div>

                    </form>


                    <!-- =================================================
                         SECURITY / PASSWORD RESET
                    ================================================= -->
                    <div class="border-top pt-4 mt-4">
                        <h6 class="fw-bold mb-2">Security</h6>
                        <p class="text-muted small mb-3">Need to change your password? We will send a secure password reset link to your email.</p>
                        <div class="d-grid">
                            <button
                                id="resetPasswordBtn"
                                type="button"
                                class="btn btn-outline-warning"
                            >
                                <i class="bi bi-key"></i> Send Password Reset Email
                            </button>
                        </div>
                    </div>



                    <!-- =================================================
                         ACTIONS
                    ================================================= -->

                    <div
                        class="d-grid gap-2 mt-4 pt-3 border-top"
                    >


                        <a
                            href="dashboard.html"
                            class="btn btn-secondary"
                        >

                            <i class="bi bi-speedometer2"></i>

                            Back to Dashboard

                        </a>


                        <button
                            id="logout"
                            type="button"
                            class="btn btn-outline-danger"
                        >

                            <i
                                class="bi bi-box-arrow-right"
                            ></i>

                            Logout

                        </button>


                    </div>


                    <!-- MESSAGE ALERT CONTAINER -->
                    <div
                        id="profileMessage"
                        class="alert mt-3 d-none"
                    ></div>


                </div>

            </div>

        </div>

    </div>


</div>

</section>



<!-- =====================================================
     PROFILE JAVASCRIPT
===================================================== -->

<script
    type="module"
    src="profile.js"
></script>


</body>

</html>
