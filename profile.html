<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Profile | HKDMservices</title>


<!-- =====================================================

===================================================== -->

<!-- =====================================================
     BOOTSTRAP
===================================================== -->

<!-- =====================================================
     BOOTSTRAP ICONS
===================================================== -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">


<!-- =====================================================
     HKDMservices CSS
===================================================== -->

<link href="style.css" rel="stylesheet">

<style>

    color: #f1f3f5 !important;

    border-color: #30363d !important;

    color: #f1f3f5;

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<nav class="navbar navbar-dark bg-dark">

<div class="container d-flex justify-content-between align-items-center">

    <a class="navbar-brand fw-bold" href="dashboard.html">
        <span class="brand-icon">⬢</span>
        HKDMservices
    </a>

    <div class="d-flex align-items-center gap-2">
        <!-- NO THEME TOGGLE — controlled from dashboard -->

        <a href="dashboard.html" class="btn btn-outline-light btn-sm">
            <i class="bi bi-arrow-left"></i>
            Dashboard
        </a>
    </div>

</div>

</nav>



<!-- =====================================================
     PROFILE PAGE
===================================================== -->

<section class="py-5">

<div class="container">

    <!-- PAGE TITLE -->
    <div class="text-center mb-5">
        <i class="bi bi-person-circle text-success" style="font-size: 70px;"></i>
        <h1 class="mt-3">User Profile</h1>
        <p class="text-muted">Manage and view your HKDMservices account</p>
    </div>

    <!-- PROFILE CARD -->
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow border-0">
                <div class="card-body p-4 p-md-5">

                    <!-- PROFILE UPDATE FORM -->
                    <form id="profileForm">

                        <!-- FULL NAME -->
                        <div class="mb-4">
                            <label class="form-label text-muted" for="profileNameInput">Full Name</label>
                            <input type="text" class="form-control" id="profileNameInput" placeholder="Loading..." required>
                        </div>

                        <!-- EMAIL -->
                        <div class="mb-4">
                            <label class="form-label text-muted">Email Address</label>
                            <div class="form-control bg-light" id="profileEmail">Loading...</div>
                        </div>

                        <!-- EMAIL VERIFICATION -->
                        <div class="mb-4">
                            <label class="form-label text-muted">Email Verification</label>
                            <div id="emailVerification" class="mb-2">Loading...</div>
                            <button id="verifyEmailBtn" type="button" class="btn btn-sm btn-outline-success d-none">
                                <i class="bi bi-envelope-check"></i> Send Verification Link
                            </button>
                        </div>

                        <!-- WALLET BALANCE -->
                        <div class="mb-4">
                            <label class="form-label text-muted">Wallet Balance</label>
                            <div class="form-control bg-light fw-bold text-success" id="profileWallet">₦0.00</div>
                        </div>

                        <!-- TOTAL ORDERS -->
                        <div class="mb-4">
                            <label class="form-label text-muted">Total Orders</label>
                            <div class="form-control bg-light fw-bold" id="profileOrders">0</div>
                        </div>

                        <!-- ACCOUNT STATUS -->
                        <div class="mb-4">
                            <label class="form-label text-muted">Account Status</label>
                            <div id="accountStatus">
                                <span class="badge bg-success">Active</span>
                            </div>
                        </div>

                        <!-- USER ID -->
                        <div class="mb-4">
                            <label class="form-label text-muted">Account ID</label>
                            <div class="form-control bg-light small text-break" id="profileUid">Loading...</div>
                        </div>

                        <!-- UPDATE SUBMIT BUTTON -->
                        <div class="d-grid mb-3">
                            <button type="submit" id="saveProfileBtn" class="btn btn-success">
                                <i class="bi bi-check-circle"></i> Update Profile
                            </button>
                        </div>

                    </form>

                    <!-- SECURITY / PASSWORD RESET -->
                    <div class="border-top pt-4 mt-4">
                        <h6 class="fw-bold mb-2">Security</h6>
                        <p class="text-muted small mb-3">Need to change your password? We will send a secure password reset link to your email.</p>
                        <div class="d-grid">
                            <button id="resetPasswordBtn" type="button" class="btn btn-outline-warning">
                                <i class="bi bi-key"></i> Send Password Reset Email
                            </button>
                        </div>
                    </div>

                    <!-- ACTIONS -->
                    <div class="d-grid gap-2 mt-4 pt-3 border-top">
                        <a href="dashboard.html" class="btn btn-secondary">
                            <i class="bi bi-speedometer2"></i> Back to Dashboard
                        </a>
                        <button id="logout" type="button" class="btn btn-outline-danger">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </button>
                    </div>

                    <!-- MESSAGE ALERT CONTAINER -->
                    <div id="profileMessage" class="alert mt-3 d-none"></div>

                </div>
            </div>
        </div>
    </div>

</div>

</section>



<!-- =====================================================
     FIREBASE LOGIC
===================================================== -->
<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js"
    }
}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, onAuthStateChanged, updateProfile, sendPasswordResetEmail, sendEmailVerification, signOut } from "firebase/auth";
import { getDatabase, ref, onValue, update } from "firebase/database";

const firebaseConfig = {
    apiKey: "AIzaSyADhpdfM0GaMJIkeQw7Q6eBK3u9CaWUC9k",
    authDomain: "hkdmservices-7d59f.firebaseapp.com",
    databaseURL: "https://hkdmservices-7d59f-default-rtdb.firebaseio.com",
    projectId: "hkdmservices-7d59f",
    storageBucket: "hkdmservices-7d59f.firebasestorage.app",
    messagingSenderId: "839538334772",
    appId: "1:839538334772:web:7d8785f87363b6e5d8fe61"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);

const profileNameInput = document.getElementById("profileNameInput");
const profileEmail = document.getElementById("profileEmail");
const profileWallet = document.getElementById("profileWallet");
const profileOrders = document.getElementById("profileOrders");
const profileUid = document.getElementById("profileUid");
const emailVerification = document.getElementById("emailVerification");
const verifyEmailBtn = document.getElementById("verifyEmailBtn");
const resetPasswordBtn = document.getElementById("resetPasswordBtn");
const profileMessage = document.getElementById("profileMessage");
const logoutBtn = document.getElementById("logout");
const profileForm = document.getElementById("profileForm");

let currentUserData = null;
let currentUser = null;

onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    currentUser = user;
    const uid = user.uid;

    profileUid.textContent = uid;
    profileEmail.textContent = user.email || "No email";

    const userRef = ref(database, "users/" + uid);

    onValue(userRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            currentUserData = data;

            profileNameInput.value = data.fullName || user.displayName || "";
            profileWallet.textContent = "₦" + (data.wallet || 0).toLocaleString("en-NG", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

            const ordersRef = ref(database, "orders");
            onValue(ordersRef, (snap) => {
                const orders = snap.val();
                let count = 0;
                if (orders) {
                    Object.values(orders).forEach((order) => {
                        if (order.uid === uid) count++;
                    });
                }
                profileOrders.textContent = count;
            });

            if (user.emailVerified) {
                emailVerification.innerHTML = '<span class="badge bg-success"><i class="bi bi-check-circle"></i> Verified</span>';
                verifyEmailBtn.classList.add("d-none");
            } else {
                emailVerification.innerHTML = '<span class="badge bg-warning text-dark"><i class="bi bi-exclamation-triangle"></i> Not Verified</span>';
                verifyEmailBtn.classList.remove("d-none");
            }

            console.log("✅ Profile data loaded:", data);
        }
    });
});

profileForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const fullName = profileNameInput.value.trim();

    if (!fullName) {
        showMessage("Please enter your full name.", "danger");
        return;
    }

    try {
        if (currentUser) {
            await updateProfile(currentUser, { displayName: fullName });
        }

        if (currentUser) {
            await update(ref(database, "users/" + currentUser.uid), {
                fullName: fullName
            });
        }

        showMessage("✅ Profile updated successfully!", "success");
    } catch (error) {
        console.error("Profile update error:", error);
        showMessage("❌ Error updating profile: " + error.message, "danger");
    }
});

resetPasswordBtn.addEventListener("click", async () => {
    if (!currentUser || !currentUser.email) {
        showMessage("No email address found.", "danger");
        return;
    }

    try {
        await sendPasswordResetEmail(auth, currentUser.email);
        showMessage("✅ Password reset email sent! Check your inbox.", "success");
    } catch (error) {
        console.error("Password reset error:", error);
        showMessage("❌ Error: " + error.message, "danger");
    }
});

verifyEmailBtn.addEventListener("click", async () => {
    if (!currentUser) return;

    try {
        await sendEmailVerification(currentUser);
        showMessage("✅ Verification email sent! Check your inbox.", "success");
        verifyEmailBtn.classList.add("d-none");
    } catch (error) {
        console.error("Verification email error:", error);
        showMessage("❌ Error: " + error.message, "danger");
    }
});

logoutBtn.addEventListener("click", async () => {
    try {
        await signOut(auth);
        window.location.href = "login.html";
    } catch (error) {
        console.error("Logout error:", error);
        showMessage("❌ Logout failed: " + error.message, "danger");
    }
});

function showMessage(text, type) {
    profileMessage.textContent = text;
    profileMessage.className = "alert alert-" + type + " mt-3";
    profileMessage.classList.remove("d-none");
    setTimeout(() => {
        profileMessage.classList.add("d-none");
    }, 5000);
}

console.log("✅ Profile page loaded with Firebase!");
</script>

</body>

</html>
