<style>
/* =====================================================
   DARK MODE OVERRIDES
===================================================== */
html[data-theme="dark"] body {
    background: #101418;
    color: #f1f3f5;
}

html[data-theme="dark"] .card {
    background: #181d22 !important;
    border-color: #30363d !important;
    color: #f1f3f5 !important;
}

html[data-theme="dark"] .form-control {
    background-color: #151a1f !important;
    border-color: #30363d !important;
    color: #f1f3f5 !important;
}

html[data-theme="dark"] .text-muted {
    color: #99a1ab !important;
}

/* Theme Toggle Button Style */
.theme-toggle {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
}

.theme-toggle:hover {
    background: rgba(255,255,255,0.18);
    transform: rotate(15deg);
}
</style>

</head>


<body>

     NAVBAR
===================================================== -->

<nav class="navbar navbar-dark bg-dark">

<div class="container d-flex justify-content-between align-items-center">


    <a
        class="navbar-brand fw-bold"
        href="dashboard.html"

        <span class="brand-icon">⬢</span>

            type="button"

                id="themeIcon"

        </button>

        <a
            href="dashboard.html"

        >

            <i class="bi bi-arrow-left"></i>

            Dashboard

        </a>
    </div>


</div>

<!-- =====================================================
     PROFILE PAGE
===================================================== -->

<section class="py-5">

<div class="container">


    <!-- =================================================
         PAGE TITLE
    ================================================= -->

    <div class="text-center mb-5">

        <i
            class="bi bi-person-circle text-success"
            style="font-size: 70px;"
        ></i>

        <h1 class="mt-3">

            User Profile

        </h1>

        <p class="text-muted">

            Manage and view your HKDMservices account

        </p>

    </div>



    <!-- =================================================
         PROFILE CARD
    ================================================= -->

    <div class="row justify-content-center">

        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow border-0">

                <div class="card-body p-4 p-md-5">


                    <!-- =================================================
                         PROFILE UPDATE FORM
                    ================================================= -->

                    <form id="profileForm">

                        <!-- FULL NAME -->
                        <div class="mb-4">

                            <label
                                class="form-label text-muted"
                                for="profileNameInput"
                            >

                                Full Name

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="profileNameInput"
                                placeholder="Loading..."
                                required
                            >

                        </div>



                        <!-- EMAIL -->
                        <div class="mb-4">

                            <label
                                class="form-label text-muted"
                            >

                                Email Address

                            </label>


                            <div
                                class="form-control bg-light"
                                id="profileEmail"
                            >

                                Loading...

                            </div>

                        </div>



                        <!-- EMAIL VERIFICATION -->
                        <div class="mb-4">

                            <label
                                class="form-label text-muted"
                            >

                                Email Verification

                            </label>


                            <div
                                id="emailVerification"
                                class="mb-2"
                            >

                                Loading...

                            </div>

                            <button
                                id="verifyEmailBtn"
                                type="button"
                                class="btn btn-sm btn-outline-success d-none"
                            >
                                <i class="bi bi-envelope-check"></i> Send Verification Link
                            </button>

                        </div>



                        <!-- WALLET BALANCE -->
                        <div class="mb-4">

                            <label
                                class="form-label text-muted"
                            >

                                Wallet Balance

                            </label>


                            <div
                                class="form-control bg-light fw-bold text-success"
                                id="profileWallet"
                            >

                                ₦0.00

                            </div>

                        </div>



                        <!-- TOTAL ORDERS -->
                        <div class="mb-4">

                            <label
                                class="form-label text-muted"
                            >

                                Total Orders

                            </label>


                            <div
                                class="form-control bg-light fw-bold"
                                id="profileOrders"
                            >

                                0

                            </div>

                        </div>



                        <!-- ACCOUNT STATUS -->
                        <div class="mb-4">

                            <label
                                class="form-label text-muted"
                            >

                                Account Status

                            </label>


                            <div
                                id="accountStatus"
                            >

                                <span
                                    class="badge bg-success"
                                >

                                    Active

                                </span>

                            </div>

                        </div>



                        <!-- USER ID -->
                        <div class="mb-4">

                            <label
                                class="form-label text-muted"
                            >

                                Account ID

                            </label>


                            <div
                                class="form-control bg-light small text-break"
                                id="profileUid"
                            >

                                Loading...

                            </div>

                        </div>



                        <!-- UPDATE SUBMIT BUTTON -->
                        <div class="d-grid mb-3">
                            <button
                                type="submit"
                                id="saveProfileBtn"
                                class="btn btn-success"
                            >
                                <i class="bi bi-check-circle"></i> Update Profile

                    </form>


                    <!-- =================================================
                         SECURITY / PASSWORD RESET
                    ================================================= -->
                    <div class="border-top pt-4 mt-4">

                        <p class="text-muted small mb-3">Need to change your password? We will send a secure password reset link to your email.</p>
                        <div class="d-grid">
                            <button
                                id="resetPasswordBtn"

                        </div>
                    </div>



                    <!-- =================================================
                         ACTIONS
                    ================================================= -->

                            type="button"

                            <i
                                class="bi bi-box-arrow-right"
                            ></i>

                            Logout

                        </button>


                    </div>


                    <!-- MESSAGE ALERT CONTAINER -->
                    <div

                        class="alert mt-3 d-none"
                    ></div>


                </div>

            </div>

        </div>

    </div>

<!-- =====================================================
     FIREBASE LOGIC (Added – Your Design is Untouched)
===================================================== -->
<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js"
    }
}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, onAuthStateChanged, updateProfile, sendPasswordResetEmail, sendEmailVerification, signOut } from "firebase/auth";
import { getDatabase, ref, onValue, update } from "firebase/database";

// Firebase Config
const firebaseConfig = {
    apiKey: "AIzaSyADhpdfM0GaMJIkeQw7Q6eBK3u9CaWUC9k",
    authDomain: "hkdmservices-7d59f.firebaseapp.com",
    databaseURL: "https://hkdmservices-7d59f-default-rtdb.firebaseio.com",
    projectId: "hkdmservices-7d59f",
    storageBucket: "hkdmservices-7d59f.firebasestorage.app",
    messagingSenderId: "839538334772",
    appId: "1:839538334772:web:7d8785f87363b6e5d8fe61"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);

// DOM Elements
const profileNameInput = document.getElementById("profileNameInput");
const profileEmail = document.getElementById("profileEmail");
const profileWallet = document.getElementById("profileWallet");
const profileOrders = document.getElementById("profileOrders");
const profileUid = document.getElementById("profileUid");
const emailVerification = document.getElementById("emailVerification");
const verifyEmailBtn = document.getElementById("verifyEmailBtn");
const resetPasswordBtn = document.getElementById("resetPasswordBtn");
const profileMessage = document.getElementById("profileMessage");
const logoutBtn = document.getElementById("logout");
const profileForm = document.getElementById("profileForm");

let currentUserData = null;
let currentUser = null;

// ============================================================
// 1. CHECK AUTH STATE & LOAD USER DATA
// ============================================================
onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    currentUser = user;
    const uid = user.uid;

    // Display UID
    profileUid.textContent = uid;
    profileEmail.textContent = user.email || "No email";

    // Load user data from database
    const userRef = ref(database, "users/" + uid);

    onValue(userRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            currentUserData = data;

            // Update profile fields
            profileNameInput.value = data.fullName || user.displayName || "";
            profileWallet.textContent = "₦" + (data.wallet || 0).toLocaleString("en-NG", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

            // Count orders
            const ordersRef = ref(database, "orders");
            onValue(ordersRef, (snap) => {
                const orders = snap.val();
                let count = 0;
                if (orders) {
                    Object.values(orders).forEach((order) => {
                        if (order.uid === uid) count++;
                    });
                }
                profileOrders.textContent = count;
            });

            // Email verification status
            if (user.emailVerified) {
                emailVerification.innerHTML = '<span class="badge bg-success"><i class="bi bi-check-circle"></i> Verified</span>';
                verifyEmailBtn.classList.add("d-none");
            } else {
                emailVerification.innerHTML = '<span class="badge bg-warning text-dark"><i class="bi bi-exclamation-triangle"></i> Not Verified</span>';
                verifyEmailBtn.classList.remove("d-none");
            }

            console.log("✅ Profile data loaded:", data);
        }
    });
});

// ============================================================
// 2. UPDATE PROFILE
// ============================================================
profileForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const fullName = profileNameInput.value.trim();

    if (!fullName) {
        showMessage("Please enter your full name.", "danger");
        return;
    }

    try {
        // Update Firebase Auth profile
        if (currentUser) {
            await updateProfile(currentUser, { displayName: fullName });
        }

        // Update Realtime Database
        if (currentUser) {
            await update(ref(database, "users/" + currentUser.uid), {
                fullName: fullName
            });
        }

        showMessage("✅ Profile updated successfully!", "success");
    } catch (error) {
        console.error("Profile update error:", error);
        showMessage("❌ Error updating profile: " + error.message, "danger");
    }
});

// ============================================================
// 3. SEND PASSWORD RESET
// ============================================================
resetPasswordBtn.addEventListener("click", async () => {
    if (!currentUser || !currentUser.email) {
        showMessage("No email address found.", "danger");
        return;
    }

    try {
        await sendPasswordResetEmail(auth, currentUser.email);
        showMessage("✅ Password reset email sent! Check your inbox.", "success");
    } catch (error) {
        console.error("Password reset error:", error);
        showMessage("❌ Error: " + error.message, "danger");
    }
});

// ============================================================
// 4. SEND EMAIL VERIFICATION
// ============================================================
verifyEmailBtn.addEventListener("click", async () => {
    if (!currentUser) return;

    try {
        await sendEmailVerification(currentUser);
        showMessage("✅ Verification email sent! Check your inbox.", "success");
        verifyEmailBtn.classList.add("d-none");
    } catch (error) {
        console.error("Verification email error:", error);
        showMessage("❌ Error: " + error.message, "danger");
    }
});

// ============================================================
// 5. LOGOUT
// ============================================================
logoutBtn.addEventListener("click", async () => {
    try {
        await signOut(auth);
        window.location.href = "login.html";
    } catch (error) {
        console.error("Logout error:", error);
        showMessage("❌ Logout failed: " + error.message, "danger");
    }
});

// ============================================================
// 6. HELPER: SHOW MESSAGE
// ============================================================
function showMessage(text, type) {
    profileMessage.textContent = text;
    profileMessage.className = "alert alert-" + type + " mt-3";
    profileMessage.classList.remove("d-none");
    setTimeout(() => {
        profileMessage.classList.add("d-none");
    }, 5000);
}

console.log("✅ Profile page loaded with Firebase!");
</script>

</body>

</html>
