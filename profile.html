<script type="module">
import { initializeApp } from "firebase/app";
import {
    getAuth,
    onAuthStateChanged,
    updateProfile,
    sendPasswordResetEmail,
    sendEmailVerification,
    signOut,
    verifyBeforeUpdateEmail
} from "firebase/auth";
import { getDatabase, ref, onValue, update } from "firebase/database";

const firebaseConfig = {
    apiKey: "AIzaSyADhpdfM0GaMJIkeQw7Q6eBK3u9CaWUC9k",
    authDomain: "hkdmservices-7d59f.firebaseapp.com",
    databaseURL: "https://hkdmservices-7d59f-default-rtdb.firebaseio.com",
    projectId: "hkdmservices-7d59f",
    storageBucket: "hkdmservices-7d59f.firebasestorage.app",
    messagingSenderId: "839538334772",
    appId: "1:839538334772:web:7d8785f87363b6e5d8fe61"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);

// DOM Elements
const profileNameInput = document.getElementById("profileNameInput");
const profileEmail = document.getElementById("profileEmail");
const profileWallet = document.getElementById("profileWallet");
const profileOrders = document.getElementById("profileOrders");
const profileUid = document.getElementById("profileUid");
const emailVerification = document.getElementById("emailVerification");
const verifyEmailBtn = document.getElementById("verifyEmailBtn");
const resetPasswordBtn = document.getElementById("resetPasswordBtn");
const profileMessage = document.getElementById("profileMessage");
const logoutBtn = document.getElementById("logout");
const profileForm = document.getElementById("profileForm");

// Change Email Elements
const changeEmailForm = document.getElementById("changeEmailForm");
const newEmailInput = document.getElementById("newEmailInput");
const confirmEmailInput = document.getElementById("confirmEmailInput");
const changeEmailBtn = document.getElementById("changeEmailBtn");
const changeEmailMsg = document.getElementById("changeEmailMsg");

let currentUserData = null;
let currentUser = null;

// ============================================================
// 1. CHECK AUTH STATE & LOAD USER DATA
// ============================================================
onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    currentUser = user;
    const uid = user.uid;

    profileUid.textContent = uid;
    profileEmail.textContent = user.email || "No email";

    const userRef = ref(database, "users/" + uid);

    onValue(userRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            currentUserData = data;

            profileNameInput.value = data.fullName || user.displayName || "";
            profileWallet.textContent = "₦" + (data.wallet || 0).toLocaleString("en-NG", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

            const ordersRef = ref(database, "orders");
            onValue(ordersRef, (snap) => {
                const orders = snap.val();
                let count = 0;
                if (orders) {
                    Object.values(orders).forEach((order) => {
                        if (order.uid === uid) count++;
                    });
                }
                profileOrders.textContent = count;
            });

            if (user.emailVerified) {
                emailVerification.innerHTML = '<span class="badge bg-success"><i class="bi bi-check-circle"></i> Verified</span>';
                verifyEmailBtn.classList.add("d-none");
            } else {
                emailVerification.innerHTML = '<span class="badge bg-warning text-dark"><i class="bi bi-exclamation-triangle"></i> Not Verified</span>';
                verifyEmailBtn.classList.remove("d-none");
            }

            console.log("✅ Profile data loaded:", data);
        }
    });
});

// ============================================================
// 2. UPDATE PROFILE (Full Name)
// ============================================================
profileForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const fullName = profileNameInput.value.trim();

    if (!fullName) {
        showMessage("Please enter your full name.", "danger");
        return;
    }

    try {
        if (currentUser) {
            await updateProfile(currentUser, { displayName: fullName });
        }

        if (currentUser) {
            await update(ref(database, "users/" + currentUser.uid), {
                fullName: fullName
            });
        }

        showMessage("✅ Profile updated successfully!", "success");
    } catch (error) {
        console.error("Profile update error:", error);
        showMessage("❌ Error updating profile: " + error.message, "danger");
    }
});

// ============================================================
// 3. CHANGE EMAIL (Direct — No Re-auth Modal)
// ============================================================
changeEmailForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const newEmail = newEmailInput.value.trim();
    const confirmEmail = confirmEmailInput.value.trim();

    changeEmailMsg.innerHTML = "";

    // Validations
    if (!newEmail || !confirmEmail) {
        showChangeEmailMessage("Please fill in both email fields.", "danger");
        return;
    }

    if (newEmail !== confirmEmail) {
        showChangeEmailMessage("Email addresses do not match.", "danger");
        return;
    }

    if (newEmail === currentUser.email) {
        showChangeEmailMessage("New email is the same as your current email.", "warning");
        return;
    }

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(newEmail)) {
        showChangeEmailMessage("Please enter a valid email address.", "danger");
        return;
    }

    const originalBtnText = changeEmailBtn.innerHTML;
    changeEmailBtn.disabled = true;
    changeEmailBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Sending verification...';

    try {
        // Send verification link to NEW email (no password prompt)
        await verifyBeforeUpdateEmail(currentUser, newEmail);

        // Save pending email to database
        await update(ref(database, "users/" + currentUser.uid), {
            pendingEmail: newEmail,
            pendingEmailRequestedAt: Date.now()
        });

        showChangeEmailMessage(
            `✅ Verification link sent to <strong>${newEmail}</strong>.<br>
            Please check your inbox (and spam folder) and click the link to confirm your new email.<br>
            <small class="text-muted">Your email will not change until you verify it.</small>`,
            "success"
        );

        newEmailInput.value = "";
        confirmEmailInput.value = "";

    } catch (error) {
        console.error("Change email error:", error);

        let errorMessage = "❌ Error: " + error.message;

        if (error.code === "auth/requires-recent-login") {
            errorMessage = "⚠️ For security, please <strong>log out</strong> and <strong>log back in</strong>, then try again.";
        } else if (error.code === "auth/email-already-in-use") {
            errorMessage = "❌ This email is already in use by another account.";
        } else if (error.code === "auth/invalid-email") {
            errorMessage = "❌ Please enter a valid email address.";
        } else if (error.code === "auth/operation-not-allowed") {
            errorMessage = "❌ Email change is not allowed. Please contact support.";
        }

        showChangeEmailMessage(errorMessage, "danger");
    } finally {
        changeEmailBtn.disabled = false;
        changeEmailBtn.innerHTML = originalBtnText;
    }
});

// ============================================================
// 4. SEND PASSWORD RESET
// ============================================================
resetPasswordBtn.addEventListener("click", async () => {
    if (!currentUser || !currentUser.email) {
        showMessage("No email address found.", "danger");
        return;
    }

    try {
        await sendPasswordResetEmail(auth, currentUser.email);
        showMessage("✅ Password reset email sent! Check your inbox.", "success");
    } catch (error) {
        console.error("Password reset error:", error);
        showMessage("❌ Error: " + error.message, "danger");
    }
});

// ============================================================
// 5. SEND EMAIL VERIFICATION
// ============================================================
verifyEmailBtn.addEventListener("click", async () => {
    if (!currentUser) return;

    try {
        await sendEmailVerification(currentUser);
        showMessage("✅ Verification email sent! Check your inbox.", "success");
        verifyEmailBtn.classList.add("d-none");
    } catch (error) {
        console.error("Verification email error:", error);
        showMessage("❌ Error: " + error.message, "danger");
    }
});

// ============================================================
// 6. LOGOUT
// ============================================================
logoutBtn.addEventListener("click", async () => {
    try {
        await signOut(auth);
        window.location.href = "login.html";
    } catch (error) {
        console.error("Logout error:", error);
        showMessage("❌ Logout failed: " + error.message, "danger");
    }
});

// ============================================================
// 7. HELPERS
// ============================================================
function showMessage(text, type) {
    profileMessage.textContent = text;
    profileMessage.className = "alert alert-" + type + " mt-3";
    profileMessage.classList.remove("d-none");
    setTimeout(() => {
        profileMessage.classList.add("d-none");
    }, 5000);
}

function showChangeEmailMessage(html, type) {
    changeEmailMsg.innerHTML = `<div class="alert alert-${type} mb-0">${html}</div>`;

    if (type === "danger" || type === "warning") {
        setTimeout(() => {
            changeEmailMsg.innerHTML = "";
        }, 6000);
    }
}

console.log("✅ Profile page loaded — direct email change (no re-auth)!");
</script>
