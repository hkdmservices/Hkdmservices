<!-- ============================================================
     FIREBASE AUTH ONLY (No service loading from Firebase)
============================================================ -->
<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js"
    }
}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, onAuthStateChanged } from "firebase/auth";

// Firebase Config
const firebaseConfig = {
    apiKey: "AIzaSyADhpdfM0GaMJIkeQw7Q6eBK3u9CaWUC9k",
    authDomain: "hkdmservices-7d59f.firebaseapp.com",
    databaseURL: "https://hkdmservices-7d59f-default-rtdb.firebaseio.com",
    projectId: "hkdmservices-7d59f",
    storageBucket: "hkdmservices-7d59f.firebasestorage.app",
    messagingSenderId: "839538334772",
    appId: "1:839538334772:web:7d8785f87363b6e5d8fe61"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// ============================================================
// 1. CHECK AUTH STATE
// ============================================================
onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }
    console.log("✅ User authenticated, loading hardcoded services...");
    loadHardcodedServices();
});

// ============================================================
// 2. LOAD HARDCODED SERVICES (from your existing files)
// ============================================================
function loadHardcodedServices() {
    const container = document.getElementById("servicesContainer");
    
    // Try to load from your existing modules
    import('./services.js')
        .then(module => {
            const services = module.hkdmservicesOfficialServicePriceCatalogue || [];
            displayServices(services, container, "General Services");
        })
        .catch(() => {
            console.warn("services.js not found, trying nigeria-services.js...");
            import('./nigeria-services.js')
                .then(module => {
                    const services = module.hkdmservicesNigeriaServicePriceCatalogue || [];
                    displayServices(services, container, "Nigeria Services");
                })
                .catch(() => {
                    console.warn("No service files found, showing fallback.");
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-grid-3x3-gap fs-1 text-muted"></i>
                            <p class="text-muted mt-2">No services available at the moment.</p>
                        </div>
                    `;
                });
        });
}

// ============================================================
// 3. DISPLAY SERVICES
// ============================================================
function displayServices(services, container, title) {
    if (!services || services.length === 0) {
        container.innerHTML = `
            <div class="text-center py-5">
                <i class="bi bi-grid-3x3-gap fs-1 text-muted"></i>
                <p class="text-muted mt-2">No services available in ${title}.</p>
            </div>
        `;
        return;
    }

    let tableHTML = `
        <h5 class="mb-3">${title}</h5>
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
                <tr>
                    <th>Platform</th>
                    <th>Service</th>
                    <th>Price / 1,000</th>
                    <th>Min</th>
                    <th>Max</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
    `;

    services.forEach((service) => {
        const price = service.ratePer1000 || service.fixedPrice || 0;
        tableHTML += `
            <tr>
                <td><span class="badge bg-secondary">${service.platform || "N/A"}</span></td>
                <td>${service.service || service.name || "N/A"}</td>
                <td class="fw-bold">₦${Number(price).toLocaleString("en-NG", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                <td>${service.minimumQuantity || service.min || 100}</td>
                <td>${service.maximumQuantity || service.max || "N/A"}</td>
                <td>
                    <a href="order.html?service=${service.id}" class="btn btn-success btn-sm">
                        <i class="bi bi-cart-plus"></i> Order
                    </a>
                </td>
            </tr>
        `;
    });

    tableHTML += `
            </tbody>
        </table>
    `;

    container.innerHTML = tableHTML;
    console.log(`✅ Loaded ${services.length} services from ${title}`);
}

console.log("✅ Services Catalog page loaded with Firebase auth only!");
</script>

</body>
