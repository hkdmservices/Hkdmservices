<!-- ============================================================
     FIREBASE LOGIC (Added – Your Design is Untouched)
============================================================ -->
<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js"
    }
}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, onAuthStateChanged } from "firebase/auth";
import { getDatabase, ref, onValue } from "firebase/database";

// Firebase Config
const firebaseConfig = {
    apiKey: "AIzaSyADhpdfM0GaMJIkeQw7Q6eBK3u9CaWUC9k",
    authDomain: "hkdmservices-7d59f.firebaseapp.com",
    databaseURL: "https://hkdmservices-7d59f-default-rtdb.firebaseio.com",
    projectId: "hkdmservices-7d59f",
    storageBucket: "hkdmservices-7d59f.firebasestorage.app",
    messagingSenderId: "839538334772",
    appId: "1:839538334772:web:7d8785f87363b6e5d8fe61"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);

const servicesContainer = document.getElementById("servicesContainer");

// ============================================================
// 1. CHECK AUTH STATE
// ============================================================
onAuthStateChanged(auth, (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }
    loadServices();
});

// ============================================================
// 2. LOAD SERVICES
// ============================================================
function loadServices() {
    const servicesRef = ref(database, "services");

    onValue(servicesRef, (snapshot) => {
        const data = snapshot.val();

        if (!data) {
            servicesContainer.innerHTML = `
                <div class="text-center py-5">
                    <i class="bi bi-grid-3x3-gap fs-1 text-muted"></i>
                    <p class="text-muted mt-2">No services available at the moment.</p>
                </div>
            `;
            return;
        }

        // Convert to array and filter active services
        const servicesList = Object.entries(data)
            .map(([key, service]) => ({ id: key, ...service }))
            .filter(service => service.status !== "inactive");

        if (servicesList.length === 0) {
            servicesContainer.innerHTML = `
                <div class="text-center py-5">
                    <i class="bi bi-grid-3x3-gap fs-1 text-muted"></i>
                    <p class="text-muted mt-2">No active services available at the moment.</p>
                </div>
            `;
            return;
        }

        // Build table
        let tableHTML = `
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Platform</th>
                        <th>Service</th>
                        <th>Price / 1,000</th>
                        <th>Min</th>
                        <th>Max</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
        `;

        servicesList.forEach((service) => {
            tableHTML += `
                <tr>
                    <td><span class="badge bg-secondary">${service.platform || "N/A"}</span></td>
                    <td>${service.service || service.name || "N/A"}</td>
                    <td class="fw-bold">₦${(service.ratePer1000 || service.price || 0).toLocaleString("en-NG", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                    <td>${service.minimumQuantity || 100}</td>
                    <td>${service.maximumQuantity || "N/A"}</td>
                    <td>
                        <a href="order.html?service=${service.id}" class="btn btn-success btn-sm">
                            <i class="bi bi-cart-plus"></i> Order
                        </a>
                    </td>
                </tr>
            `;
        });

        tableHTML += `
                </tbody>
            </table>
        `;

        servicesContainer.innerHTML = tableHTML;
        console.log(`✅ Loaded ${servicesList.length} services`);

    }, (error) => {
        console.error("Services error:", error);
        servicesContainer.innerHTML = `
            <div class="text-center py-5 text-danger">
                <i class="bi bi-exclamation-triangle fs-1"></i>
                <p class="mt-2">Failed to load services. Please try again.</p>
            </div>
        `;
    });
}

console.log("✅ Services Catalog page loaded with Firebase!");
</script>
