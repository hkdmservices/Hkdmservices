<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | HKDMservices</title>
    <meta name="description" content="Browse and purchase verified social media accounts on HKDMservices.">
    
    <!-- Global Theme Script -->
    <script src="theme.js"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">

    <style>
        html { scroll-behavior: smooth; }
        body { margin: 0; font-family: Arial, sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        .main-navbar { background: #111; }
        .brand-icon { margin-right: 7px; }
        .section-padding { padding: 70px 0; }
        .feature-card {
            height: 100%;
            padding: 25px;
            border: 1px solid #e9ecef;
            border-radius: 18px;
            background: #fff;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .feature-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.08); }
        html[data-theme="dark"] body { background: #101418; color: #f1f3f5; }
        html[data-theme="dark"] .main-navbar { background: #080a0c; }
        html[data-theme="dark"] .feature-card { background: #181d22; border-color: #30363d; color: #f1f3f5; }
        html[data-theme="dark"] .text-muted { color: #adb5bd !important; }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark main-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="dashboard.html">
            <span class="brand-icon">⬢</span> HKDMservices
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                <li class="nav-item"><a class="nav-link active" href="shop.html">Shop</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item ms-lg-2 mt-2 mt-lg-0" id="authNavBtn"><a class="btn btn-outline-light" href="login.html">Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- SHOP HEADER -->
<header class="bg-success text-white py-5">
    <div class="container text-center">
        <h1 class="fw-bold">Social Accounts Marketplace</h1>
        <p class="lead mb-0">Browse and secure verified social media handles instantly.</p>
    </div>
</header>

<!-- MARKETPLACE CONTENT -->
<section class="section-padding">
    <div class="container">
        <div class="row g-4" id="shopAccountsContainer">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-success" role="status"></div>
                <p class="text-muted mt-2">Loading available accounts...</p>
            </div>
        </div>
    </div>
</section>

<!-- FOOTER -->
<footer class="bg-dark text-white py-4">
    <div class="container text-center">
        <small class="text-secondary">© 2026 HKDMservices. All rights reserved.</small>
    </div>
</footer>

<!-- SCRIPTS & FIREBASE (Modular SDK via type="module") -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
  import { getDatabase, ref, get, update, set, ref as dbRef } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyADhpdfM0GaMJIkeQw7Q6eBK3u9CaWUC9k",
    authDomain: "hkdmservices-7d59f.firebaseapp.com",
    databaseURL: "https://hkdmservices-7d59f-default-rtdb.firebaseio.com",
    projectId: "hkdmservices-7d59f",
    storageBucket: "hkdmservices-7d59f.firebasestorage.app",
    messagingSenderId: "839538334772",
    appId: "1:839538334772:web:7d8785f87363b6e5d8fe61"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const database = getDatabase(app);

  onAuthStateChanged(auth, (user) => {
    const authNavBtn = document.getElementById('authNavBtn');
    if (user) {
      authNavBtn.innerHTML = `<a class="btn btn-outline-light" href="dashboard.html">Dashboard</a>`;
    } else {
      authNavBtn.innerHTML = `<a class="btn btn-outline-light" href="login.html">Login</a>`;
    }
  });

  async function loadShopAccounts() {
    const container = document.getElementById('shopAccountsContainer');
    try {
      const snapshot = await get(ref(database, 'accounts'));
      const data = snapshot.val();

      if (!data) {
        container.innerHTML = '<div class="col-12 text-center text-muted py-5"><h4>No social accounts available right now.</h4><p>Check back later or add accounts via your admin panel.</p></div>';
        return;
      }

      container.innerHTML = '';

      Object.entries(data).forEach(([key, account]) => {
        if (account.status === "sold") return;

        const accountId = account.id || key;
        const followers = account.followers || account.followerCount || "N/A";
        const accountAge = account.age || account.accountAge || "N/A";
        const platform = account.platform || 'Social';
        const baseTitle = account.title || 'Social Media Account';
        
        const displayTitle = baseTitle.toLowerCase().includes(platform.toLowerCase()) 
          ? baseTitle 
          : `${platform} - ${baseTitle}`;

        const cardHTML = `
            <div class="col-12 col-md-4">
                <div class="feature-card shadow-sm h-100 d-flex flex-column justify-content-between">
                    <div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="badge bg-success">${platform}</span>
                            <span class="fw-bold text-success fs-5">₦${Number(account.price || 0).toLocaleString()}</span>
                        </div>
                        <h5 class="fw-bold">${displayTitle}</h5>
                        <p class="text-muted small">${account.description || 'Verified social media account ready for immediate transfer.'}</p>
                        
                        <div class="d-flex justify-content-between border-top pt-2 mt-3 text-secondary small">
                            <span><i class="bi bi-people me-1"></i> Followers: <strong>${followers}</strong></span>
                            <span><i class="bi bi-calendar-check me-1"></i> Age: <strong>${accountAge}</strong></span>
                        </div>
                    </div>
                    <button onclick="buyAccount('${accountId}')" class="btn btn-outline-success w-100 mt-3">
                        <i class="bi bi-cart-plus me-2"></i>Buy Now
                    </button>
                </div>
            </div>
        `;
        container.innerHTML += cardHTML;
      });

      if (container.innerHTML === '') {
        container.innerHTML = '<div class="col-12 text-center text-muted py-5"><h4>All accounts have been sold out.</h4><p>Check back later for new inventory.</p></div>';
      }
    } catch (err) {
      console.error('Failed to load accounts from Firebase:', err);
      container.innerHTML = '<div class="col-12 text-center text-danger"><p>Failed to load listings. Please verify your connection.</p></div>';
    }
  }

  window.buyAccount = async function(accountId) {
    const currentUser = auth.currentUser;
    if (!currentUser) {
      alert("Please log in to purchase social accounts.");
      window.location.href = "login.html";
      return;
    }

    if (!confirm("Are you sure you want to purchase this account? Funds will be deducted from your wallet instantly.")) {
      return;
    }

    try {
      const userRef = dbRef(database, `users/${currentUser.uid}`);
      const accountRef = dbRef(database, `accounts/${accountId}`);
      
      const [userSnap, accountSnap] = await Promise.all([get(userRef), get(accountRef)]);
      
      if (!accountSnap.exists()) {
        alert("This account is no longer available.");
        loadShopAccounts();
        return;
      }

      const accountData = accountSnap.val();
      if (accountData.status === "sold") {
        alert("This account has already been sold.");
        loadShopAccounts();
        return;
      }

      const userData = userSnap.val() || {};
      const userBalance = Number(userData.wallet !== undefined ? userData.wallet : (userData.balance || 0));
      const accountPrice = Number(accountData.price || 0);

      if (userBalance < accountPrice) {
        alert("Insufficient wallet balance. Please fund your wallet to complete this purchase.");
        return;
      }

      const newBalance = userBalance - accountPrice;
      const newTotalSpent = Number(userData.totalSpent || 0) + accountPrice;
      const orderId = "ord_" + Date.now();
      const platform = accountData.platform || 'Social';
      const baseTitle = accountData.title || 'Social Media Account';
      const orderTitle = baseTitle.toLowerCase().includes(platform.toLowerCase()) ? baseTitle : `${platform} - ${baseTitle}`;

      await update(userRef, {
        wallet: newBalance,
        totalSpent: newTotalSpent
      });

      await update(accountRef, {
        status: "sold",
        buyerUid: currentUser.uid
      });

      await set(dbRef(database, `orders/${orderId}`), {
        id: orderId,
        uid: currentUser.uid,
        accountId: accountId,
        title: orderTitle,
        price: accountPrice,
        credentials: accountData.credentials || ("Username: " + (accountData.username || "N/A") + " | Password: " + (accountData.password || "N/A")),
        timestamp: Date.now()
      });

      alert("Purchase successful! Redirecting to your order details...");
      window.location.href = `order-success.html?orderId=${orderId}`;

    } catch (err) {
      console.error("Checkout failed:", err);
      alert("An error occurred during checkout. Please try again.");
    }
  }

  document.addEventListener('DOMContentLoaded', loadShopAccounts);
</script>

</body>
</html>
