<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Accounts Marketplace - HKDMservices</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .header {
            background: #111827;
            color: white;
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 26px;
        }

        .header p {
            margin: 0;
            color: #d1d5db;
        }

        .section {
            background: white;
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .section-title h2 {
            margin: 0;
            font-size: 21px;
        }

        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .account-card {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 20px;
            background: #fff;
        }

        .account-card h3 {
            margin-top: 0;
            margin-bottom: 12px;
        }

        .account-info {
            margin: 8px 0;
            color: #4b5563;
        }

        .account-info strong {
            color: #111827;
        }

        .price {
            font-size: 21px;
            font-weight: bold;
            margin: 15px 0;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 16px;
            cursor: pointer;
            font-weight: 600;
        }

        .buy-btn {
            width: 100%;
            background: #111827;
            color: white;
        }

        .buy-btn:hover {
            opacity: 0.9;
        }

        .refresh-btn {
            background: #e5e7eb;
            color: #111827;
        }

        .purchase-card {
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 18px;
            background: #fff;
        }

        .purchase-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 15px;
        }

        .purchase-header h3 {
            margin: 0 0 6px;
        }

        .status {
            background: #dcfce7;
            color: #166534;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .detail-box {
            background: #f9fafb;
            padding: 12px;
            border-radius: 9px;
        }

        .detail-box small {
            display: block;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .credentials-box {
            background: #111827;
            color: white;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }

        .credentials-value {
            margin-top: 10px;
            background: #1f2937;
            padding: 12px;
            border-radius: 7px;
            word-break: break-word;
            white-space: pre-wrap;
            font-family: monospace;
        }

        .credential-buttons {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .credential-buttons button {
            background: white;
            color: #111827;
        }

        .empty-state {
            text-align: center;
            padding: 35px 15px;
            color: #6b7280;
        }

        .loading {
            text-align: center;
            padding: 25px;
            color: #6b7280;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .container {
                width: 94%;
            }

            .section {
                padding: 16px;
            }

            .purchase-header {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Social Media Accounts Marketplace</h1>
        <p>Buy available social media accounts securely using your wallet.</p>
    </div>

    <!-- AVAILABLE ACCOUNTS -->
    <div class="section">
        <div class="section-title">
            <h2>Available Accounts</h2>
        </div>

        <div id="shopAccountsContainer" class="accounts-grid">
            <div class="loading">Loading available accounts...</div>
        </div>
    </div>

    <!-- SOCIAL ACCOUNT PURCHASE HISTORY ONLY -->
    <div class="section" id="purchaseHistorySection">

        <div class="section-title">
            <h2>My Social Account Purchases</h2>

            <button
                type="button"
                class="refresh-btn"
                id="refreshHistoryBtn">
                Refresh
            </button>
        </div>

        <div id="purchaseHistoryContainer">
            <div class="loading">
                Loading your social account purchases...
            </div>
        </div>

    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    getDatabase,
    ref,
    get,
    update,
    set,
    push
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {
    apiKey: "AIzaSyADhpdfM0GaMJIkeQw7Q6eBK3u9CaWUC9k",
    authDomain: "hkdmservices-7d59f.firebaseapp.com",
    databaseURL: "https://hkdmservices-7d59f-default-rtdb.firebaseio.com",
    projectId: "hkdmservices-7d59f",
    storageBucket: "hkdmservices-7d59f.firebasestorage.app",
    messagingSenderId: "839538334772",
    appId: "1:839538334772:web:7d8785f87363b6e5d8fe61"
};


/* =========================================================
   INITIALIZE FIREBASE
========================================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const database = getDatabase(app);

let currentUser = null;


/* =========================================================
   ELEMENTS
========================================================= */

const shopAccountsContainer =
    document.getElementById("shopAccountsContainer");

const purchaseHistoryContainer =
    document.getElementById("purchaseHistoryContainer");

const refreshHistoryBtn =
    document.getElementById("refreshHistoryBtn");


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        currentUser = null;

        shopAccountsContainer.innerHTML = `
            <div class="empty-state">
                Please log in to view and purchase social media accounts.
            </div>
        `;

        purchaseHistoryContainer.innerHTML = `
            <div class="empty-state">
                Please log in to view your social account purchases.
            </div>
        `;

        return;
    }

    currentUser = user;

    await loadShopAccounts();

    await loadPurchaseHistory(user.uid);

});


/* =========================================================
   LOAD AVAILABLE ACCOUNTS
========================================================= */

async function loadShopAccounts() {

    shopAccountsContainer.innerHTML = `
        <div class="loading">
            Loading available accounts...
        </div>
    `;

    try {

        const snapshot =
            await get(ref(database, "accounts"));

        if (!snapshot.exists()) {

            shopAccountsContainer.innerHTML = `
                <div class="empty-state">
                    No social media accounts are currently available.
                </div>
            `;

            return;
        }

        const accounts = snapshot.val();

        let html = "";

        Object.entries(accounts).forEach(([accountId, accountData]) => {

            if (!accountData) return;

            const status =
                String(accountData.status || "")
                    .trim()
                    .toLowerCase();

            if (status === "sold") return;

            const platform =
                accountData.platform || "Social Media";

            const title =
                accountData.title ||
                accountData.name ||
                "Social Media Account";

            const description =
                accountData.description || "";

            const followers =
                accountData.followers ||
                accountData.followerCount ||
                0;

            const age =
                accountData.age ||
                accountData.accountAge ||
                "N/A";

            const price =
                Number(accountData.price || 0);

            html += `

                <div class="account-card">

                    <h3>${escapeHtml(title)}</h3>

                    <div class="account-info">
                        <strong>Platform:</strong>
                        ${escapeHtml(platform)}
                    </div>

                    <div class="account-info">
                        <strong>Followers:</strong>
                        ${escapeHtml(String(followers))}
                    </div>

                    <div class="account-info">
                        <strong>Account Age:</strong>
                        ${escapeHtml(String(age))}
                    </div>

                    ${
                        description
                        ? `
                        <div class="account-info">
                            <strong>Description:</strong><br>
                            ${escapeHtml(description)}
                        </div>
                        `
                        : ""
                    }

                    <div class="price">
                        ₦${price.toLocaleString()}
                    </div>

                    <button
                        type="button"
                        class="buy-btn"
                        onclick="buyAccount('${accountId}')">

                        Buy Now

                    </button>

                </div>

            `;

        });

        if (!html) {

            shopAccountsContainer.innerHTML = `
                <div class="empty-state">
                    No social media accounts are currently available.
                </div>
            `;

            return;
        }

        shopAccountsContainer.innerHTML = html;

    } catch (error) {

        console.error(
            "Error loading accounts:",
            error
        );

        shopAccountsContainer.innerHTML = `
            <div class="error">
                Unable to load social media accounts.
            </div>
        `;
    }
}


/* =========================================================
   BUY ACCOUNT
========================================================= */

window.buyAccount = async function(accountId) {

    if (!currentUser) {

        alert("Please log in first.");

        return;
    }

    try {

        const userRef =
            ref(
                database,
                `users/${currentUser.uid}`
            );

        const accountRef =
            ref(
                database,
                `accounts/${accountId}`
            );

        const userSnapshot =
            await get(userRef);

        const accountSnapshot =
            await get(accountRef);

        if (!userSnapshot.exists()) {

            alert("User profile was not found.");

            return;
        }

        if (!accountSnapshot.exists()) {

            alert("This account no longer exists.");

            return;
        }

        const userData =
            userSnapshot.val();

        const accountData =
            accountSnapshot.val();

        const accountStatus =
            String(accountData.status || "")
                .trim()
                .toLowerCase();

        if (accountStatus === "sold") {

            alert(
                "Sorry, this account has already been sold."
            );

            await loadShopAccounts();

            return;
        }

        const accountPrice =
            Number(accountData.price || 0);

        const walletBalance =
            Number(userData.wallet || 0);

        if (accountPrice <= 0) {

            alert(
                "This account does not have a valid price."
            );

            return;
        }

        if (walletBalance < accountPrice) {

            alert(
                `Insufficient wallet balance.\n\n` +
                `Account Price: ₦${accountPrice.toLocaleString()}\n` +
                `Wallet Balance: ₦${walletBalance.toLocaleString()}`
            );

            return;
        }

        const confirmed =
            confirm(
                `Purchase this social media account for ₦${accountPrice.toLocaleString()}?`
            );

        if (!confirmed) return;


        /* =====================================================
           GENERATE ORDER
        ===================================================== */

        const orderRef =
            push(ref(database, "orders"));

        const orderId =
            orderRef.key;

        const transactionRef =
            push(ref(database, "transactions"));

        const transactionId =
            transactionRef.key;

        const now =
            Date.now();

        const newWalletBalance =
            walletBalance - accountPrice;

        const previousTotalSpent =
            Number(userData.totalSpent || 0);

        const newTotalSpent =
            previousTotalSpent + accountPrice;


        /* =====================================================
           ACCOUNT INFORMATION
        ===================================================== */

        const platform =
            accountData.platform || "Social Media";

        const orderTitle =
            accountData.title ||
            accountData.name ||
            "Social Media Account";

        const credentials =
            accountData.credentials ||
            accountData.loginDetails ||
            accountData.login ||
            "";


        /* =====================================================
           UPDATE USER WALLET
        ===================================================== */

        await update(
            userRef,
            {
                wallet: newWalletBalance,
                totalSpent: newTotalSpent
            }
        );


        /* =====================================================
           MARK ACCOUNT AS SOLD
        ===================================================== */

        await update(
            accountRef,
            {
                status: "sold",
                buyerUid: currentUser.uid,
                soldAt: now
            }
        );


        /* =====================================================
           CREATE ORDER
        ===================================================== */

        await set(
            orderRef,
            {
                orderId: orderId,

                uid: currentUser.uid,

                catalogue: "Social Accounts",

                platform: platform,

                serviceId: accountId,

                service: orderTitle,

                link: "",

                quantity: 1,

                amount: accountPrice,

                status: "completed",

                paymentMethod: "wallet",

                createdAt: now,

                email:
                    userData.email ||
                    currentUser.email ||
                    "N/A",

                accountId: accountId,

                accountTitle: orderTitle,

                credentials: credentials,

                accountDescription:
                    accountData.description || "",

                followers:
                    accountData.followers ||
                    accountData.followerCount ||
                    0,

                accountAge:
                    accountData.age ||
                    accountData.accountAge ||
                    "N/A"
            }
        );


        /* =====================================================
           CREATE TRANSACTION
        ===================================================== */

        await set(
            transactionRef,
            {
                uid: currentUser.uid,

                orderId: orderId,

                type: "order",

                amount: accountPrice,

                status: "success",

                description:
                    `Social Account Purchase - ${platform} - ${orderTitle}`,

                createdAt: now
            }
        );


        alert(
            "Purchase successful!\n\n" +
            "Your social media account has been added to your purchase history."
        );


        /* =====================================================
           REFRESH
        ===================================================== */

        await loadShopAccounts();

        await loadPurchaseHistory(
            currentUser.uid
        );


        document
            .getElementById("purchaseHistorySection")
            .scrollIntoView({
                behavior: "smooth"
            });

    } catch (error) {

        console.error(
            "Account purchase error:",
            error
        );

        alert(
            "Something went wrong while processing your purchase.\n\n" +
            error.message
        );
    }
};


/* =========================================================
   LOAD SOCIAL ACCOUNT PURCHASE HISTORY
========================================================= */

async function loadPurchaseHistory(uid) {

    purchaseHistoryContainer.innerHTML = `
        <div class="loading">
            Loading your social account purchases...
        </div>
    `;

    try {

        const snapshot =
            await get(ref(database, "orders"));

        if (!snapshot.exists()) {

            purchaseHistoryContainer.innerHTML = `
                <div class="empty-state">
                    You have not purchased any social media accounts yet.
                </div>
            `;

            return;
        }

        const orders =
            snapshot.val();


        /* =====================================================
           IMPORTANT FILTER

           ONLY orders with:

           catalogue = "Social Accounts"

           are allowed here.

           Normal engagement orders are excluded.
        ===================================================== */

        const purchases =
            Object.entries(orders)

                .map(([key, order]) => ({
                    firebaseKey: key,
                    ...order
                }))

                .filter(order => {

                    const sameUser =
                        String(order.uid || "") ===
                        String(uid);

                    const isSocialAccountPurchase =
                        String(order.catalogue || "")
                            .trim()
                            .toLowerCase() ===
                        "social accounts";

                    return (
                        sameUser &&
                        isSocialAccountPurchase
                    );

                })

                .sort(
                    (a, b) =>
                        Number(b.createdAt || 0) -
                        Number(a.createdAt || 0)
                );


        if (!purchases.length) {

            purchaseHistoryContainer.innerHTML = `
                <div class="empty-state">
                    You have not purchased any social media accounts yet.
                </div>
            `;

            return;
        }


        renderPurchaseHistory(
            purchases
        );

    } catch (error) {

        console.error(
            "Error loading purchase history:",
            error
        );

        purchaseHistoryContainer.innerHTML = `
            <div class="error">
                Unable to load your social account purchase history.
            </div>
        `;
    }
}


/* =========================================================
   RENDER PURCHASE HISTORY
========================================================= */

function renderPurchaseHistory(purchases) {

    let html = "";

    purchases.forEach((purchase, index) => {

        const platform =
            purchase.platform ||
            "Social Media";

        const title =
            purchase.accountTitle ||
            purchase.service ||
            "Social Media Account";

        const price =
            Number(purchase.amount || 0);

        const followers =
            purchase.followers ||
            0;

        const accountAge =
            purchase.accountAge ||
            "N/A";

        const description =
            purchase.accountDescription ||
            "";

        const credentials =
            purchase.credentials ||
            "";

        const orderId =
            purchase.orderId ||
            purchase.firebaseKey ||
            "N/A";

        const createdAt =
            purchase.createdAt
                ? new Date(
                    Number(purchase.createdAt)
                  ).toLocaleString()
                : "N/A";

        const credentialId =
            `credentials-${index}`;


        html += `

            <div class="purchase-card">

                <div class="purchase-header">

                    <div>

                        <h3>
                            ${escapeHtml(title)}
                        </h3>

                        <div>
                            ${escapeHtml(platform)}
                        </div>

                    </div>

                    <div class="status">
                        ${escapeHtml(
                            purchase.status || "completed"
                        )}
                    </div>

                </div>


                <div class="details-grid">

                    <div class="detail-box">

                        <small>Price</small>

                        <strong>
                            ₦${price.toLocaleString()}
                        </strong>

                    </div>


                    <div class="detail-box">

                        <small>Platform</small>

                        <strong>
                            ${escapeHtml(platform)}
                        </strong>

                    </div>


                    <div class="detail-box">

                        <small>Account Age</small>

                        <strong>
                            ${escapeHtml(
                                String(accountAge)
                            )}
                        </strong>

                    </div>


                    <div class="detail-box">

                        <small>Followers</small>

                        <strong>
                            ${escapeHtml(
                                String(followers)
                            )}
                        </strong>

                    </div>


                    <div class="detail-box">

                        <small>Purchase Date</small>

                        <strong>
                            ${escapeHtml(createdAt)}
                        </strong>

                    </div>


                    <div class="detail-box">

                        <small>Order ID</small>

                        <strong>
                            ${escapeHtml(orderId)}
                        </strong>

                    </div>

                </div>


                ${
                    description
                    ? `

                        <div class="detail-box">

                            <small>
                                Account Description
                            </small>

                            <div>
                                ${escapeHtml(description)}
                            </div>

                        </div>

                    `
                    : ""
                }


                <div class="credentials-box">

                    <strong>
                        Account Credentials
                    </strong>


                    <div
                        id="${credentialId}"
                        class="credentials-value"
                        style="display:none;"
                    >
                        ${escapeHtml(
                            String(credentials)
                        )}
                    </div>


                    <div class="credential-buttons">

                        <button
                            type="button"
                            onclick="toggleCredentials('${credentialId}', this)"
                        >
                            Show Credentials
                        </button>


                        <button
                            type="button"
                            onclick="copyCredentials('${credentialId}')"
                        >
                            Copy Credentials
                        </button>

                    </div>

                </div>

            </div>

        `;
    });

    purchaseHistoryContainer.innerHTML =
        html;
}


/* =========================================================
   SHOW / HIDE CREDENTIALS
========================================================= */

window.toggleCredentials =
    function(id, button) {

        const element =
            document.getElementById(id);

        if (!element) return;

        if (
            element.style.display === "none"
        ) {

            element.style.display =
                "block";

            button.textContent =
                "Hide Credentials";

        } else {

            element.style.display =
                "none";

            button.textContent =
                "Show Credentials";
        }
    };


/* =========================================================
   COPY CREDENTIALS
========================================================= */

window.copyCredentials =
    async function(id) {

        const element =
            document.getElementById(id);

        if (!element) return;

        const text =
            element.textContent.trim();

        if (!text) {

            alert(
                "No credentials are available."
            );

            return;
        }

        try {

            await navigator.clipboard.writeText(
                text
            );

            alert(
                "Credentials copied successfully."
            );

        } catch (error) {

            console.error(
                "Copy error:",
                error
            );

            alert(
                "Unable to copy credentials."
            );
        }
    };


/* =========================================================
   REFRESH PURCHASE HISTORY
========================================================= */

refreshHistoryBtn.addEventListener(
    "click",
    async () => {

        if (!currentUser) {

            alert(
                "Please log in first."
            );

            return;
        }

        await loadPurchaseHistory(
            currentUser.uid
        );
    }
);


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
