<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Activate Admin</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container py-5">

<div class="card shadow p-4">

<h2 class="mb-3">
Activate Admin
</h2>

<p id="status">
Checking your account...
</p>

<button
id="activateButton"
class="btn btn-success"
disabled>

Activate Admin

</button>

</div>

</div>


<script type="module">

import {
    auth
} from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const status =
    document.getElementById(
        "status"
    );

const activateButton =
    document.getElementById(
        "activateButton"
    );


let currentUser = null;


onAuthStateChanged(
    auth,
    (user) => {

        if (!user) {

            status.textContent =
                "You are not logged in. Please log in first.";

            activateButton.disabled =
                true;

            return;

        }


        currentUser =
            user;


        status.textContent =
            "Logged in as: " +
            (
                user.email ||
                "Firebase user"
            );


        activateButton.disabled =
            false;

    }
);


activateButton.addEventListener(
    "click",
    async () => {

        if (!currentUser) {

            status.textContent =
                "Please wait for your account to load.";

            return;

        }


        try {

            activateButton.disabled =
                true;

            activateButton.textContent =
                "Activating...";


            /*
             * Get the current Firebase ID token.
             */

            const idToken =
                await currentUser.getIdToken(
                    true
                );


            /*
             * Send the token to our
             * protected admin endpoint.
             */

            const response =
                await fetch(
                    "/api/set-admin",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                "Bearer " +
                                idToken

                        }

                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.message ||
                    "Unable to activate admin."
                );

            }


            /*
             * Force Firebase to issue
             * a fresh ID token containing
             * admin: true.
             */

            await currentUser.getIdToken(
                true
            );


            status.textContent =
                "Admin activated successfully!";


            activateButton.textContent =
                "Admin Activated";


        } catch (error) {

            console.error(
                "ADMIN ACTIVATION ERROR:",
                error
            );


            status.textContent =
                error.message ||
                "Unable to activate admin.";


            activateButton.disabled =
                false;

            activateButton.textContent =
                "Activate Admin";

        }

    }
);

</script>

</body>

</html>
