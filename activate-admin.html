<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Activate Admin - HKDMservices</title>
<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">
<style>
    body {
        background: #f5f7fa;
    }
    .activate-card {
        max-width: 520px;
        margin: 80px auto;
        border: 0;
        border-radius: 16px;
    }
    #activateButton {
        min-height: 48px;
    }
</style>
</head>
<body>
<div class="container">
<div class="card shadow activate-card">
    <div class="card-body p-4">
        <h2 class="mb-3">
            Activate Admin
        </h2>
        <p
            id="status"
            class="text-muted"
        >
            Checking your account...
        </p>
        <div
            id="userInfo"
            class="alert alert-light border"
            style="display:none;"
        >
            <strong>Logged in as:</strong>
            <div id="userEmail" class="mt-1"></div>
        </div>
        <button
            id="activateButton"
            type="button"
            class="btn btn-success w-100"
            disabled
        >
            Activate Admin
        </button>
        <div
            id="result"
            class="mt-3"
        ></div>
    </div>
</div>
</div>
<script type="module">
import {
    auth
} from "./firebase.js";
import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
const status =
    document.getElementById(
        "status"
    );
const userInfo =
    document.getElementById(
        "userInfo"
    );
const userEmail =
    document.getElementById(
        "userEmail"
    );
const activateButton =
    document.getElementById(
        "activateButton"
    );
const result =
    document.getElementById(
        "result"
    );
let currentUser = null;
/*
=========================================================
SHOW MESSAGE
=========================================================
*/
function showResult(
    message,
    type = "info"
) {
    result.innerHTML = `
        <div class="alert alert-${type} mb-0">
            ${message}
        </div>
    `;
}
/*
=========================================================
CHECK LOGIN
=========================================================
*/
onAuthStateChanged(
    auth,
    async (user) => {
        if (!user) {
            currentUser = null;
            status.textContent =
                "You are not logged in. Please log in first.";
            userInfo.style.display =
                "none";
            activateButton.disabled =
                true;
            return;
        }
        currentUser =
            user;
        userInfo.style.display =
            "block";
        userEmail.textContent =
            user.email ||
            "Firebase user";
        status.textContent =
            "Your account is ready.";
        activateButton.disabled =
            false;
        /*
         * Clear previous messages.
         */
        result.innerHTML = "";
        /*
         * Check whether the current
         * token already contains admin.
         */
        try {
            const tokenResult =
                await user.getIdTokenResult();
            if (
                tokenResult.claims.admin === true
            ) {
                status.textContent =
                    "Admin privileges are already active.";
                activateButton.textContent =
                    "Admin Already Activated";
                activateButton.disabled =
                    true;
                showResult(
                    "Your Firebase admin claim is already active. You can open the admin dashboard.",
                    "success"
                );
            }
        } catch (error) {
            console.error(
                "TOKEN CHECK ERROR:",
                error
            );
        }
    }
);
/*
=========================================================
ACTIVATE ADMIN
=========================================================
*/
activateButton.addEventListener(
    "click",
    async () => {
        if (!currentUser) {
            showResult(
                "Please wait for your account to load.",
                "warning"
            );
            return;
        }
        try {
            activateButton.disabled =
                true;
            activateButton.textContent =
                "Activating...";
            status.textContent =
                "Verifying your account...";
            result.innerHTML = "";
            /*
             * Get a fresh Firebase ID token.
             */
            const idToken =
                await currentUser.getIdToken(
                    true
                );
            /*
             * Send the authenticated token
             * to the protected server endpoint.
             */
            const response =
                await fetch(
                    "/api/set-admin",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json",
                            "Authorization":
                                "Bearer " +
                                idToken
                        }
                    }
                );
            /*
             * Read response safely.
             */
            let data = {};
            try {
                data =
                    await response.json();
            } catch {
                data = {};
            }
            /*
             * Handle failed activation.
             */
            if (!response.ok) {
                throw new Error(
                    data.message ||
                    "Unable to activate admin."
                );
            }
            /*
             * Force Firebase to issue
             * a new token containing
             * admin: true.
             */
            await currentUser.getIdToken(
                true
            );
            /*
             * Confirm the new claim.
             */
            const tokenResult =
                await currentUser.getIdTokenResult(
                    true
                );
            if (
                tokenResult.claims.admin !== true
            ) {
                throw new Error(
                    "Admin was activated on the server, but the new admin claim has not appeared in your token yet. Please refresh and try again."
                );
            }
            /*
             * SUCCESS
             */
            status.textContent =
                "Admin activation successful!";
            activateButton.textContent =
                "Admin Activated";
            showResult(
                "Admin privileges are now active. You can open the admin dashboard.",
                "success"
            );
            /*
             * Give Firebase a moment,
             * then open admin dashboard.
             */
            setTimeout(
                () => {
                    window.location.href =
                        "admin-dashboard.html";
                },
                1200
            );
        } catch (error) {
            console.error(
                "ADMIN ACTIVATION ERROR:",
                error
            );
            status.textContent =
                "Admin activation failed.";
            showResult(
                error.message ||
                "Unable to activate admin. Please try again.",
                "danger"
            );
            activateButton.disabled =
                false;
            activateButton.textContent =
                "Activate Admin";
        }
    }
);
</script>
</body>
</html>
