<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Activate Admin</title>
<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">
</head>
<body>
<div class="container py-5">
<div class="card shadow p-4">
<h2 class="mb-3">
Activate Admin
</h2>
<p id="status">
Checking your account...
</p>
<div
id="claimStatus"
class="alert alert-secondary"
style="display:none;"
>
Checking administrator status...
</div>

Activate Admin

</button>
</div>
</div>
<script type="module">
import {
    auth
} from "./firebase.js";
import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
const status =
    document.getElementById(
        "status"
    );
const claimStatus =
    document.getElementById(
        "claimStatus"
    );
const activateButton =
    document.getElementById(
        "activateButton"
    );
let currentUser = null;
/* =========================================================
   CHECK CURRENT ADMIN CLAIM
========================================================= */
async function checkAdminClaim() {
    if (!currentUser) {
        return;
    }
    try {
        /*
         * Force Firebase to issue a fresh ID token.
         */
        await currentUser.getIdToken(
            true
        );
        /*
         * Read the latest token claims.
         */
        const tokenResult =
            await currentUser.getIdTokenResult();
        const claims =
            tokenResult.claims;
        const isAdmin =
            claims.admin === true;
        /*
         * Console diagnostics.
         */
        console.log(
            "================================"
        );
        console.log(
            "CURRENT USER UID:",
            currentUser.uid
        );
        console.log(
            "CURRENT USER EMAIL:",
            currentUser.email
        );
        console.log(
            "CURRENT ADMIN CLAIMS:",
            claims
        );
        console.log(
            "CURRENT ADMIN VALUE:",
            claims.admin
        );
        console.log(
            "IS ADMIN:",
            isAdmin
        );
        console.log(
            "================================"
        );
        /*
         * Display result on page.
         */
        claimStatus.style.display =
            "block";
        if (isAdmin) {
            claimStatus.className =
                "alert alert-success";
            claimStatus.innerHTML = `
                <strong>
                    Administrator verified.
                </strong>
                <br>
                Firebase confirms that
                <code>admin: true</code>
                is present in your ID token.
                <br><br>
                UID:
                <code>
                    ${currentUser.uid}
                </code>
            `;
            status.textContent =
                "Your account is already an administrator.";
            activateButton.textContent =
                "Admin Already Activated";
            activateButton.disabled =
                true;
        } else {
            claimStatus.className =
                "alert alert-warning";
            claimStatus.innerHTML = `
                <strong>
                    Administrator claim not found.
                </strong>
                <br>
                Firebase currently sees:
                <code>
                    admin: ${String(
                        claims.admin
                    )}
                </code>
                <br><br>
                Your UID:
                <code>
                    ${currentUser.uid}
                </code>
            `;
            status.textContent =
                "Your account is logged in, but admin privileges are not currently present in the ID token.";
            activateButton.textContent =
                "Activate Admin";
            activateButton.disabled =
                false;
        }
    } catch (error) {
        console.error(
            "ADMIN CLAIM CHECK ERROR:",
            error
        );
        claimStatus.style.display =
            "block";
        claimStatus.className =
            "alert alert-danger";
        claimStatus.textContent =
            "Unable to check administrator status: " +
            (
                error.message ||
                "Unknown error"
            );
    }
}
/* =========================================================
   AUTHENTICATION
========================================================= */
onAuthStateChanged(
    auth,
    async (user) => {
        if (!user) {
            currentUser =
                null;
            status.textContent =
                "You are not logged in. Please log in first.";
            activateButton.disabled =
                true;
            claimStatus.style.display =
                "none";
            return;
        }
        currentUser =
            user;
        status.textContent =
            "Logged in as: " +
            (
                user.email ||
                "Firebase user"
            );
        activateButton.disabled =
            true;
        /*
         * Check whether admin claim already exists.
         */
        await checkAdminClaim();
    }
);
/* =========================================================
   ACTIVATE ADMIN
========================================================= */
activateButton.addEventListener(
    "click",
    async () => {
        if (!currentUser) {
            status.textContent =
                "Please wait for your account to load.";
            return;
        }
        try {
            activateButton.disabled =
                true;
            activateButton.textContent =
                "Activating...";
            /*
             * Get current Firebase ID token.
             */
            const idToken =
                await currentUser.getIdToken(
                    true
                );
            /*
             * Send authenticated request
             * to the protected backend.
             */
            const response =
                await fetch(
                    "/api/set-admin",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json",
                            "Authorization":
                                "Bearer " +
                                idToken
                        }
                    }
                );
            const result =
                await response.json();
            if (!response.ok) {
                throw new Error(
                    result.message ||
                    "Unable to activate admin."
                );
            }
            /*
             * Force a fresh token after
             * the Admin SDK changes the claim.
             */
            await currentUser.getIdToken(
                true
            );
            /*
             * Read the new claim.
             */
            const tokenResult =
                await currentUser.getIdTokenResult();
            const claims =
                tokenResult.claims;
            console.log(
                "ADMIN CLAIMS AFTER ACTIVATION:",
                claims
            );
            console.log(
                "ADMIN VALUE AFTER ACTIVATION:",
                claims.admin
            );
            if (
                claims.admin === true
            ) {
                claimStatus.style.display =
                    "block";
                claimStatus.className =
                    "alert alert-success";
                claimStatus.innerHTML = `
                    <strong>
                        Admin activated successfully!
                    </strong>
                    <br>
                    Firebase confirms:
                    <code>
                        admin: true
                    </code>
                    <br><br>
                    UID:
                    <code>
                        ${currentUser.uid}
                    </code>
                `;
                status.textContent =
                    "Administrator privileges are now active.";
                activateButton.textContent =
                    "Admin Activated";
                activateButton.disabled =
                    true;
            } else {
                claimStatus.style.display =
                    "block";
                claimStatus.className =
                    "alert alert-warning";
                claimStatus.innerHTML = `
                    Admin activation endpoint
                    responded successfully, but the
                    refreshed ID token does not contain
                    <code>admin: true</code> yet.
                    <br><br>
                    Current value:
                    <code>
                        ${String(
                            claims.admin
                        )}
                    </code>
                `;
                status.textContent =
                    "Admin activation requires another token refresh.";
                
                activateButton.disabled =
                    false;
                activateButton.textContent =
                    "Activate Admin";
            }
        } catch (error) {
            console.error(
                "ADMIN ACTIVATION ERROR:",
                error
            );
            status.textContent =
                error.message ||
                "Unable to activate admin.";
            claimStatus.style.display =
                "block";
            claimStatus.className =
                "alert alert-danger";
            claimStatus.textContent =
                error.message ||
                "Unable to activate admin.";
            activateButton.disabled =
                false;
            activateButton.textContent =
                "Activate Admin";
        }
    }
);
</script>
</body>
</html>
