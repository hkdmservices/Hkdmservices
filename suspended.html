<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Suspended | HKDMservices</title>

    <script src="theme.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">

    <style>
        html[data-theme="dark"] body {
            background: #0d1117;
            color: #f1f3f5;
        }
        html[data-theme="dark"] .card {
            background: #161b22 !important;
            border-color: #30363d !important;
            color: #f1f3f5 !important;
        }
        html[data-theme="dark"] .text-muted {

        body {

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f5f7fa;
            transition: background 0.3s ease;
        }

        .suspended-card {
            max-width: 520px;
            width: 100%;
            border-radius: 16px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .suspended-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(220, 53, 69, 0.12);
            color: #dc3545;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            margin-bottom: 20px;
        }

        .suspended-card h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .suspended-card p {
            color: #6c757d;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        html[data-theme="dark"] .suspended-card p {
            color: #8b949e;
        }

        .contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #198754;
            color: #fff !important;
            border: none;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s ease;
        }
        .contact-btn:hover {
            background: #146c43;
        }

        .home-link {
            display: block;
            margin-top: 20px;
            color: #6c757d;
            font-size: 0.85rem;
            text-decoration: none;
        }
        .home-link:hover {
            color: #198754;
        }
        html[data-theme="dark"] .home-link {
            color: #8b949e;
        }

        .logout-note {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #dee2e6;
            font-size: 0.8rem;
            color: #8b949e;
        }
        html[data-theme="dark"] .logout-note {
            border-top-color: #30363d;
        }
    </style>
</head>

        <a href="index.html" class="home-link">

        <div class="logout-note">
            <i class="bi bi-info-circle"></i>
            If you'd like to log out and try a different account,
            <a href="login.html" style="color:#dc3545;">click here</a>.
        </div>

    </div>
